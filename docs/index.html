    const gs = graphemes(item.w);
    let k = 0, solved = false, firstTry = true; Guard.start();
    const msg = h('p', { class: 'sub' }, g('לחץ', 'לחצי') + ' על האותיות לפי הסדר, משמאל לימין, ' + g('ותראה', 'ותראי') + ' איך כל אחת נשמעת.');
    const blend = h('div', { class: 'blend', dir: 'rtl' });
    const ask = h('div', { class: 'hidden' });
    const extra = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('read', earned, () => StageRead(), 6); else play();
    });

    const tiles = gs.map((gr, i) => {
      const b = h('button', { class: 'rtile' + (i === 0 ? ' next' : ''), type: 'button' }, en(fmt(gr)), h('span', { class: 'hs' }));
      b.addEventListener('click', () => {
        if (i !== k) { if (i > k) shake(tiles[k]); return; }
        $('.hs', b).textContent = soundOf(gr);
        b.classList.remove('next'); b.classList.add('done'); pop(b);
        k++;
        blend.textContent = hebReading(gs, k);
        if (k < gs.length) { tiles[k].classList.add('next'); return; }
        msg.textContent = 'ביחד זה נשמע ככה. עכשיו, מה המילה?';
        pop(blend); ask.classList.remove('hidden'); enter(ask);
        ask.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      return b;
    });
    const ts = Math.min(64, slotSizeFor(gs.length, 70));
    tiles.forEach(t => { t.style.minWidth = ts + 'px'; });

    const others = shuffle(WORDS.filter(w => w.w !== item.w && w.e !== item.e && w.L <= state.level));
    const opts = [item];
    for (const w of others) { if (opts.length === 3) break; if (!opts.some(o => o.e === w.e)) opts.push(w); }
    const choices = h('div', { class: 'choices pics' }, shuffle(opts).map(o => {
      const b = h('button', { class: 'choice', type: 'button', 'aria-label': o.he }, o.e);
      b.addEventListener('click', () => {
        if (solved) return;
        if (o === item) {
          solved = true; b.classList.add('right'); pop(b); burst(b); earned += Guard.star('read');
          Mastery.rec('W:' + item.w, firstTry);
          msg.innerHTML = ''; msg.append(g('קראת', 'קראת') + ': ', en(fmt(item.w)), ` = ${item.he} 🎉`);
          const t = tipEl(item.tip); if (t) { extra.append(t); enter(t); }
          nextBtn.classList.remove('hidden');
          Speech.en(item.w, .7);
          saveAt(round + 1 < ROUNDS ? round + 1 : round);
        } else {
          b.classList.add('wrong'); shake(b); firstTry = false; Guard.miss();
          msg.textContent = 'כמעט! ' + g('קרא', 'קראי') + ' שוב את הצלילים למעלה 🙂';
        }
      });
      return b;
    }));
    ask.append(h('div', { class: 'prompt', style: 'margin-top:14px' }, 'איזו תמונה מתאימה למילה?'), choices);

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, g('קרא', 'קראי') + ' את המילה באנגלית'),
      h('div', { class: 'read-tiles' }, tiles), blend, msg, ask, extra, nextBtn);
    enter($('.read-tiles', app));
  }
  play();
}

/* =========================================================
   Stage 7: מדברים (everyday phrases and when to say them)
   Listening stage, so phrases are not limited to the letters learned.
   The level sets how hard the language is:
   1 = manners and greetings, 2 = me, feelings, playing, 3 = questions and requests.
   he / replyHe can be [boy, girl] when the child is the speaker.
   when = the situation, written without gender ("כשפוגשים...").
   grp = phrases that fit the same situation, never shown together as options.
   ========================================================= */
const PHRASES = [
  { L:1, p:'Hello!', he:'שלום!', e:'👋', when:'כשפוגשים מישהו', grp:'hi' },
  { L:1, p:'Good morning!', he:'בוקר טוב!', e:'🌅', when:'כשנפגשים בבוקר', grp:'hi' },
  { L:1, p:'Good night!', he:'לילה טוב!', e:'🌙', when:'לפני שהולכים לישון', grp:'bye' },
  { L:1, p:'Goodbye!', he:'להתראות!', e:'🚶', when:'כשנפרדים ממישהו והולכים', grp:'bye' },
  { L:1, p:'Thank you!', he:'תודה!', e:'🙏', when:'כשמישהו נותן לנו משהו או עוזר לנו', reply:"You're welcome!", replyHe:'בבקשה, על לא דבר!' },
  { L:1, p:'Please.', he:'בבקשה.', e:'🥺', when:'כשמבקשים משהו בנימוס' },
  { L:1, p:'Sorry!', he:'סליחה!', e:'😔', when:'כשעשינו משהו לא בכוונה, למשל נתקלנו במישהו', reply:"It's OK.", replyHe:'זה בסדר.', grp:'sorry' },
  { L:1, p:'How are you?', he:'מה שלומך?', e:'🙂', when:'כשרוצים לדעת איך מישהו מרגיש', reply:"I'm fine, thank you!", replyHe:'אני בסדר, תודה!', grp:'how' },
  { L:1, p:"I'm fine, thank you!", he:'אני בסדר, תודה!', e:'👌', when:'כשמישהו שואל מה שלומנו', grp:'how' },
  { L:1, p:'Yes, please!', he:'כן, בבקשה!', e:'😋', when:'כשמציעים לנו משהו שאנחנו רוצים', grp:'offer' },
  { L:1, p:'No, thank you.', he:'לא, תודה.', e:'✋', when:'כשמציעים לנו משהו שאנחנו לא רוצים', grp:'offer' },
  { L:1, p:'Happy birthday!', he:'יום הולדת שמח!', e:'🎂', when:'ביום ההולדת של מישהו', reply:'Thank you!', replyHe:'תודה!' },
  { L:1, p:'I love you!', he:['אני אוהב אותך!', 'אני אוהבת אותך!'], e:'❤️', when:'כשרוצים להגיד למישהו קרוב שהוא חשוב לנו' },

  { L:2, p:"What's your name?", he:'איך קוראים לך?', e:'🏷️', when:'כשפוגשים ילד חדש ורוצים לדעת את השם שלו', reply:'My name is Dan.', replyHe:'קוראים לי דן.' },
  { L:2, p:'Nice to meet you!', he:'נעים להכיר!', e:'🤝', when:'כשפוגשים מישהו בפעם הראשונה', reply:'Nice to meet you too!', replyHe:'גם לי נעים להכיר!' },
  { L:2, p:"I'm hungry.", he:['אני רעב.', 'אני רעבה.'], e:'🍽️', when:'כשרוצים לאכול' },
  { L:2, p:"I'm thirsty.", he:['אני צמא.', 'אני צמאה.'], e:'🥤', when:'כשרוצים לשתות' },
  { L:2, p:"I'm tired.", he:['אני עייף.', 'אני עייפה.'], e:'🥱', when:'כשרוצים לנוח או לישון' },
  { L:2, p:"I'm happy!", he:['אני שמח!', 'אני שמחה!'], e:'😄', when:'כשמרגישים טוב ושמחים', grp:'good' },
  { L:2, p:"Let's play!", he:'בואו נשחק!', e:'🎲', when:'כשרוצים להזמין חברים לשחק', reply:'Yes!', replyHe:'כן!' },
  { L:2, p:'I like it!', he:['אני אוהב את זה!', 'אני אוהבת את זה!'], e:'😍', when:'כשמשהו מוצא חן בעינינו', grp:'good' },
  { L:2, p:"I don't like it.", he:['אני לא אוהב את זה.', 'אני לא אוהבת את זה.'], e:'😖', when:'כשמשהו לא מוצא חן בעינינו' },
  { L:2, p:'Good job!', he:'כל הכבוד!', e:'👏', when:'כשמישהו הצליח במשהו', reply:'Thank you!', replyHe:'תודה!' },
  { L:2, p:'Can I help you?', he:'אפשר לעזור לך?', e:'🤲', when:'כשרואים שמישהו צריך עזרה', reply:'Yes, please!', replyHe:'כן, בבקשה!' },
  { L:2, p:'Wait for me!', he:'חכו לי!', e:'🏃', when:'כשהחברים הולכים מהר ורוצים שיחכו לנו' },

  { L:3, p:'Can I have water, please?', he:'אפשר לקבל מים, בבקשה?', e:'💧', when:'כשצמאים ומבקשים מים בנימוס', reply:'Here you are.', replyHe:'הנה, בבקשה.' },
  { L:3, p:'Excuse me.', he:'סליחה (כשפונים למישהו)', e:'🙋', when:'כשרוצים לפנות למישהו או לעבור לידו', grp:'sorry' },
  { L:3, p:'Where is the bathroom?', he:'איפה השירותים?', e:'🚻', when:'כשמחפשים שירותים במקום חדש' },
  { L:3, p:"I don't understand.", he:['אני לא מבין.', 'אני לא מבינה.'], e:'🤷', when:'כשמישהו אומר משהו ולא הבנו', grp:'again' },
  { L:3, p:'Can you say it again, please?', he:'אפשר להגיד את זה שוב, בבקשה?', e:'🔁', when:'כשלא שמענו טוב ורוצים לשמוע שוב', grp:'again' },
  { L:3, p:'What time is it?', he:'מה השעה?', e:'🕒', when:'כשרוצים לדעת מה השעה', reply:"It's three o'clock.", replyHe:'השעה שלוש.' },
  { L:3, p:'See you tomorrow!', he:'נתראה מחר!', e:'📅', when:'כשנפרדים ממישהו שנפגוש שוב מחר', grp:'bye' },
  { L:3, p:'How old are you?', he:'מה הגיל שלך?', e:'🎈', when:'כשרוצים לדעת מה הגיל של מישהו', reply:"I'm nine.", replyHe:['אני בן תשע.', 'אני בת תשע.'] },
  { L:3, p:'I need help.', he:['אני צריך עזרה.', 'אני צריכה עזרה.'], e:'🆘', when:'כשמשהו קשה מדי ורוצים שיעזרו לנו' },
  { L:3, p:'Can I play with you?', he:'אפשר לשחק איתכם?', e:'🧸', when:'כשרוצים להצטרף למשחק של ילדים אחרים', reply:'Sure!', replyHe:'בטח!' },
  { L:3, p:"Sorry, I'm late.", he:'סליחה שאיחרתי.', e:'⏰', when:'כשמגיעים אחרי שכולם כבר התחילו', grp:'sorry' },
  { L:3, p:'Have a nice day!', he:'שיהיה לך יום נעים!', e:'☀️', when:'כשנפרדים ממישהו בבוקר או באמצע היום', grp:'bye' },
];
const heOf = x => Array.isArray(x) ? g(x[0], x[1]) : x;
const phraseWords = p => p.replace(/[.,!?]/g, '').split(' ');
const findPhrase = s => PHRASES.find(x => x.p === s);
const sayPhrase = (s, rate = .8) => Speech.en(s, rate);
// kinds of rounds by level: hear = what did they say (Hebrew options), say = what do we say (English options), order = build the sentence
const TALK_KINDS = { 1: ['hear', 'say'], 2: ['hear', 'say'], 3: ['hear', 'say', 'order'] };

function StageTalk(res) {
  let list, kinds, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findPhrase).filter(Boolean); kinds = res.kinds; round = res.round || 0; earned = res.earned || 0; }
  else {
    const pool = PHRASES.filter(x => x.L <= state.level);
    const weak = shuffle(pool.filter(x => Mastery.isWeak('P:' + x.p))).slice(0, 2);
    const cur = shuffle(PHRASES.filter(x => x.L === state.level && !weak.includes(x)));
    const prev = shuffle(pool.filter(x => x.L < state.level && !weak.includes(x)));
    list = [...weak, ...cur.slice(0, 4), ...prev, ...cur.slice(4)].slice(0, 6);
    const ks = TALK_KINDS[state.level];
    kinds = list.map((x, i) => {
      const k = ks[i % ks.length];
      return k === 'order' && phraseWords(x.p).length < 3 ? 'hear' : k;   // one or two words are too short to order
    });
  }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('talk', { list: list.map(x => x.p), kinds, round: r, earned });
  const ear = (text, cls = 'ear') => h('button', { class: cls, type: 'button', 'aria-label': 'השמע', onclick: e => { e.stopPropagation(); sayPhrase(text); } }, '🔊');
  // 2 wrong options from the same levels, never from the same situation group
  const others = item => {
    const out = [];
    for (const x of shuffle(PHRASES.filter(x => x.L <= state.level && x !== item))) {
      if (out.length === 2) break;
      if (item.grp && x.grp === item.grp) continue;
      if (out.some(o => heOf(o.he) === heOf(x.he))) continue;
      out.push(x);
    }
    return out;
  };

  function play() {
    saveAt(round);
    const app = screen('מדברים');
    const item = list[round], kind = kinds[round];
    let solved = false, firstTry = true, onWin = null; Guard.start();
    const say = () => sayPhrase(item.p);
    const msg = h('p', { class: 'sub' });
    const card = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('talk', earned, () => StageTalk()); else play();
    });
    function win(el) {
      solved = true; if (el) { el.classList.add('right'); pop(el); burst(el); }
      if (onWin) onWin();
      earned += Guard.star('talk');
      Mastery.rec('P:' + item.p, firstTry);
      msg.textContent = 'נכון! 🎉';
      const reply = item.reply ? h('p', null, '💬 עונים: ', en(item.reply), ear(item.reply, 'mini-ear'), h('br'), heOf(item.replyHe)) : null;
      const c = h('div', { class: 'hint blue say-card' },
        h('span', { class: 'big-en en' }, item.p), ear(item.p, 'mini-ear'),
        h('p', null, h('b', null, heOf(item.he))),
        h('p', null, '💡 אומרים את זה ', item.when),
        reply, speakBox(item.p));
      card.append(c); enter(c);
      nextBtn.classList.remove('hidden');
      say();
      saveAt(round + 1 < ROUNDS ? round + 1 : round);
      setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }), 300);
    }
    function miss(el, ...parts) {
      firstTry = false; Guard.miss();
      if (el) { el.classList.add('wrong'); shake(el); }
      msg.innerHTML = ''; msg.append(...parts);
    }

    let body;
    if (kind === 'hear') {
      msg.textContent = g('לחץ', 'לחצי') + ' על התמונה כדי לשמוע שוב';
      const opts = shuffle([item, ...others(item)]);
      // the picture would give the answer away, so it shows up only after a right answer
      const pic = speakerPic('👂', say);
      onWin = () => { $('.emoji', pic).textContent = item.e; pop(pic); };
      body = [h('div', { class: 'prompt' }, 'מה אמרו באנגלית?'), pic, msg,
        h('div', { class: 'opts' }, opts.map(o => h('button', { class: 'opt', type: 'button', onclick: e => {
          if (solved) return;
          if (o === item) win(e.currentTarget); else { miss(e.currentTarget, 'כמעט! ' + g('הקשב', 'הקשיבי') + ' שוב ' + g('ונסה', 'ונסי') + ' עוד פעם 🙂'); say(); }
        } }, heOf(o.he))))];
      setTimeout(say, 350);
    } else if (kind === 'say') {
      msg.textContent = g('לחץ', 'לחצי') + ' על 🔊 כדי לשמוע כל תשובה, ואז ' + g('בחר', 'בחרי') + ' את הנכונה.';
      const opts = shuffle([item, ...others(item)]);
      body = [h('div', { class: 'pic still' }, h('span', { class: 'emoji' }, item.e)),
        h('div', { class: 'situation' }, 'מה אומרים ', item.when, '?'), msg,
        h('div', { class: 'opts' }, opts.map(o => h('div', { class: 'opt-row' },
          h('button', { class: 'opt en', type: 'button', onclick: e => {
            if (solved) return;
            if (o === item) win(e.currentTarget); else miss(e.currentTarget, 'לא בדיוק. ', en(o.p), ` זה "${heOf(o.he)}". ` + g('נסה', 'נסי') + ' שוב 🙂');
          } }, o.p),
          ear(o.p))))];
    } else {
      const words = phraseWords(item.p);
      let k = 0;
      msg.textContent = g('לחץ', 'לחצי') + ' על המילים לפי הסדר, משמאל לימין.';
      const line = h('div', { class: 'phrase-line' });
      const chips = h('div', { class: 'chips' }, shuffle(words.map((w, i) => ({ w, i }))).map(({ w }) => {
        const b = h('button', { class: 'chip en', type: 'button' }, w);
        b.addEventListener('click', () => {
          if (solved) return;
          if (w !== words[k]) { firstTry = false; Guard.miss(); shake(b); msg.textContent = 'לא המילה הזו. ' + g('הקשב', 'הקשיבי') + ' שוב 🙂'; say(); return; }
          b.classList.add('used');
          const placed = h('span', { class: 'chip en placed' }, w); line.append(placed); pop(placed);
          k++;
          if (k === words.length) { chips.style.display = 'none'; win(null); }
        });
        return b;
      }));
      body = [h('div', { class: 'prompt' }, g('סדר', 'סדרי') + ' את המשפט ששומעים'), speakerPic(item.e, say),
        h('p', { class: 'situation' }, heOf(item.he)), line, chips, msg];
      setTimeout(say, 350);
    }
    app.append(progressDots(ROUNDS, round), ...body.filter(Boolean), card, nextBtn);
    enter($('.opts', app) || $('.chips', app));
  }
  play();
}

/* =========================================================
   Stage 8: מילים מחברות (the small words every sentence needs)
   Hebrew has no "am / is / are" in the present ("אני שמח"), so Hebrew speakers tend to say "I happy".
   These words can't be sounded out either, so they are learned by ear and by sight.
   he can be [boy, girl] when the child is the speaker.
   ========================================================= */
const LINKS = {
  I: { he: 'אני', ex: 'I am happy.' },
  you: { he: 'אתה / את', ex: 'You are my friend.' },
  he: { he: 'הוא', ex: 'He is my brother.' },
  she: { he: 'היא', ex: 'She is my sister.' },
  it: { he: 'זה (דבר או חיה)', ex: 'It is a cat.' },
  we: { he: 'אנחנו', ex: 'We are friends.' },
  my: { he: 'שלי', ex: 'This is my bag.' },
  this: { he: 'זה / זאת (מה שקרוב אלינו)', ex: 'This is my dog.' },
  the: { he: 'ה־ (כמו בהכלב)', ex: 'Where is the cat?' },
  have: { he: 'יש לי (אחרי I)', ex: 'I have a dog.' },
  like: { he: ['אוהב', 'אוהבת'], ex: 'I like pizza.' },
  can: { he: ['יכול', 'יכולה'], ex: 'I can swim.' },
  want: { he: 'רוצה', ex: 'I want water.' },
  where: { he: 'איפה', ex: 'Where is my bag?' },
};
const BE = ['am', 'is', 'are'];
// "I ___ happy": which word joins the sentence. he = what the whole sentence means.
const BE_ITEMS = [
  { s: 'I', b: 'am', r: 'happy.', he: ['אני שמח.', 'אני שמחה.'], e: '😄' },
  { s: 'I', b: 'am', r: 'nine.', he: ['אני בן תשע.', 'אני בת תשע.'], e: '9️⃣' },
  { s: 'You', b: 'are', r: 'my friend.', he: 'אתה החבר שלי. (או: את החברה שלי.)', e: '🤝' },
  { s: 'We', b: 'are', r: 'friends.', he: 'אנחנו חברים.', e: '👫' },
  { s: 'It', b: 'is', r: 'a cat.', he: 'זה חתול.', e: '🐱' },
  { s: 'It', b: 'is', r: 'big.', he: 'זה גדול.', e: '🐘' },
  { s: 'He', b: 'is', r: 'my brother.', he: 'הוא אח שלי.', e: '👦' },
  { s: 'She', b: 'is', r: 'my sister.', he: 'היא אחות שלי.', e: '👧' },
];
const BE_TIP = { am: 'אחרי I תמיד באה המילה am.', is: 'אחרי he, ‏she ו־it באה המילה is.', are: 'אחרי you ו־we באה המילה are.' };
// "___ apple": a, or an before a vowel sound
const AAN_ITEMS = [['apple', '🍎'], ['egg', '🥚'], ['ant', '🐜'], ['owl', '🦉'], ['orange', '🍊'], ['umbrella', '☂️'], ['cat', '🐱'], ['dog', '🐶'], ['ball', '⚽'], ['bus', '🚌'], ['fish', '🐟'], ['hat', '👒']];
const anOf = w => /^[aeiou]/.test(w) ? 'an' : 'a';
// Hebrew text with English words inside: each English run gets its own left-to-right island, so the order stays right
const bi = t => String(t).split(/([A-Za-z][A-Za-z0-9]*(?:['’ ][A-Za-z0-9]+)*)/).filter(Boolean).map((p, i) => /^[A-Za-z]/.test(p) ? en(p) : p);
const LINK_SETS = { 1: ['I', 'am', 'it', 'is', 'a', 'an'], 2: ['my', 'this', 'have', 'like', 'the'], 3: ['you', 'are', 'he', 'she', 'we', 'can', 'want', 'where'] };

function StageLink(res) {
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list; round = res.round || 0; earned = res.earned || 0; }
  else {
    const set = (Run && Run.links) || LINK_SETS[state.level] || LINK_SETS[1];
    const mean = set.filter(w => LINKS[w]).map(w => ({ t: 'mean', w }));
    const beWords = set.filter(w => BE.includes(w));
    const be = beWords.length ? [...new Set([...shuffle(BE_ITEMS.filter(x => beWords.includes(x.b))), ...shuffle(BE_ITEMS)])].slice(0, 3).map(x => ({ t: 'be', i: BE_ITEMS.indexOf(x) })) : [];
    const aan = set.some(w => w === 'a' || w === 'an') ? shuffle(AAN_ITEMS).slice(0, 2).map(x => ({ t: 'aan', i: AAN_ITEMS.indexOf(x) })) : [];
    // the meaning of each word first, then using them
    list = [...shuffle(mean).slice(0, 4), ...shuffle([...be, ...aan])].slice(0, (Run && Run.rounds) || 8);
  }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('link', { list, round: r, earned });
  const ear = (text, cls = 'ear') => h('button', { class: cls, type: 'button', 'aria-label': 'השמע', onclick: e => { e.stopPropagation(); Speech.en(text, .8); } }, '🔊');

  function play() {
    saveAt(round);
    const app = screen('מילים מחברות');
    const it = list[round];
    let solved = false, firstTry = true; Guard.start();
    const msg = h('p', { class: 'sub' }), card = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => { round++; if (round >= ROUNDS) EndScreen('link', earned, () => StageLink()); else play(); });
    let key, model, body;
    const win = (el, extra) => {
      solved = true; if (el) { el.classList.add('right'); pop(el); burst(el); }
      earned += Guard.star('link');
      Mastery.rec(key, firstTry);
      msg.textContent = 'נכון! 🎉';
      const c = h('div', { class: 'hint blue say-card' }, h('span', { class: 'big-en en' }, model), ear(model, 'mini-ear'), ...extra, speakBox(model));
      card.append(c); enter(c); nextBtn.classList.remove('hidden');
      Speech.en(model, .8);
      saveAt(round + 1 < ROUNDS ? round + 1 : round);
      setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }), 300);
    };
    const miss = (el, text) => { firstTry = false; Guard.miss(); if (el) { el.classList.add('wrong'); shake(el); } msg.replaceChildren(...bi(text)); };
    const optBtns = (opts, right, onWrong, isEn) => h('div', { class: 'opts' + (isEn ? ' row-opts' : '') }, opts.map(o => h('button', { class: 'opt' + (isEn ? ' en' : ''), type: 'button', onclick: e => {
      if (solved) return; if (o === right) win(e.currentTarget, it.t === 'mean' ? [h('p', null, h('b', null, en(it.w), ' = ', heOf(LINKS[it.w].he)))] : it.t === 'be' ? [h('p', null, heOf(BE_ITEMS[it.i].he)), h('p', null, '💡 ', ...bi(BE_TIP[right]))] : [h('p', null, '💡 ', ...bi('לפני מילה שמתחילה ב־a, e, i, o, u אומרים an.'))]); else onWrong(e.currentTarget, o);
    } }, o)));

    if (it.t === 'mean') {
      const w = it.w, L = LINKS[w]; key = 'K:' + w; model = L.ex;
      const others = shuffle(Object.keys(LINKS).filter(x => x !== w && heOf(LINKS[x].he) !== heOf(L.he))).slice(0, 2);
      const opts = shuffle([w, ...others]);
      const say = () => Speech.en(w, .7);
      msg.textContent = g('לחץ', 'לחצי') + ' על המילה כדי לשמוע אותה.';
      body = [h('div', { class: 'prompt' }, 'מה המילה הזו אומרת?'),
        h('button', { class: 'pic link-word', type: 'button', onclick: say }, h('span', { class: 'en big-word' }, w), h('span', { class: 'say' }, '🔊 להקשיב')), msg,
        h('div', { class: 'opts' }, opts.map(o => h('button', { class: 'opt', type: 'button', onclick: e => {
          if (solved) return;
          if (o === w) win(e.currentTarget, [h('p', null, h('b', null, en(w), ' = ', heOf(L.he)))]);
          else miss(e.currentTarget, `לא בדיוק: ${o} זה "${heOf(LINKS[o].he)}". ` + g('נסה', 'נסי') + ' שוב 🙂');
        } }, heOf(LINKS[o].he))))];
      setTimeout(say, 350);
    } else if (it.t === 'be') {
      const x = BE_ITEMS[it.i]; key = 'K:' + x.b; model = `${x.s} ${x.b} ${x.r}`;
      msg.textContent = g('בחר', 'בחרי') + ' את המילה שמחברת את המשפט.';
      body = [h('div', { class: 'prompt' }, 'איזו מילה חסרה?'), h('div', { class: 'pic still' }, h('span', { class: 'emoji' }, x.e)),
        h('p', { class: 'situation' }, heOf(x.he)),
        h('div', { class: 'gap-line en' }, x.s, ' ', h('span', { class: 'gap' }, '___'), ' ', x.r), msg,
        optBtns(BE, x.b, (el, o) => miss(el, `לא ${o}. ` + BE_TIP[x.b] + ' ' + g('נסה', 'נסי') + ' שוב 🙂'), true)];
    } else {
      const [w, e] = AAN_ITEMS[it.i], right = anOf(w); key = 'K:aan'; model = `${right} ${w}`;
      msg.replaceChildren(...bi('a או an? ' + g('הקשב', 'הקשיבי') + ' לצליל הראשון של המילה.'));
      body = [h('div', { class: 'prompt' }, 'מה בא לפני המילה?'), h('button', { class: 'pic', type: 'button', onclick: () => Speech.en(w, .8) }, h('span', { class: 'emoji' }, e), h('span', { class: 'say' }, '🔊 ' + w)),
        h('div', { class: 'gap-line en' }, h('span', { class: 'gap' }, '___'), ' ', w), msg,
        optBtns(['a', 'an'], right, el => miss(el, right === 'an' ? `${w} מתחילה בתנועה (${w[0]}), אז אומרים an.` : `${w} מתחילה ב־${w[0]}, שזו לא תנועה, אז אומרים a.`), true)];
    }
    app.append(progressDots(ROUNDS, round), ...body.filter(Boolean), card, nextBtn);
    enter($('.opts', app));
  }
  play();
}

/* =========================================================
   Stage 9: בונים משפט (sentence frames)
   Children get to conversation through fixed frames ("I am ___", "I like ___") filled with words they know.
   Rounds: hear it and pick the meaning, build it from word chips, and fill the missing word.
   en / he / e can be [boy, girl] when the child is the speaker. k = the word the gap round hides.
   gap: 'be' hides am/is/are, 'article' hides a/an, otherwise the main word.
   ========================================================= */
const FRAMES = {
  iam: { L: 1, f: 'I am …', gap: 'be', items: [

    { en: 'I am nine.', he: ['אני בן תשע.', 'אני בת תשע.'], e: '9️⃣' },
    { en: ['I am a boy.', 'I am a girl.'], he: ['אני ילד.', 'אני ילדה.'], e: ['👦', '👧'] },

    { en: 'It is big.', he: 'זה גדול.', e: '🐘' },
    { en: 'It is hot.', he: 'חם.', e: '☀️' },
  ] },
  ihave: { L: 2, f: 'I have …', items: [
    { en: 'I have a dog.', he: 'יש לי כלב.', e: '🐶' },
    { en: 'I have a cat.', he: 'יש לי חתול.', e: '🐱' },
    { en: 'I have a red ball.', he: 'יש לי כדור אדום.', e: '🔴' },
    { en: 'I have a bike.', he: 'יש לי אופניים.', e: '🚲' },
    { en: 'I have an egg.', he: 'יש לי ביצה.', e: '🥚' },
    { en: 'I have two hands.', he: 'יש לי שתי ידיים.', e: '🙌' },
  ] },
  ilike: { L: 2, f: 'I like …', items: [
    { en: 'I like pizza.', he: ['אני אוהב פיצה.', 'אני אוהבת פיצה.'], e: '🍕' },
    { en: 'I like ice cream.', he: ['אני אוהב גלידה.', 'אני אוהבת גלידה.'], e: '🍦', k: 'ice cream' },
    { en: 'I like cats.', he: ['אני אוהב חתולים.', 'אני אוהבת חתולים.'], e: '🐈' },
    { en: 'I like dogs.', he: ['אני אוהב כלבים.', 'אני אוהבת כלבים.'], e: '🐕' },
    { en: 'I like milk.', he: ['אני אוהב חלב.', 'אני אוהבת חלב.'], e: '🥛' },
    { en: 'I like to swim.', he: ['אני אוהב לשחות.', 'אני אוהבת לשחות.'], e: '🏊' },
  ] },
  thisis: { L: 2, f: 'This is my …', items: [
    { en: 'This is my mom.', he: 'זאת אמא שלי.', e: '👩' },
    { en: 'This is my dad.', he: 'זה אבא שלי.', e: '👨' },
    { en: 'This is my bag.', he: 'זה התיק שלי.', e: '🎒' },
    { en: 'This is my room.', he: 'זה החדר שלי.', e: '🛏️' },
    { en: 'This is my book.', he: 'זה הספר שלי.', e: '📕' },
    { en: 'This is my cat.', he: 'זה החתול שלי.', e: '🐈' },
  ] },
  heshe: { L: 3, f: 'He is / She is …', gap: 'be', items: [
    { en: 'He is my brother.', he: 'הוא אח שלי.', e: '👦' },
    { en: 'She is my sister.', he: 'היא אחות שלי.', e: '👧' },

  ] },
  ican: { L: 3, f: 'I can …', items: [
    { en: 'I can run.', he: ['אני יכול לרוץ.', 'אני יכולה לרוץ.'], e: '🏃' },
    { en: 'I can jump.', he: ['אני יכול לקפוץ.', 'אני יכולה לקפוץ.'], e: '🤸' },
    { en: 'I can swim.', he: ['אני יכול לשחות.', 'אני יכולה לשחות.'], e: '🏊' },
    { en: 'I can sing.', he: ['אני יכול לשיר.', 'אני יכולה לשיר.'], e: '🎤' },
    { en: 'I can read.', he: ['אני יכול לקרוא.', 'אני יכולה לקרוא.'], e: '📖' },
    { en: 'I can ride a bike.', he: ['אני יכול לרכוב על אופניים.', 'אני יכולה לרכוב על אופניים.'], e: '🚴', k: 'ride' },
  ] },
  iwant: { L: 3, f: 'I want …', items: [
    { en: 'I want water.', he: 'אני רוצה מים.', e: '💧' },
    { en: 'I want to play.', he: 'אני רוצה לשחק.', e: '🎲' },

    { en: 'I want to go home.', he: 'אני רוצה ללכת הביתה.', e: '🏠' },
    { en: 'I want to sleep.', he: 'אני רוצה לישון.', e: '😴' },
  ] },
  canihave: { L: 3, f: 'Can I have …, please?', items: [
    { en: 'Can I have water, please?', he: 'אפשר לקבל מים, בבקשה?', e: '💧' },
    { en: 'Can I have a ball, please?', he: 'אפשר לקבל כדור, בבקשה?', e: '⚽' },
    { en: 'Can I have an apple, please?', he: 'אפשר לקבל תפוח, בבקשה?', e: '🍎' },
    { en: 'Can I have some juice, please?', he: 'אפשר לקבל קצת מיץ, בבקשה?', e: '🧃' },
    { en: 'Can I have a pencil, please?', he: 'אפשר לקבל עיפרון, בבקשה?', e: '✏️' },
  ] },
  whereis: { L: 3, f: 'Where is …?', items: [
    { en: 'Where is my bag?', he: 'איפה התיק שלי?', e: '🎒' },
    { en: 'Where is the cat?', he: 'איפה החתול?', e: '🐱' },
    { en: 'Where is mom?', he: 'איפה אמא?', e: '👩' },
    { en: 'Where is the ball?', he: 'איפה הכדור?', e: '⚽' },
    { en: 'Where is my shoe?', he: 'איפה הנעל שלי?', e: '👟' },
  ] },
};
const gv = x => Array.isArray(x) ? g(x[0], x[1]) : x;   // boy/girl version of a sentence or a picture
const sText = x => gv(x.en);
const sWords = t => t.replace(/[.,!?]/g, '').split(' ');
// the word a gap round hides, and what the child picks from
function gapOf(x, fk, pool) {
  const t = sText(x), words = sWords(t), mode = FRAMES[fk].gap;
  if (mode === 'be') { const b = words.find(w => BE.includes(w)); if (b) return { k: b, opts: BE, tip: BE_TIP[b] }; }
  if (mode === 'article') { const a = words.find(w => w === 'a' || w === 'an'); if (a) return { k: a, opts: ['a', 'an'], tip: 'לפני מילה שמתחילה ב־a, e, i, o, u אומרים an.' }; }
  const keyOf = y => y.k || [...sWords(sText(y))].reverse().find(w => !SMALL_WORDS.has(w.toLowerCase()) && w !== 'please');
  const k = keyOf(x);
  const others = [...new Set(shuffle(pool.filter(y => y !== x)).map(keyOf))].filter(o => o && o !== k).slice(0, 2);
  return { k, opts: shuffle([k, ...others]) };
}
// "I happy" is what Hebrew speakers say: show how English needs the joining word
const beHint = t => { const w = sWords(t), i = w.findIndex(x => BE.includes(x)); return i > 0 ? `באנגלית לא אומרים ${[...w.slice(0, i), ...w.slice(i + 1)].join(' ')} אלא ${w.join(' ')}. ${BE_TIP[w[i]]}` : null; };
const ALL_SENT = () => Object.entries(FRAMES).flatMap(([fk, F]) => F.items.map(x => ({ ...x, fk })));
const sentByText = t => ALL_SENT().find(x => (Array.isArray(x.en) ? x.en : [x.en]).includes(t));

function StageSentence(res) {
  const keys = (Run && Run.frames) || Object.keys(FRAMES).filter(k => FRAMES[k].L <= state.level);
  const pool = ALL_SENT().filter(x => keys.includes(x.fk));
  let list, kinds, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(sentByText).filter(Boolean); kinds = res.kinds; round = res.round || 0; earned = res.earned || 0; }
  else {
    const weak = shuffle(pool.filter(x => Mastery.isWeak('S:' + sText(x)))).slice(0, 2);
    list = [...weak, ...shuffle(pool.filter(x => !weak.includes(x)))].slice(0, (Run && Run.rounds) || 6);
    kinds = list.map((x, i) => ['meaning', 'build', 'gap'][i % 3]);
  }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('sentence', { list: list.map(sText), kinds, round: r, earned });
  const ear = (text, cls = 'ear') => h('button', { class: cls, type: 'button', 'aria-label': 'השמע', onclick: e => { e.stopPropagation(); Speech.en(text, .8); } }, '🔊');

  function play() {
    saveAt(round);
    const app = screen('בונים משפט');
    const item = list[round], kind = kinds[round], text = sText(item), say = () => Speech.en(text, .8);
    let solved = false, firstTry = true, onWin = null; Guard.start();
    const msg = h('p', { class: 'sub' }), card = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => { round++; if (round >= ROUNDS) EndScreen('sentence', earned, () => StageSentence()); else play(); });
    function win(el) {
      solved = true; if (el) { el.classList.add('right'); pop(el); burst(el); }
      if (onWin) onWin();
      earned += Guard.star('sentence');
      Mastery.rec('S:' + text, firstTry);
      msg.textContent = 'נכון! 🎉';
      const hint = beHint(text);
      const c = h('div', { class: 'hint blue say-card' }, h('span', { class: 'big-en en' }, text), ear(text, 'mini-ear'),
        h('p', null, h('b', null, heOf(item.he))), hint ? h('p', null, '💡 ', ...bi(hint)) : null, speakBox(text));
      card.append(c); enter(c); nextBtn.classList.remove('hidden');
      say();
      saveAt(round + 1 < ROUNDS ? round + 1 : round);
      setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }), 300);
    }
    function miss(el, t) { firstTry = false; Guard.miss(); if (el) { el.classList.add('wrong'); shake(el); } msg.replaceChildren(...bi(t)); }

    let body;
    if (kind === 'meaning') {
      const others = [];
      for (const y of shuffle(pool.filter(y => y !== item))) { if (others.length === 2) break; if (heOf(y.he) !== heOf(item.he) && !others.some(o => heOf(o.he) === heOf(y.he))) others.push(y); }
      const opts = shuffle([item, ...others]);
      const pic = speakerPic('👂', say);
      onWin = () => { $('.emoji', pic).textContent = gv(item.e); pop(pic); };
      msg.textContent = g('לחץ', 'לחצי') + ' על התמונה כדי לשמוע שוב';
      body = [h('div', { class: 'prompt' }, 'מה אמרו באנגלית?'), pic, msg,
        h('div', { class: 'opts' }, opts.map(o => h('button', { class: 'opt', type: 'button', onclick: e => {
          if (solved) return;
          if (o === item) win(e.currentTarget); else { miss(e.currentTarget, 'כמעט! ' + g('הקשב', 'הקשיבי') + ' לכל מילה ' + g('ונסה', 'ונסי') + ' שוב 🙂'); say(); }
        } }, heOf(o.he))))];
      setTimeout(say, 350);
    } else if (kind === 'build') {
      const words = sWords(text);
      // one extra word that does not belong, so the joining word has to be chosen, not just placed
      const be = words.find(w => BE.includes(w)), art = words.find(w => w === 'a' || w === 'an');
      const extra = be ? pick(BE.filter(x => x !== be)) : art ? (art === 'a' ? 'an' : 'a') : null;
      let k = 0;
      msg.textContent = g('לחץ', 'לחצי') + ' על המילים לפי הסדר, משמאל לימין.';
      const line = h('div', { class: 'phrase-line' });
      const chips = h('div', { class: 'chips' }, shuffle([...words.map(w => ({ w })), ...(extra ? [{ w: extra, x: true }] : [])]).map(({ w }) => {
        const b = h('button', { class: 'chip en', type: 'button' }, w);
        b.addEventListener('click', () => {
          if (solved) return;
          if (w !== words[k]) { miss(b, (BE.includes(w) && BE.includes(words[k])) ? 'לא המילה הזו. ' + BE_TIP[words[k]] : 'לא המילה הזו. ' + g('הקשב', 'הקשיבי') + ' שוב 🙂'); b.classList.remove('wrong'); say(); return; }
          b.classList.add('used');
          const placed = h('span', { class: 'chip en placed' }, w); line.append(placed); pop(placed);
          k++;
          if (k === words.length) { chips.style.display = 'none'; win(null); }
        });
        return b;
      }));
      body = [h('div', { class: 'prompt' }, g('בנה', 'בני') + ' את המשפט באנגלית'), speakerPic(gv(item.e), say),
        h('p', { class: 'situation' }, heOf(item.he)), line, chips, msg];
      setTimeout(say, 350);
    } else {
      const gp = gapOf(item, item.fk, pool);
      const words = sWords(text), kw = gp.k.split(' '), at = words.findIndex((w, i) => kw.every((x, j) => words[i + j] === x));
      const before = words.slice(0, at).join(' '), rest = words.slice(at + kw.length).join(' '), after = (rest ? ' ' + rest : '') + (text.match(/[.!?]$/) || [''])[0];
      msg.textContent = g('בחר', 'בחרי') + ' את המילה שחסרה.';
      body = [h('div', { class: 'prompt' }, 'איזו מילה חסרה?'), h('div', { class: 'pic still' }, h('span', { class: 'emoji' }, gv(item.e))),
        gp.tip ? h('p', { class: 'situation' }, heOf(item.he)) : null,
        h('div', { class: 'gap-line en' }, before, before ? ' ' : '', h('span', { class: 'gap' }, '___'), after), msg,
        h('div', { class: 'opts row-opts' }, gp.opts.map(o => h('button', { class: 'opt en', type: 'button', onclick: e => {
          if (solved) return;
          if (o === gp.k) win(e.currentTarget); else miss(e.currentTarget, `לא ${o}. ` + (gp.tip || g('הסתכל', 'הסתכלי') + ' על התמונה ' + g('ונסה', 'ונסי') + ' שוב 🙂'));
        } }, o)))];
    }
    app.append(progressDots(ROUNDS, round), ...body.filter(Boolean), card, nextBtn);
    enter($('.opts', app) || $('.chips', app));
  }
  play();
}

/* =========================================================
   Stage 10: שיחות (a short conversation with turns)
   A character says a line, the child picks the right answer (and can say it out loud), and the talk goes on.
   he / me can be [boy, girl]: in "he" for the character's line it is the child being spoken to,
   in "me" it is the child speaking. {name} = the child's name if it is written in English, else Dan/Dana.

// the child's name inside an English line: only if it is written in English letters, so the English voice can say it
const kidName = () => { const n = (me() && me().name || '').trim(); return /^[A-Za-z][A-Za-z '-]{0,15}$/.test(n) ? n : g('Dan', 'Dana'); };
const kidNameHe = () => { const n = kidName(); return n === g('Dan', 'Dana') ? g('דן', 'דנה') : n; };
const fillName = t => t.replace('{name}', kidName());
const findDialog = id => DIALOGS.find(d => d.id === id);

function StageChat(res) {
  let dlg, round = 0, earned = 0;
  if (res && res.id) { dlg = findDialog(res.id); round = res.round || 0; earned = res.earned || 0; }
  if (!dlg) {
    const ids = (Run && Run.scene) ? [Run.scene] : null;
    const pool = ids ? DIALOGS.filter(d => ids.includes(d.id)) : DIALOGS.filter(d => d.L <= state.level);
    // a conversation that was hard comes back first
    const weak = pool.filter(d => d.turns.some((t, i) => Mastery.isWeak(`C:${d.id}:${i}`)));
    dlg = pick(weak.length && Math.random() < .5 ? weak : pool);
  }
  const ROUNDS = dlg.turns.length;
  const saveAt = r => Resume.save('chat', { id: dlg.id, round: r, earned });
  const ear = (text, cls = 'mini-ear') => h('button', { class: cls, type: 'button', 'aria-label': 'השמע', onclick: e => { e.stopPropagation(); Speech.en(text, .8); } }, '🔊');
  const app = screen('שיחות');
  const log = h('div', { class: 'chat-log' });
  const meAv = () => avatarEl();
  const npcBubble = (t, showHe) => h('div', { class: 'bub npc' }, h('span', { class: 'av' }, dlg.who),
    h('div', { class: 'tx' }, h('span', { class: 'en' }, t.say), ear(t.say), showHe ? h('small', null, heOf(t.he)) : null));
  const myBubble = t => h('div', { class: 'bub mine' }, h('div', { class: 'tx' }, h('span', { class: 'en' }, fillName(t.ok)), ear(fillName(t.ok)), h('small', null, heOf(t.me).replace('{name}', kidNameHe()))), h('span', { class: 'av' }, meAv()));
  // the turns already played (after coming back to it) stay on the screen
  dlg.turns.slice(0, round).forEach(t => log.append(npcBubble(t, true), myBubble(t)));
  const dots = h('div');
  const area = h('div');
  app.append(h('div', { class: 'chat-head' }, h('span', { class: 'e' }, dlg.e), h('b', null, dlg.title)), dots, log, area);

  function turn() {
    saveAt(round);
    dots.replaceChildren(progressDots(ROUNDS, round));
    const t = dlg.turns[round], ok = fillName(t.ok);
    let solved = false, firstTry = true; Guard.start();
    const say = () => Speech.en(t.say, .8);
    const npc = npcBubble(t, false); log.append(npc); enter(npc);
    const msg = h('p', { class: 'sub' }, 'מה ' + g('תענה', 'תעני') + '? ' + g('לחץ', 'לחצי') + ' על 🔊 כדי לשמוע כל תשובה.');
    const heBtn = h('button', { class: 'btn small secondary', type: 'button', onclick: () => {
      // the translation helps, but then the turn is not "first try" any more
      if (!solved) firstTry = false;
      $('.tx', npc).append(h('small', null, heOf(t.he))); heBtn.remove();
    } }, '💡 מה אמרו?');
    const opts = shuffle([ok, ...t.bad]);
    const nextBtn = nextButton(round === ROUNDS - 1, () => { round++; if (round >= ROUNDS) EndScreen('chat', earned, () => StageChat()); else { area.replaceChildren(); turn(); } });
    const optsEl = h('div', { class: 'opts' }, opts.map(o => h('div', { class: 'opt-row' },
      h('button', { class: 'opt en', type: 'button', onclick: e => {
        if (solved) return;
        if (o === ok) {
          solved = true; e.currentTarget.classList.add('right'); pop(e.currentTarget);
          earned += Guard.star('chat');
          Mastery.rec(`C:${dlg.id}:${round}`, firstTry);
          if (!$('small', npc)) $('.tx', npc).append(h('small', null, heOf(t.he)));
          const mine = myBubble(t); log.append(mine); enter(mine);
          optsEl.remove(); heBtn.remove();
          msg.textContent = 'נכון! 🎉';
          nextBtn.before(h('div', { class: 'hint blue say-card' }, speakBox(ok) || h('p', null, ok),
            t.ok.includes('{name}') ? h('p', { style: 'font-size:14px' }, ...bi('💡 כשמדברים באמת, אומרים את השם שלך במקום ' + kidName() + '.')) : null));
          nextBtn.classList.remove('hidden');
          Speech.en(ok, .8);

/* =========================================================
   Stage 11: צירופי אותיות (two letters, one sound: sh, ch, th, ck, ee, oo, ph)
   Words come from the game's word list: only words with one pair from the set, and none where the pair
   breaks its own rule (school, chef: those keep their own tip).
   ========================================================= */
const DIGRAPHS = { sh: 'נשמעות כמו ש', ch: 'נשמעות כמו צ׳', th: 'נשמעות ביחד, כשהלשון בין השיניים', ck: 'נשמעות כמו ק', ee: 'נשמעות כמו אִי', oo: 'נשמעות כמו אוּ', ph: 'נשמעות כמו פ' };
const DG_SETS = { 1: ['sh', 'ch', 'th'], 2: ['ck', 'ee', 'oo', 'ph'] };
const DG_SKIP = ['chef', 'school', 'anchor', 'headache', 'parachute', 'toothbrush', 'mushroom', 'chicken', 'chick', 'cheese', 'sheep', 'three', 'tooth'];
function dgPool(set) {
  const seen = new Set();
  return WORDS.filter(w => !seen.has(w.w) && seen.add(w.w) && !DG_SKIP.includes(w.w) && !(w.w in MANUAL_TIPS) && /^[a-z]+$/.test(w.w)
    && set.filter(p => w.w.includes(p)).length === 1 && Object.keys(DIGRAPHS).filter(p => w.w.includes(p)).length === 1);
}
const dgOf = (w, set) => set.find(p => w.includes(p));

function StageDigraph(res) {
  const set = (Run && Run.pairs) || (state.level >= 2 ? DG_SETS[2] : DG_SETS[1]);
  const pool = dgPool(set);
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round || 0; earned = res.earned || 0; }
  else {
    // every pair of the set comes up, words that were hard come back first
    const weak = shuffle(pool.filter(w => Mastery.isWeak('W:' + w.w))).slice(0, 2);
    const per = set.map(p => shuffle(pool.filter(w => dgOf(w.w, set) === p && !weak.includes(w))));
    const mix = []; for (let i = 0; mix.length < 12 && i < 6; i++) per.forEach(a => { if (a[i]) mix.push(a[i]); });
    list = [...weak, ...mix].slice(0, (Run && Run.rounds) || 8);
  }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('digraph', { list: list.map(w => w.w), round: r, earned });
  function play() {
    saveAt(round);
    const app = screen('צירופי אותיות');
    const w = list[round], pair = dgOf(w.w, set), at = w.w.indexOf(pair), hear = round % 2 === 0;
    let solved = false, firstTry = true; Guard.start();
    const say = () => Speech.en(w.w, .75);
    const msg = h('p', { class: 'sub' }), card = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => { round++; if (round >= ROUNDS) EndScreen('digraph', earned, () => StageDigraph()); else play(); });
    const shown = (blank) => h('div', { class: 'gap-line en' }, fmt(w.w.slice(0, at)), h('span', { class: blank ? 'gap' : 'dg-hi' }, blank ? '__' : fmt(pair)), fmt(w.w.slice(at + pair.length)));
    // hearing round: only the picture and the sound; spelling round: the word with the pair missing
    const word = hear ? h('div', { class: 'gap-line' }, '🔊 ❓') : shown(true);
    const opts = h('div', { class: 'opts row-opts' }, shuffle(set).map(p => h('button', { class: 'opt en', type: 'button', onclick: e => {
      if (solved) return;
      if (p === pair) {
        solved = true; e.currentTarget.classList.add('right'); pop(e.currentTarget); burst(e.currentTarget);
        earned += Guard.star('digraph');
        Mastery.rec('W:' + w.w, firstTry); Mastery.rec('D:' + pair, firstTry);
        word.replaceWith(shown(false));
        msg.textContent = 'נכון! 🎉';
        const c = h('div', { class: 'hint blue say-card' }, h('span', { class: 'big-en en' }, w.w), h('p', null, h('b', null, w.he)),
          h('p', null, '💡 ', ...bi(`האותיות ${pair} ביחד ${DIGRAPHS[pair]}.`)), speakBox(w.w));
        card.append(c); enter(c); nextBtn.classList.remove('hidden');
        say(); saveAt(round + 1 < ROUNDS ? round + 1 : round);
        setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }), 300);
      } else {
        firstTry = false; Guard.miss(); e.currentTarget.classList.add('wrong'); shake(e.currentTarget);
        msg.replaceChildren(...bi(`לא ${p}: האותיות ${p} ${DIGRAPHS[p]}. ` + g('הקשב', 'הקשיבי') + ' שוב 🙂')); say();
      }
    } }, fmt(p))));
    msg.textContent = hear ? 'איזה צירוף אותיות ' + g('שומע', 'שומעת') + ' במילה?' : 'אילו שתי אותיות חסרות?';
    app.append(progressDots(ROUNDS, round), h('div', { class: 'prompt' }, 'שתי אותיות, צליל אחד'), speakerPic(w.e, say), word, msg, opts, card, nextBtn);
    enter(opts);
    setTimeout(say, 350);
  }
  play();
}

/* =========================================================
   The map: one path, station after station, with no end.
   Phase 1: letters two at a time (hear, pairs, write, then words as soon as there are enough).
   Phase 2: words and a spelling test. Phase 3: sentences. Phase 4: endless mixed practice.
   Points: 10 for a right answer on the first try, 3 after one mistake, 0 for a guessed round.
   A station opens the next one only with enough points, and the bar goes up as the child learns.
   Playing a station again never moves the map forward, so there is nothing to farm.
   ========================================================= */
const MAP_GROUPS = ['AB', 'CD', 'EF', 'GH', 'IJ', 'KL', 'MN', 'OP', 'QR', 'ST', 'UV', 'WX', 'YZ'];
const KIND = {
  listen: { icon: '👂', name: 'מה שמעת?', run: () => StageListen() },
  pairs: { icon: '🃏', name: 'זוגות', run: () => StagePairs() },
  write: { icon: '✏️', name: 'כותבים אותיות', run: () => WriteLetters() },
  build: { icon: '🧩', name: 'בונים מילה', run: () => StageBuild() },
  missing: { icon: '🔍', name: 'מה חסר?', run: () => StageMissing() },
  read: { icon: '📖', name: 'קוראים מילה', run: () => StageRead() },
  wwrite: { icon: '📝', name: 'כותבים מילה', run: () => WriteWords() },
  mirror: { icon: '🪞', name: 'אותיות מראה', run: () => MirrorChallenge(0) },
  talk: { icon: '💬', name: 'מדברים', run: () => StageTalk() },
  link: { icon: '🔗', name: 'מילים מחברות', run: () => StageLink() },
  frame: { icon: '🗣️', name: 'בונים משפט', run: () => StageSentence() },
  chat: { icon: '💭', name: 'שיחה', run: () => StageChat() },
  digraph: { icon: '🔤', name: 'צירופי אותיות', run: () => StageDigraph() },
  chest: { icon: '🎁', name: 'תיבת הפתעה' },
  learn: { icon: '📚', name: 'לומדים' },
};
const PHASES = { 1: 'אותיות, מילים וכתיבה', 2: 'מילים ומבחן כתיבה', 3: 'ביטויים של כל יום', 4: 'בונים משפטים', 5: 'שיחות', 6: 'תרגול בלי סוף' };
const ENDLESS_PHASE = 6;
const ALL_ABC = MAP_GROUPS.join('').split('');
// easy at the start, harder as the child knows more: more answers to choose from, more points needed
const zoneOf = gi => gi < 2 ? { opts: 3, pct: .6 } : gi < 8 ? { opts: 4, pct: .75 } : { opts: 5, pct: .85 };
/* Capitals first, small letters after every level (map v4): the letter blocks of a level teach only capitals;
   then a block of the same letters in small letters (lesson, capital-to-small pairs, listening, writing,
   mirror letters, quiz). From the words phase on, everything is in small letters, like real English.

/* The drawn map: one winding path from the bottom up, drawn in code so it never runs out.

const MAP_W = 360, MAP_GAP = 96;
const BIOMES = [

  { ground: '#BCCB66', spot: '#D6DB8C', path: '#EDC58A', edge: '#B78849', dots: 'rgba(255,255,255,.5)', deco: ['fall', 'fall', 'fall', 'bush', 'rock'], land: 'mill' },
  { ground: '#1E3F50', spot: '#285468', path: '#3A6A7B', edge: '#132E3B', dots: '#C6F7FF', deco: ['dpine', 'dpine', 'shroom', 'shroom', 'fly', 'fly', 'fly'], land: 'stump', dark: true },

function MapScreen() {

    if (c > c0) out.push(`<rect x="0" y="${(yb - 60).toFixed(1)}" width="${MAP_W}" height="120" fill="url(#mg${k})"/>`);

    stuff.push({ y: sy + 26, svg: `<g transform="translate(${sx} ${sy})"><rect x="-4" y="0" width="8" height="26" fill="#6B4423"/><rect x="-74" y="-30" width="148" height="44" rx="8" fill="#8B5A2B"/><rect x="-70" y="-26" width="140" height="36" rx="6" fill="#A86F38"/><text x="0" y="-11" text-anchor="middle" direction="rtl" font-size="13" font-weight="800" fill="#FFF4DC">שלב ${s.phase}</text><text x="0" y="5" text-anchor="middle" direction="rtl" font-size="11.5" font-weight="700" fill="#FFE7B8">${escSvg(PHASES[s.phase])}</text></g>` });
  }
  if (start === 0) stuff.push({ y: Y(0) + 80, svg: `<g transform="translate(${pathX(-.6).toFixed(1)} ${Y(-.75).toFixed(1)})"><rect x="-38" y="-14" width="76" height="28" rx="14" fill="#fff" opacity=".9"/><text x="0" y="5" text-anchor="middle" direction="rtl" font-size="14" font-weight="800" fill="#2E7D32">🚩 התחלה</text></g>` });
  stuff.sort((a, b) => a.y - b.y);

  // the stations
  const st = [];
  for (let i = start; i <= end; i++) {
    const s = stationAt(i), x = pathX(i), y = Y(i), dark = BIOMES[biomeIx(i)].dark;
    const best = bestAt(m, i), kind = s.id in m.pass ? 'done' : i === at ? 'now' : 'locked';
    const label = `תחנה ${i + 1}: ${stationTitle(s)}` + (kind === 'done' ? `, ${best} כוכבים` : kind === 'locked' ? ', נעולה' : ', התחנה שלך');
    const face = s.kind === 'chest' ? `<text y="8" text-anchor="middle" font-size="24">🎁</text>`
      : s.kind === 'learn' ? `<text y="8" text-anchor="middle" font-size="22">📚</text>`
      : `<text y="6.5" text-anchor="middle" font-size="${i >= 99 ? 14 : 17}" font-weight="800" fill="${kind === 'done' ? '#7A4A06' : kind === 'now' ? '#fff' : dark ? '#D5E8EE' : '#6F685C'}">${i + 1}</text>`;
    const disc = kind === 'done' ? `<circle r="22" fill="#F7C948" stroke="#B9790F" stroke-width="4"/><circle r="15.5" fill="none" stroke="#FFE38A" stroke-width="2"/>`
      : kind === 'now' ? `<circle class="mring" r="27" fill="none" stroke="#FFF3B0" stroke-width="7"/><circle r="26" fill="#FF8A3D" stroke="#C2551A" stroke-width="4"/><circle r="19" fill="none" stroke="#FFB27A" stroke-width="2"/>`
      : `<circle r="21" fill="${dark ? '#56717D' : '#CFC8BB'}" stroke="${dark ? '#34505C' : '#958D80'}" stroke-width="4"/>`;
    const stars = kind === 'done' && s.kind !== 'learn' ? [-16, 0, 16].map((dx, k) => `<polygon transform="translate(${dx} ${k === 1 ? -35 : -31})" points="${STAR_PTS}" fill="${k < best ? '#FFD23F' : dark ? '#4A6470' : '#E2DACB'}" stroke="${k < best ? '#B9790F' : dark ? '#33505C' : '#B8AE9C'}" stroke-width="1.5"/>`).join('') : '';
    const flag = s.quiz ? `<text x="20" y="-16" font-size="17">🏁</text>` : '';
    const meTag = kind === 'now' ? `<g class="mme"><path d="M-6-37L0-29L6-37Z" fill="#fff"/><circle cy="-63" r="27" fill="#fff" stroke="#FF8A3D" stroke-width="4"/>${kid ? `<clipPath id="mmeclip"><circle cy="-63" r="24"/></clipPath><image href="${avatarSrc(Look.get(), Shop.get().wear)}" x="-25" y="-88" width="50" height="50" clip-path="url(#mmeclip)"/>` : '<text y="-46" text-anchor="middle" font-size="22">⭐</text>'}</g>` : '';
    st[kind === "now" ? "unshift" : "push"](`<g class="ms ms-${kind}" data-i="${i}" role="button" tabindex="${kind === 'locked' ? -1 : 0}" aria-label="${escSvg(label)}" aria-disabled="${kind === 'locked'}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><ellipse cy="15" rx="24" ry="7" fill="rgba(0,0,0,.2)"/><circle r="34" fill="transparent"/><g class="mbody">${disc}${face}</g>${stars}${flag}${meTag}</g>`);
  }
  // fog over what is still far ahead: the path keeps going, there is always more
  const fogTo = Y(end - 2.5);
  const clouds = [[60, 70, 54], [170, 50, 66], [290, 78, 58], [110, 140, 44], [250, 150, 50]].map(([x, y, r]) => `<g opacity=".95"><circle cx="${x}" cy="${y}" r="${r * .6}" fill="#fff"/><circle cx="${x - r * .55}" cy="${y + 10}" r="${r * .42}" fill="#fff"/><circle cx="${x + r * .55}" cy="${y + 8}" r="${r * .45}" fill="#fff"/></g>`).join('');
  const fog = `<rect x="0" y="0" width="${MAP_W}" height="${fogTo.toFixed(0)}" fill="url(#mfog)"/>${clouds}<text x="${MAP_W / 2}" y="112" text-anchor="middle" direction="rtl" font-size="17" font-weight="800" fill="#5F6B84">✨ עוד הרבה תחנות בדרך…</text>`;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${MAP_W} ${H}`);
  svg.setAttribute('class', 'map-svg');
  svg.setAttribute('role', 'group');
  svg.setAttribute('aria-label', 'מפת התחנות');
  svg.innerHTML = out.join('') + under.join('') + stuff.map(o => o.svg).join('') + st.slice(1).join('') + st[0] + fog;
  const world = h('div', { class: 'map-world' }); world.append(svg);
  const cur = stationAt(at);
  const go = h('button', { class: 'btn green map-play', onclick: () => startStation(at) }, h('span', { class: 'ic' }, KIND[cur.kind].icon), h('span', null, h('b', null, `לתחנה ${at + 1}`), h('small', null, stationTitle(cur))));
  app.append(world, h('div', { class: 'map-bar' }, go));
  const tap = g => {
    const i = +g.dataset.i;
    if (g.classList.contains('ms-locked')) { if (G) G.fromTo($('.mbody', g), { x: -6 }, { x: 0, duration: .45, ease: 'elastic.out(1,0.3)' }); toast('🔒 התחנה הזו עוד נעולה. עוברים את התחנה הכתומה כדי להגיע אליה.', 2600); return; }
    startStation(i);
  };
  svg.addEventListener('click', e => { const g = e.target.closest('.ms'); if (g) tap(g); });
  svg.addEventListener('keydown', e => { const g = e.target.closest('.ms'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tap(g); } });

  const nowEl = $('.ms-now', svg);
  requestAnimationFrame(() => { if (!nowEl) return; const r = nowEl.getBoundingClientRect(); window.scrollTo(0, Math.max(0, r.top + scrollY - innerHeight * .5)); });
  // motion: the current station breathes, the child's avatar bobs, fireflies blink, water flows, the windmill turns
  if (G && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const ctx = G.context(() => {
      G.fromTo('.map-svg .mring', { scale: 1, opacity: .9 }, { scale: 1.55, opacity: 0, duration: 1.4, repeat: -1, ease: 'power1.out', transformOrigin: '50% 50%' });
      G.to('.map-svg .mme', { y: -6, duration: .9, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      [...document.querySelectorAll('.map-svg .mfly')].forEach(f => G.to(f, { opacity: .15, x: (Math.random() - .5) * 18, y: (Math.random() - .5) * 14, duration: 1 + Math.random() * 1.6, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: Math.random() }));
      G.to('.map-svg .mflow', { strokeDashoffset: -84, duration: 2.4, repeat: -1, ease: 'none' });
      G.to('.map-svg .mfall', { strokeDashoffset: -44, duration: .7, repeat: -1, ease: 'none' });
      G.to('.map-svg .mblade', { rotation: 360, duration: 9, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
      const near = [...document.querySelectorAll('.map-svg .ms')].filter(g => Math.abs(+g.dataset.i - at) <= 4).map(g => $('.mbody', g));
      G.from(near, { scale: .4, opacity: 0, duration: .5, stagger: .06, ease: 'back.out(2.5)', transformOrigin: '50% 50%', delay: .15 });
      G.from('.map-bar', { y: 90, duration: .5, ease: 'back.out(1.6)', delay: .3 });
    });
    cleanup = () => ctx.revert();
  }
}

/* =========================================================
   Start
   ========================================================= */
Profiles.migrate();
{ const act = RAW.get('active', null); if (act && Profiles.get(act)) loadProfile(act); }
Activity.init();
PlayTimer.init();
Clock.init();
renderStars();
Start();
afterUpdate();
Sync.refresh();   // children and progress from the parent's other phones

// Install as an app + offline, only when served from the website (not from a WhatsApp file)
if (/^https?:$/.test(location.protocol)) {
  document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }), h('link', { rel: 'apple-touch-icon', href: 'icon-180.png' }));
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
