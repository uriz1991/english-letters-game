<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABC">
<title>אותיות באנגלית</title>
<style>
@font-face{font-family:'Andika';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,/*FONT_B64*/) format('woff2');}
:root{
  --bg:#FFF8EC;--card:#FFFFFF;--ink:#22304A;--muted:#5F6B84;
  --blue:#2F6FED;--blue-dark:#1F4FB8;--blue-soft:#E4ECFF;
  --orange:#FF8A3D;--orange-dark:#C9621F;--orange-soft:#FFE9DA;
  --green:#22A86A;--green-dark:#17794C;--green-soft:#DDF6E9;
  --red:#E5484D;--red-soft:#FDE2E3;--line:#E9DDC7;
  --radius:18px;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.en{font-family:'Andika',system-ui,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:2px solid var(--line)}
.top .title{flex:1;font-weight:800;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 2px 0 var(--line);min-height:40px}
.icon-btn[hidden]{display:inline-block;visibility:hidden}
.stars{font-weight:800;background:var(--card);padding:8px 10px;border-radius:12px;box-shadow:0 2px 0 var(--line);min-width:70px;text-align:center}

main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:16px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-dark)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.btn.small{font-size:16px;min-height:44px;padding:8px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 3px 0 var(--line)}
.prompt{font-size:21px;font-weight:800;text-align:center;margin:4px 0 12px;line-height:1.35}
.sub{color:var(--muted);text-align:center;font-size:15px;margin:0 0 12px;line-height:1.5}
.hint{background:var(--orange-soft);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:16px;line-height:1.5}
.hint.blue{background:var(--blue-soft)}
.hint.green{background:var(--green-soft)}

.progress{display:flex;gap:6px;justify-content:center;margin:2px 0 14px;direction:rtl}
.progress i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--green)}
.progress i.now{background:var(--orange);transform:scale(1.25)}

.pic{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 4px 0 var(--line);border:0;width:100%}
.pic .emoji{font-size:88px;line-height:1.1}
.pic .say{font-size:15px;color:var(--blue);font-weight:800}
.word-reveal{font-size:40px;letter-spacing:2px;min-height:52px;text-align:center}
.word-reveal b{color:var(--orange)}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;direction:ltr}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{font-size:58px;aspect-ratio:1;border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.choice.right{background:var(--green-soft);box-shadow:0 5px 0 var(--green)}
.choice.wrong{background:var(--red-soft);box-shadow:0 5px 0 var(--red);opacity:.55;pointer-events:none}

.home-hello{text-align:center;margin:4px 0 14px}
.home-hello h1{font-size:26px;margin:0 0 4px}
.case-toggle{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.case-toggle button{border:0;border-radius:14px;padding:8px 14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px}
.case-toggle button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.stage-list{display:grid;gap:12px}
.stage{display:flex;align-items:center;gap:12px;text-align:right;border:0;background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:0 4px 0 var(--line);width:100%}
.stage .num{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--blue-soft)}
.stage .txt{flex:1;min-width:0}
.stage .txt b{display:block;font-size:18px}
.stage .txt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.stage .got{flex:none;font-weight:800;font-size:14px;color:var(--muted)}
.parents{margin-top:18px;font-size:14px;color:var(--muted);line-height:1.6}
.parents summary{font-weight:800;cursor:pointer}

.end{text-align:center;padding-top:20px}
.end .big{font-size:84px}
.end h2{font-size:26px;margin:8px 0}

.toast{position:fixed;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));margin:0 auto;max-width:480px;z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx span{position:absolute;font-size:30px;will-change:transform,opacity}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hidden{display:none!important}

/* stage 2: memory + b/d */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.mcard{aspect-ratio:3/4;border:0;border-radius:14px;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);font-size:42px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.mcard .back{font-size:26px;opacity:.9}
.mcard.open{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.mcard.low.open{background:var(--orange-soft)}
.mcard.match{background:var(--green-soft)!important;box-shadow:0 4px 0 var(--green)!important;pointer-events:none}
.mcard small{font-size:18px;line-height:1}
.counter{display:flex;justify-content:center;gap:16px;font-weight:800;color:var(--muted);margin:0 0 12px}
.bd-hint{display:flex;align-items:center;gap:12px}
.bd-hint .bedword{font-size:46px;line-height:1;direction:ltr}
.bd-hint .bedword b{color:var(--blue)}
.bd-hint .bedword i{font-style:normal;color:var(--orange)}
.bd-hint p{margin:0;font-size:15px;line-height:1.55}

/* stage 3: build a word */
.pic-row{display:flex;gap:12px;align-items:stretch}
.pic-row .pic{flex:1}
.build-wrap{display:flex;justify-content:center;margin-top:16px}
.slotwrap{display:inline-flex;flex-direction:column;direction:ltr}
.slots{display:flex;gap:8px}
.slot{width:60px;height:70px;border-radius:14px;border:3px dashed #CDBB98;background:rgba(255,255,255,.6);font-size:44px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.slot.next{border-color:var(--orange);background:var(--orange-soft)}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--card)}
.slot.ok{border-color:var(--green);background:var(--green-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft)}
.dir-arrow{position:relative;height:4px;background:var(--orange);border-radius:2px;margin:10px 6px 0 6px}
.dir-arrow::after{content:"";position:absolute;right:-6px;top:-6px;border-left:12px solid var(--orange);border-top:8px solid transparent;border-bottom:8px solid transparent}
.dir-label{direction:rtl;text-align:left;font-size:14px;font-weight:800;color:var(--orange-dark);margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr;margin:20px 0 14px}
.slots.static .slot{cursor:default}
.slot.blank{border-color:var(--orange);background:var(--orange-soft)}
.slot.blank.bad{border-color:var(--red);background:var(--red-soft);border-style:solid}

/* stage 5: tracing */
.mode-list{display:grid;gap:12px;margin-top:8px}
.trace-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.trace-top .target{font-size:64px;line-height:1;color:var(--blue)}
.trace-top .kw{display:flex;flex-direction:column;align-items:center;font-size:15px;color:var(--muted)}
.trace-top .kw .e{font-size:40px;line-height:1.1}
.word-track{display:flex;gap:6px;justify-content:center;direction:ltr;margin-bottom:8px}
.word-track span{width:46px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--card);box-shadow:0 3px 0 var(--line);color:#B7BFCE}
.word-track span.now{background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 3px 0 var(--orange)}
.word-track span.done{background:var(--green-soft);color:var(--green-dark);box-shadow:0 3px 0 var(--green)}
.canvas-wrap{display:flex;justify-content:center}
canvas.trace{background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);touch-action:none;display:block}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tile{width:62px;height:62px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-size:40px;box-shadow:0 4px 0 var(--blue-dark);padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.tile.used{visibility:hidden}

/* levels + resume */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.levels button{border:0;border-radius:14px;padding:8px 6px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.levels button small{font-size:15px;color:var(--muted)}
.levels button em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.levels button.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-dark)}
.levels button.on small,.levels button.on em{color:#fff}
.resume{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);text-align:right}
.resume .ic{font-size:30px}
.resume b{display:block;font-size:18px}
.resume span{display:block;font-size:14px;opacity:.92}
.level-letters{text-align:center;font-size:24px;letter-spacing:4px;color:var(--blue);margin:-2px 0 14px}
.stage .got .ok{display:block;color:var(--green);font-size:18px;text-align:center}
.choices.four{grid-template-columns:repeat(2,1fr)}
.choices.four .choice{aspect-ratio:auto;height:104px}
.memory.many .mcard{aspect-ratio:4/5;font-size:36px}
.mirror-hint{display:block}
.mirror-hint .letters{font-size:40px;line-height:1;direction:ltr;text-align:center;margin-bottom:6px;letter-spacing:10px}
.mirror-hint .letters span:nth-child(1){color:var(--blue)}
.mirror-hint .letters span:nth-child(2){color:var(--orange)}
.mirror-hint .letters span:nth-child(3){color:var(--green)}
.mirror-hint .letters span:nth-child(4){color:#9B51E0}
.mirror-hint p{margin:0;font-size:15px;line-height:1.55}
.reset-btn{margin-top:8px;border:0;background:none;color:var(--red);font-weight:800;text-decoration:underline;padding:4px 0}

/* profiles + personal area */
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.who-card{border:0;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 0 var(--line);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:18px;min-width:0}
.who-card .av{font-size:56px;line-height:1.1}
.who-card small{font-size:14px;color:var(--muted);font-weight:700}
.who-card.add{background:transparent;border:3px dashed #CDBB98;box-shadow:none;color:var(--muted)}
.who-card .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:block;margin:14px 0 6px;font-weight:800}
.text-in{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.text-in:focus{outline:none;border-color:var(--blue)}
.pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick-grid button{border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:30px;aspect-ratio:1;padding:0}
.pick-grid button.on{background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:0;border-radius:14px;padding:10px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:17px}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.me-bar{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:var(--radius);box-shadow:0 3px 0 var(--line);padding:10px 12px;margin:0 0 12px;text-align:right}
.me-bar .av{font-size:38px;line-height:1}
.me-bar .mid{flex:1;min-width:0}
.me-bar .mid b{display:block;font-size:19px}
.goal-track{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.goal-track i{display:block;height:100%;background:var(--green);border-radius:6px}
.me-bar .mid span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.me-bar .fire{flex:none;text-align:center;font-weight:800;font-size:13px;color:var(--orange-dark)}
.me-bar .fire em{display:block;font-style:normal;font-size:26px;line-height:1.1}
.me-head{text-align:center}
.me-head .av{font-size:80px;line-height:1.1}
.me-head h1{margin:4px 0 2px;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--line);padding:10px 4px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.album span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:32px}
.album span.locked{background:transparent;box-shadow:none;border:2px dashed var(--line);color:#CDBB98;font-size:20px;font-weight:800}
.sec-title{font-size:18px;font-weight:800;margin:20px 0 10px}
.modal{position:fixed;inset:0;z-index:45;background:rgba(34,48,74,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:380px;width:100%;text-align:center;padding:22px 18px}
.modal .sticker{font-size:96px;line-height:1.1;display:inline-block}

/* parent report */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 4px 0;direction:rtl}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);font-weight:700}
.bars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 0 0;background:var(--blue);min-height:2px}
.bars i.goal{background:var(--green)}
.bars em{font-style:normal;font-size:11px;margin-bottom:2px}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.lgrid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:22px;background:var(--card);box-shadow:0 2px 0 var(--line);color:#B7BFCE}
.lgrid span.known{background:var(--green-soft);color:var(--green-dark);box-shadow:0 2px 0 var(--green)}
.lgrid span.weak{background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 2px 0 var(--orange)}
.lgrid span.seen{color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-left:4px}
.wlist{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:0 2px 0 var(--line);padding:8px 12px}
.wrow .e{font-size:28px}
.wrow .t{flex:1;min-width:0}
.wrow .t b{font-size:18px}
.wrow .t span{display:block;font-size:13px;color:var(--muted)}
.wrow .n{font-size:13px;font-weight:800;color:var(--orange-dark);text-align:center}
.review-card{background:var(--orange-soft)!important;box-shadow:0 4px 0 var(--orange)!important;margin-bottom:12px}
.review-card .num{background:#fff!important}

/* stage 6: reading */
.read-tiles{display:flex;justify-content:center;gap:8px;direction:ltr;margin:10px 0 4px}
.rtile{border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;min-width:58px}
.rtile .en{font-size:46px;line-height:1.05}
.rtile .hs{font-size:20px;font-weight:800;color:var(--orange-dark);min-height:26px;direction:rtl}
.rtile.next{background:var(--orange-soft);box-shadow:0 4px 0 var(--orange)}
.rtile.done{background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.blend{font-size:40px;font-weight:800;text-align:center;color:var(--blue);margin:8px 0 0;min-height:52px}
.choices.pics .choice{font-size:64px}

/* stage 7: phrases */
.pic.still{cursor:default}
.situation{font-size:20px;font-weight:800;text-align:center;line-height:1.4;margin:12px 0 4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt-row{display:flex;gap:8px;direction:ltr}
.opt{flex:1;border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:20px;font-weight:800;min-height:58px;padding:10px 14px;line-height:1.3}
.opt.en{font-size:22px}
.opt.right{background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.opt.wrong{background:var(--red-soft);box-shadow:0 4px 0 var(--red);opacity:.55;pointer-events:none}
.ear{flex:none;width:58px;border:0;border-radius:16px;background:var(--blue-soft);box-shadow:0 4px 0 var(--line);font-size:24px}
.phrase-line{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:ltr;min-height:64px;margin:12px 0;padding:8px;border:3px dashed #CDBB98;border-radius:16px;background:rgba(255,255,255,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:22px;padding:8px 14px;box-shadow:0 4px 0 var(--blue-dark);min-height:48px}
.chip.placed{background:var(--green-soft);color:var(--ink);box-shadow:0 3px 0 var(--green);pointer-events:none}
.chip.used{visibility:hidden}
.say-card{text-align:center}
.say-card .big-en{font-size:28px;display:block;margin-bottom:2px}
.say-card p{margin:6px 0}
.mini-ear{border:0;background:#fff;border-radius:10px;padding:2px 8px;margin-inline-start:6px;font-size:18px;box-shadow:0 2px 0 var(--line)}
</style>
</head>
<body>
<header class="top">
  <button id="backBtn" class="icon-btn" hidden>→ תפריט</button>
  <div class="title" id="screenTitle">אותיות באנגלית</div>
  <div class="stars" id="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="fx" class="fx" aria-hidden="true"></div>

function autoTip(w) {
  if (w in MANUAL_TIPS) return MANUAL_TIPS[w];
  if (w.startsWith('kn')) return ['האות ', 'k', ' בהתחלה שקטה: לא שומעים אותה'];
  if (w.endsWith('mb')) return ['האות ', 'b', ' בסוף שקטה: לא שומעים אותה'];
  const digraphs = [
    ['sh', 'נשמעות כמו ש'], ['ch', 'נשמעות כמו צ׳'], ['th', 'נשמעות ביחד כשהלשון בין השיניים'],

    ['ee', 'נשמעות כמו אִי'], ['oo', 'נשמעות כמו אוּ'], ['ai', 'נשמעות כמו אֵיי'], ['oa', 'נשמעות כמו אוֹ'],
    ['ou', 'נשמעות כמו אַאוּ'],
  ];
  for (const [g, t] of digraphs) if (w.includes(g)) return ['האותיות ', g, ' ביחד ' + t];
  const dbl = w.match(/([b-df-hj-np-tv-z])\1/);
  if (dbl) return ['שתי אותיות ', dbl[1], ' אבל שומעים צליל אחד'];
  if (w.length >= 4 && /[aeiou][^aeiou]e$/.test(w)) return T_SILENT_E;
  return null;
}

};

/* =========================================================
   Speech (Web Speech API)
   ========================================================= */
// Voice choice is per device (each phone has different voices), so it lives in RAW, not in the child profile.
const RATE_MUL = { slow: .85, normal: 1, fast: 1.15 };
const Speech = {
  ok: 'speechSynthesis' in window,
  voices: [],
  listeners: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices() || []; this.listeners.forEach(f => { try { f(); } catch (e) {} }); };
    load();
    if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = load;
    else speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', load);
  },
  // Higher = clearer. Network voices (Google, Natural) usually sound much better than the small offline ones.
  score(v) {
    const n = (v.name || '') + ' ' + (v.voiceURI || ''), lang = (v.lang || '').toLowerCase().replace('_', '-');
    if (!lang.startsWith('en')) return -1;
    if (/albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|kathy|eloquence|espeak|compact/i.test(n)) return 0;
    let s = lang === 'en-us' ? 40 : lang === 'en-gb' ? 15 : 8;   // the game teaches American pronunciation
    if (/natural|neural|enhanced|premium|wavenet|studio/i.test(n)) s += 50;
    if (/google/i.test(n)) s += 20;
    if (/samantha|ava|allison|aria|jenny|zira|susan|serena|karen|moira/i.test(n)) s += 15;
    if (/network/i.test(n) || v.localService === false) s += 15;
    if (v.default) s += 2;
    return s;
  },
  englishVoices() { return this.voices.filter(v => this.score(v) > 0).sort((a, b) => this.score(b) - this.score(a)); },
  // the parent's choice if it still exists on this phone, else the best one
  bestEnglish() {
    const want = RAW.get('voice', null);
    const list = this.englishVoices();
    return (want && list.find(v => v.voiceURI === want)) || list[0] || null;
  },
  bestLocal() { return this.englishVoices().find(v => v.localService !== false) || null; },
  voiceFor(lang) {
    if (lang.toLowerCase().startsWith('en')) { const b = this.bestEnglish(); if (b) return b; }
    const want = lang.toLowerCase().replace('_', '-');
    const base = want.slice(0, 2);
    const alt = base === 'he' ? 'iw' : base;
    const norm = v => (v.lang || '').toLowerCase().replace('_', '-');
    const list = this.voices;
    return list.find(v => norm(v) === want && v.localService) || list.find(v => norm(v) === want)
        || list.find(v => norm(v).startsWith(base) || norm(v).startsWith(alt)) || null;
  },
  say(text, lang = 'en-US', rate = 0.8, forceVoice) {
    return new Promise(resolve => {
      if (!this.ok || !text) return resolve();
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang; u.rate = Math.min(1.3, rate * (RATE_MUL[RAW.get('rate', 'normal')] || 1)); u.pitch = 1;
        const v = forceVoice || this.voiceFor(lang); if (v) { u.voice = v; u.lang = v.lang; }
        let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
        u.onend = fin;
        // an internet voice fails when the phone is offline: say it again with a voice that lives on the phone
        u.onerror = e => {
          const local = this.bestLocal();
          if (!forceVoice && v && v.localService === false && local && local !== v && e && e.error !== 'interrupted' && e.error !== 'canceled') {
            done = true; this.say(text, lang, rate, local).then(resolve);
          } else fin();
        };
        setTimeout(fin, 900 + text.length * 180);
        speechSynthesis.speak(u);
      } catch (e) { resolve(); }
    });
  },
  en(text, rate) { return this.say(text, 'en-US', rate); },
};
Speech.init();

/* =========================================================
   Motion (GSAP; falls back to CSS if missing)
   ========================================================= */
const G = window.gsap || null;
function pop(el) { if (!el) return; if (G) G.fromTo(el, { scale: .8 }, { scale: 1, duration: .55, ease: 'back.out(3)', clearProps: 'transform' }); }

  else { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function burst(fromEl, count = 14) {
  const fx = $('#fx'); if (!fx) return;
  const r = fromEl ? fromEl.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const icons = ['⭐', '🌟', '✨', '🎉', '💫'];
  for (let i = 0; i < count; i++) {
    const s = h('span', null, pick(icons));
    s.style.left = (cx - 15) + 'px'; s.style.top = (cy - 15) + 'px';
    fx.append(s);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    if (G) G.fromTo(s, { x: 0, y: 0, scale: .3, opacity: 1, rotation: 0 },
      { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist - 30, scale: 1 + Math.random() * .6, opacity: 0, rotation: (Math.random() - .5) * 180,
        duration: .9 + Math.random() * .4, ease: 'power2.out', onComplete: () => s.remove() });

}

/* =========================================================
   Stage 1: מה שמעת? (first/last sound -> letter)
   ========================================================= */
function StageListen(res) {
  const rv = !!(res && res.review);       // review mode: hard letters from every level learned so far
  const SK = rv ? 'review' : 'listen';
  const pool = rv ? LETTERS.filter(x => x.lvl <= state.level) : newLetters();
  let order, round = 0, earned = 0;
  if (res && res.order) { order = res.order; round = res.round || 0; earned = res.earned || 0; }
  else {
    // the 2 extra rounds go to letters that were hard before, if there are any
    const weak = shuffle(newLetters().filter(x => Mastery.isWeak('L:' + x.L)));
    const extra = [...weak, ...shuffle(pool)].slice(0, 2);
    order = [...shuffle(pool), ...extra].map(x => [x.L, Math.floor(Math.random() * x.kws.length)]);
  }
  const ROUNDS = order.length;
  const save = r => Resume.save('listen', { order, round: r, earned, review: rv || undefined, words: res && res.words });

  function play() {
    save(round);
    const app = screen(rv ? 'חזרה: מה שמעת?' : 'מה שמעת?');
    const item = findLetter(order[round][0]);
    const kw = item.kws[order[round][1]] || item.kws[0];
    const atEnd = !!kw.end;
    const lower = round >= Math.floor(ROUNDS / 2);
    const show = L => lower ? L.toLowerCase() : L;
    const others = shuffle(pool.map(x => x.L).filter(x => x !== item.L)).slice(0, 2);
    const options = shuffle([item.L, ...others]);
    let solved = false, firstTry = true;
    const sayWord = () => Speech.en(kw.w, .7);

    const reveal = h('div', { class: 'word-reveal en' });
    const info = h('div', { class: 'hint blue hidden' });
    const nextBtn = nextButton(round === ROUNDS - 1 && !(rv && res.words && res.words.length), () => {
      round++;
      if (round < ROUNDS) return play();
      if (rv && res.words && res.words.length) return StageBuild({ review: true, list: res.words, round: 0, earned });
      if (rv) return EndScreen('review', earned, () => StageReview());
      EndScreen('listen', earned, () => StageListen(), 1);
    });
    const msg = h('p', { class: 'sub' }, g('לחץ על התמונה כדי לשמוע שוב', 'לחצי על התמונה כדי לשמוע שוב'));

    const choices = h('div', { class: 'choices' }, options.map(L => {
      const b = h('button', { class: 'choice en', type: 'button', 'aria-label': L }, show(L));
      b.addEventListener('click', () => {
        if (solved) return;
        if (L === item.L) {
          solved = true; b.classList.add('right'); pop(b); burst(b); addStar(SK); earned++;
          Mastery.rec('L:' + item.L, firstTry);
          const shown = lower ? kw.w : kw.w.toUpperCase();
          reveal.innerHTML = '';
          if (atEnd) reveal.append(shown.slice(0, -1), h('b', null, shown.slice(-1)));
          else reveal.append(h('b', null, shown[0]), shown.slice(1));
          info.innerHTML = '';
          info.append('האות ', en(show(item.L)), ' נשמעת כמו ', h('b', null, item.snd), ` · ${kw.he}`);
          info.classList.remove('hidden'); nextBtn.classList.remove('hidden');
          msg.textContent = 'נכון! 🎉';
          pop(reveal);
          Speech.en(kw.w, .7);
          save(round + 1 < ROUNDS ? round + 1 : round);
        } else {
          b.classList.add('wrong'); shake(b); firstTry = false;
          msg.textContent = 'כמעט! ' + g('הקשב', 'הקשיבי') + (atEnd ? ' לצליל האחרון ' : ' לצליל הראשון ') + g('ונסה', 'ונסי') + ' שוב 🙂';
          sayWord();
        }
      });
      return b;
    }));

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, atEnd ? 'באיזו אות נגמרת המילה?' : 'באיזו אות מתחילה המילה?'),
      speakerPic(kw.e, sayWord), reveal, msg, choices, info, nextBtn);
    enter(choices);
    setTimeout(sayWord, 350);
  }
  play();
}

/* =========================================================
   Stage 2: זוגות (upper <-> lower memory) + mirror letters
   ========================================================= */
function flipTo(el, fn) {
  if (!G) { fn(); return; }
  G.to(el, { scaleX: 0, duration: .12, ease: 'power1.in', onComplete() { fn(); G.to(el, { scaleX: 1, duration: .14, ease: 'power1.out', clearProps: 'transform' }); } });
}
function StagePairs(res) {
  const app = screen('זוגות');
  const pool = newLetters(), N = pool.length;
  let deck, matched, tries = 0, earned = 0;
  if (res && res.deck) { deck = res.deck; matched = new Set(res.matched); tries = res.tries; earned = res.earned; }
  else { deck = shuffle(pool.flatMap(l => [l.L, l.L.toLowerCase()])); matched = new Set(); }
  const save = () => Resume.save('pairs', { deck, matched: [...matched], tries, earned });
  save();
  let open = [], lock = false;
  const pairsEl = h('span', null, `זוגות: ${matched.size}/${N}`);
  const triesEl = h('span', null, 'ניסיונות: ' + tries);

  const showFront = (b, c) => { b.innerHTML = ''; b.classList.add('open'); b.append(en(c.face)); };
  const showBack = b => { b.innerHTML = ''; b.classList.remove('open'); b.append(h('span', { class: 'back' }, '⭐')); };
  const markMatch = (b, c) => { showFront(b, c); b.classList.add('match'); b.append(h('small', null, c.l.kws[0].e)); };

  const cards = deck.map(face => ({ face, l: findLetter(face), low: face !== face.toUpperCase() }));
  const grid = h('div', { class: 'memory' + (cards.length > 16 ? ' many' : '') }, cards.map(c => {
    const b = h('button', { class: 'mcard' + (c.low ? ' low' : ''), type: 'button', 'aria-label': 'קלף', 'data-k': c.l.L });
    if (matched.has(c.l.L)) markMatch(b, c); else showBack(b);
    b.addEventListener('click', () => {
      if (lock || b.classList.contains('open') || b.classList.contains('match')) return;
      flipTo(b, () => showFront(b, c));
      open.push({ b, c });
      if (open.length < 2) return;
      tries++; triesEl.textContent = 'ניסיונות: ' + tries;
      const [x, y] = open; open = [];
      if (x.c.l === y.c.l) {
        matched.add(x.c.l.L); pairsEl.textContent = `זוגות: ${matched.size}/${N}`;
        const kw = x.c.l.kws[0];
        setTimeout(() => {
          for (const it of [x, y]) { it.b.classList.add('match'); it.b.append(h('small', null, kw.e)); pop(it.b); }
          burst(y.b, 8); addStar('pairs'); earned++; save();
          Speech.en(`${x.c.l.L.toLowerCase()}, ${kw.w}`, .75);
          if (matched.size === N) setTimeout(done, 900);
        }, 260);
      } else {
        lock = true; save();
        setTimeout(() => { shake(x.b); shake(y.b); }, 300);
        setTimeout(() => { flipTo(x.b, () => showBack(x.b)); flipTo(y.b, () => showBack(y.b)); lock = false; }, 1100);
      }
    });
    return b;
  }));

  const doneBox = h('div', { class: 'hidden' });
  function done() {
    const set = curLevel().mirror;
    Resume.save('mirror', { earned });
    doneBox.className = 'card';
    doneBox.style.marginTop = '16px'; doneBox.style.textAlign = 'center';
    doneBox.append(h('div', { class: 'prompt' }, `מצאת את כל הזוגות ב־${tries} ניסיונות! 🎉`),
      h('p', { class: 'sub' }, 'עכשיו אתגר קטן: האותיות ', set.flatMap((L, i) => [i ? ' ' : '', en(L)]), ' נראות כמו מראה. ' + g('בוא', 'בואי') + ' נלמד להבדיל ביניהן.'),
      h('button', { class: 'btn orange wide', onclick: () => MirrorChallenge(earned) }, 'לאתגר אותיות מראה ←'));
    enter(doneBox); burst(doneBox, 18); checkBreak();
    doneBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  app.append(h('div', { class: 'prompt' }, g('מצא', 'מצאי') + ' זוג: אות גדולה ואות קטנה'),
    h('p', { class: 'sub' }, g('הפוך', 'הפכי') + ' שני קלפים. אם זו אותה אות, מצאת זוג!'),
    h('div', { class: 'counter' }, pairsEl, triesEl), grid, doneBox);
  enter(grid);
  if (matched.size === N) setTimeout(done, 300);
}

function MirrorChallenge(earnedBefore = 0, res) {
  const ROUNDS = 8;
  const set = curLevel().mirror;
  let items, round = 0, earned = earnedBefore;
  if (res && res.items) { items = res.items; round = res.round; earned = res.earned; }
  else {
    const pools = Object.fromEntries(set.map(L => [L, shuffle(MIRROR_WORDS[L].map((_, i) => i))]));
    items = shuffle(Array.from({ length: ROUNDS }, (_, i) => { const L = set[i % set.length]; const p = pools[L]; return [L, p[Math.floor(i / set.length) % p.length]]; }));
  }

  function play() {
    Resume.save('mirror', { items, round, earned });
    const app = screen('אתגר אותיות מראה');
    const [L, wi] = items[round];
    const it = MIRROR_WORDS[L][wi];
    let solved = false, firstTry = true;
    const sayWord = () => Speech.en(it.w, .7);
    const hint = h('div', { class: 'hint mirror-hint' },
      h('div', { class: 'letters en' }, set.map(x => h('span', null, x))),

        const [x, y] = upto[upto.length - 1]; ctx.fillStyle = '#FF8A3D'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();

  const toUnits = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 120]; };

    if (done) return; e.preventDefault(); stopDemo();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const s = ink[ink.length - 1], p = toUnits(e), last = s[s.length - 1];
    const d = Math.hypot(p[0] - last[0], p[1] - last[1]); if (d < 1) return;
    const n = Math.ceil(d / 2); for (let i = 1; i <= n; i++) s.push([last[0] + (p[0] - last[0]) * i / n, last[1] + (p[1] - last[1]) * i / n]);

  function evaluate() {

    const T2 = 9 * 9, P2 = 12 * 12; let covered = 0, inside = 0, minStroke = 1; const miss = [];

      for (const [sx, sy] of s) { let ok = false; for (const [x, y] of pts) { const dx = sx - x, dy = sy - y; if (dx * dx + dy * dy <= T2) { ok = true; break; } } if (ok) c++; else miss.push([sx, sy]); }

    const coveredEnough = r.cov >= .85 && r.minStroke >= .75;
    if (coveredEnough && r.prec >= .8) { done = true; missing = null; render(); onSuccess && onSuccess(canvas); return; }
    if (coveredEnough) { onMsg && onMsg('יצאת קצת מהקו האפור. ' + g('לחץ', 'לחצי') + ' "נקה" ' + g('ונסה', 'ונסי') + ' שוב 🙂'); return; }
    if (manual) { missing = r.miss; render(); onMsg && onMsg(ink.length ? 'כמעט! ' + g('עבור', 'עברי') + ' גם על הנקודות הכתומות 🙂' : START_MSG()); }
  }
  function clear() { if (done) return; ink.length = 0; missing = null; render(); }
  function stopDemo() { if (rafId) cancelAnimationFrame(rafId); rafId = 0; demo = null; }
  function showDemo() {
    if (done) return; stopDemo(); ink.length = 0; missing = null;
    demo = { si: 0, pi: 0 }; let last = performance.now(), pause = 0;
    const SPEED = 26;
    const step = now => {
      const dt = (now - last) / 1000; last = now;

}

/* =========================================================
   Stage 6: קוראים מילה (sound out letter by letter, then pick the picture)
   Only words where every letter keeps its basic sound. The Hebrew line shows how it sounds.
   ========================================================= */
const RD_CONS = { b: 'בּ', c: 'ק', d: 'ד', f: 'פ', g: 'ג', h: 'ה', j: 'ג׳', k: 'ק', l: 'ל', m: 'מ', n: 'נ', p: 'פּ', r: 'ר', s: 'ס', t: 'ט', v: 'ו', w: 'ו', x: 'קס', y: 'י', z: 'ז', ck: 'ק', sh: 'ש', ch: 'צ׳' };

const RD_MARK = { a: 'ַ', e: 'ֶ', i: 'ִ', u: 'ַ', ee: 'ִ' }; // patah, segol, hiriq
const RD_VOW = { a: 'אַ', e: 'אֶ', i: 'אִ', o: 'אוֹ', u: 'אַ', ee: 'אִי' };

    const two = w.slice(i, i + 2);
    if (['ck', 'sh', 'ch', 'ee'].includes(two) || (two.length === 2 && two[0] === two[1] && !'aeiou'.includes(two[0]))) { out.push(two); i += 2; }
    else { out.push(w[i]); i++; }
  }
  return out;
}
const isVow = gr => gr in RD_VOW;
function decodable(w) {
  if (!/^[a-z]{2,6}$/.test(w) || w in MANUAL_TIPS || RD_SKIP.includes(w)) return false;
  if (/th|ph|q|wh|gh|kn|mb|wa|al|ind|ild|.y|ng/.test(w)) return false;
  const gs = graphemes(w);
  const vi = gs.map((x, i) => isVow(x) ? i : -1).filter(i => i >= 0);
  if (vi.length !== 1) return false;
  const v = vi[0];
  if (v === gs.length - 1 && gs[v] !== 'ee') return false;          // go, me: long vowel at the end
  if (['r', 'w', 'y'].includes(gs[v + 1])) return false;              // car, cow

function hebReading(gs, upto = gs.length) {
  let out = '';
  const mark = m => { out = out.endsWith('׳') ? out.slice(0, -1) + m + '׳' : out + m; };
  gs.slice(0, upto).forEach((gr, i) => {

      if (gr === 'o') out += 'וֹ';

  const seen = new Set();

}
function StageRead(res) {
  const pool = readingPool();
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round || 0; earned = res.earned || 0; }
  else {
    const weak = shuffle(pool.filter(w => Mastery.isWeak('W:' + w.w))).slice(0, 2);
    const cur = shuffle(pool.filter(w => w.L === state.level && !weak.includes(w)));
    const prev = shuffle(pool.filter(w => w.L < state.level && !weak.includes(w)));
    list = [...weak, ...cur, ...prev].slice(0, 6);
  }
  if (!list.length) { toast('אין עדיין מילים לקריאה ברמה הזו'); return Home(); }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('read', { list: list.map(w => w.w), round: r, earned });

  function play() {
    saveAt(round);
    const app = screen('קוראים מילה');

    const msg = h('p', { class: 'sub' }, g('לחץ', 'לחצי') + ' על האותיות לפי הסדר, משמאל לימין, ' + g('ותראה', 'ותראי') + ' איך כל אחת נשמעת.');

      b.addEventListener('click', () => {

        $('.hs', b).textContent = soundOf(gr);
        b.classList.remove('next'); b.classList.add('done'); pop(b);
        k++;

        pop(blend); ask.classList.remove('hidden'); enter(ask);

        }

    }));
    ask.append(h('div', { class: 'prompt', style: 'margin-top:14px' }, 'איזו תמונה מתאימה למילה?'), choices);

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, g('קרא', 'קראי') + ' את המילה באנגלית'),

    enter($('.read-tiles', app));
  }
  play();
}

  { L:2, p:'I like it!', he:['אני אוהב את זה!', 'אני אוהבת את זה!'], e:'😍', when:'כשמשהו מוצא חן בעינינו', grp:'good' },
  { L:2, p:"I don't like it.", he:['אני לא אוהב את זה.', 'אני לא אוהבת את זה.'], e:'😖', when:'כשמשהו לא מוצא חן בעינינו' },
  { L:2, p:'Good job!', he:'כל הכבוד!', e:'👏', when:'כשמישהו הצליח במשהו', reply:'Thank you!', replyHe:'תודה!' },
  { L:2, p:'Can I help you?', he:'אפשר לעזור לך?', e:'🤲', when:'כשרואים שמישהו צריך עזרה', reply:'Yes, please!', replyHe:'כן, בבקשה!' },
  { L:2, p:'Wait for me!', he:'חכו לי!', e:'🏃', when:'כשהחברים הולכים מהר ורוצים שיחכו לנו' },

  { L:3, p:'Can I have water, please?', he:'אפשר לקבל מים, בבקשה?', e:'💧', when:'כשצמאים ומבקשים מים בנימוס', reply:'Here you are.', replyHe:'הנה, בבקשה.' },
  { L:3, p:'Excuse me.', he:'סליחה (כשפונים למישהו)', e:'🙋', when:'כשרוצים לפנות למישהו או לעבור לידו', grp:'sorry' },
  { L:3, p:'Where is the bathroom?', he:'איפה השירותים?', e:'🚻', when:'כשמחפשים שירותים במקום חדש' },
  { L:3, p:"I don't understand.", he:['אני לא מבין.', 'אני לא מבינה.'], e:'🤷', when:'כשמישהו אומר משהו ולא הבנו', grp:'again' },
  { L:3, p:'Can you say it again, please?', he:'אפשר להגיד את זה שוב, בבקשה?', e:'🔁', when:'כשלא שמענו טוב ורוצים לשמוע שוב', grp:'again' },
  { L:3, p:'What time is it?', he:'מה השעה?', e:'🕒', when:'כשרוצים לדעת מה השעה', reply:"It's three o'clock.", replyHe:'השעה שלוש.' },
  { L:3, p:'See you tomorrow!', he:'נתראה מחר!', e:'📅', when:'כשנפרדים ממישהו שנפגוש שוב מחר', grp:'bye' },
  { L:3, p:'How old are you?', he:'מה הגיל שלך?', e:'🎈', when:'כשרוצים לדעת מה הגיל של מישהו', reply:"I'm nine.", replyHe:['אני בן תשע.', 'אני בת תשע.'] },
  { L:3, p:'I need help.', he:['אני צריך עזרה.', 'אני צריכה עזרה.'], e:'🆘', when:'כשמשהו קשה מדי ורוצים שיעזרו לנו' },
  { L:3, p:'Can I play with you?', he:'אפשר לשחק איתכם?', e:'🧸', when:'כשרוצים להצטרף למשחק של ילדים אחרים', reply:'Sure!', replyHe:'בטח!' },
  { L:3, p:"Sorry, I'm late.", he:'סליחה שאיחרתי.', e:'⏰', when:'כשמגיעים אחרי שכולם כבר התחילו', grp:'sorry' },
  { L:3, p:'Have a nice day!', he:'שיהיה לך יום נעים!', e:'☀️', when:'כשנפרדים ממישהו בבוקר או באמצע היום', grp:'bye' },
];
const heOf = x => Array.isArray(x) ? g(x[0], x[1]) : x;
const phraseWords = p => p.replace(/[.,!?]/g, '').split(' ');
const findPhrase = s => PHRASES.find(x => x.p === s);
const sayPhrase = (s, rate = .8) => Speech.en(s, rate);
// kinds of rounds by level: hear = what did they say (Hebrew options), say = what do we say (English options), order = build the sentence
const TALK_KINDS = { 1: ['hear', 'say'], 2: ['hear', 'say'], 3: ['hear', 'say', 'order'] };

function StageTalk(res) {
  let list, kinds, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findPhrase).filter(Boolean); kinds = res.kinds; round = res.round || 0; earned = res.earned || 0; }
  else {
    const pool = PHRASES.filter(x => x.L <= state.level);
    const weak = shuffle(pool.filter(x => Mastery.isWeak('P:' + x.p))).slice(0, 2);
    const cur = shuffle(PHRASES.filter(x => x.L === state.level && !weak.includes(x)));
    const prev = shuffle(pool.filter(x => x.L < state.level && !weak.includes(x)));
    list = [...weak, ...cur.slice(0, 4), ...prev, ...cur.slice(4)].slice(0, 6);
    const ks = TALK_KINDS[state.level];
    kinds = list.map((x, i) => {
      const k = ks[i % ks.length];
      return k === 'order' && phraseWords(x.p).length < 3 ? 'hear' : k;   // one or two words are too short to order
    });
  }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('talk', { list: list.map(x => x.p), kinds, round: r, earned });
  const ear = (text, cls = 'ear') => h('button', { class: cls, type: 'button', 'aria-label': 'השמע', onclick: e => { e.stopPropagation(); sayPhrase(text); } }, '🔊');
  // 2 wrong options from the same levels, never from the same situation group
  const others = item => {
    const out = [];
    for (const x of shuffle(PHRASES.filter(x => x.L <= state.level && x !== item))) {
      if (out.length === 2) break;
      if (item.grp && x.grp === item.grp) continue;
      if (out.some(o => heOf(o.he) === heOf(x.he))) continue;
      out.push(x);
    }
    return out;
  };

  function play() {
    saveAt(round);
    const app = screen('מדברים');
    const item = list[round], kind = kinds[round];
    let solved = false, firstTry = true, onWin = null;
    const say = () => sayPhrase(item.p);
    const msg = h('p', { class: 'sub' });
    const card = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('talk', earned, () => StageTalk()); else play();
    });
    function win(el) {
      solved = true; if (el) { el.classList.add('right'); pop(el); burst(el); }
      if (onWin) onWin();
      addStar('talk'); earned++;
      Mastery.rec('P:' + item.p, firstTry);
      msg.textContent = 'נכון! 🎉';
      const reply = item.reply ? h('p', null, '💬 עונים: ', en(item.reply), ear(item.reply, 'mini-ear'), h('br'), heOf(item.replyHe)) : null;
      const c = h('div', { class: 'hint blue say-card' },
        h('span', { class: 'big-en en' }, item.p), ear(item.p, 'mini-ear'),
        h('p', null, h('b', null, heOf(item.he))),
        h('p', null, '💡 אומרים את זה ', item.when),
        reply);
      card.append(c); enter(c);
      nextBtn.classList.remove('hidden');
      say();
      saveAt(round + 1 < ROUNDS ? round + 1 : round);
      setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }), 300);
    }
    function miss(el, ...parts) {
      firstTry = false;
      if (el) { el.classList.add('wrong'); shake(el); }
      msg.innerHTML = ''; msg.append(...parts);
    }

    let body;
    if (kind === 'hear') {
      msg.textContent = g('לחץ', 'לחצי') + ' על התמונה כדי לשמוע שוב';
      const opts = shuffle([item, ...others(item)]);
      // the picture would give the answer away, so it shows up only after a right answer
      const pic = speakerPic('👂', say);
      onWin = () => { $('.emoji', pic).textContent = item.e; pop(pic); };
      body = [h('div', { class: 'prompt' }, 'מה אמרו באנגלית?'), pic, msg,
        h('div', { class: 'opts' }, opts.map(o => h('button', { class: 'opt', type: 'button', onclick: e => {
          if (solved) return;
          if (o === item) win(e.currentTarget); else { miss(e.currentTarget, 'כמעט! ' + g('הקשב', 'הקשיבי') + ' שוב ' + g('ונסה', 'ונסי') + ' עוד פעם 🙂'); say(); }
        } }, heOf(o.he))))];
      setTimeout(say, 350);
    } else if (kind === 'say') {
      msg.textContent = g('לחץ', 'לחצי') + ' על 🔊 כדי לשמוע כל תשובה, ואז ' + g('בחר', 'בחרי') + ' את הנכונה.';
      const opts = shuffle([item, ...others(item)]);
      body = [h('div', { class: 'pic still' }, h('span', { class: 'emoji' }, item.e)),
        h('div', { class: 'situation' }, 'מה אומרים ', item.when, '?'), msg,
        h('div', { class: 'opts' }, opts.map(o => h('div', { class: 'opt-row' },
          h('button', { class: 'opt en', type: 'button', onclick: e => {
            if (solved) return;
            if (o === item) win(e.currentTarget); else miss(e.currentTarget, 'לא בדיוק. ', en(o.p), ` זה "${heOf(o.he)}". ` + g('נסה', 'נסי') + ' שוב 🙂');
          } }, o.p),
          ear(o.p))))];
    } else {
      const words = phraseWords(item.p);
      let k = 0;
      msg.textContent = g('לחץ', 'לחצי') + ' על המילים לפי הסדר, משמאל לימין.';
      const line = h('div', { class: 'phrase-line' });
      const chips = h('div', { class: 'chips' }, shuffle(words.map((w, i) => ({ w, i }))).map(({ w }) => {
        const b = h('button', { class: 'chip en', type: 'button' }, w);
        b.addEventListener('click', () => {
          if (solved) return;
          if (w !== words[k]) { firstTry = false; shake(b); msg.textContent = 'לא המילה הזו. ' + g('הקשב', 'הקשיבי') + ' שוב 🙂'; say(); return; }
          b.classList.add('used');
          const placed = h('span', { class: 'chip en placed' }, w); line.append(placed); pop(placed);
          k++;
          if (k === words.length) { chips.style.display = 'none'; win(null); }
        });
        return b;
      }));
      body = [h('div', { class: 'prompt' }, g('סדר', 'סדרי') + ' את המשפט ששומעים'), speakerPic(item.e, say),
        h('p', { class: 'situation' }, heOf(item.he)), line, chips, msg];
      setTimeout(say, 350);
    }
    app.append(progressDots(ROUNDS, round), ...body, card, nextBtn);
    enter($('.opts', app) || $('.chips', app));
  }
  play();
}

/* =========================================================
   Stage registry
   ========================================================= */
STAGES.push(
  { key: 'listen',  icon: '👂', name: 'מה שמעת?',   desc: 'שומעים מילה ובוחרים את האות', run: () => StageListen() },
  { key: 'pairs',   icon: '🃏', name: 'זוגות',      desc: 'אות גדולה ואות קטנה, ואתגר אותיות מראה', run: () => StagePairs() },
  { key: 'build',   icon: '🧩', name: 'בונים מילה', desc: 'רואים תמונה ובונים את המילה משמאל לימין', run: () => StageBuild() },
  { key: 'missing', icon: '🔍', name: 'מה חסר?',    desc: 'משלימים את האות שחסרה במילה', run: () => StageMissing() },
  { key: 'write',   icon: '✏️', name: 'כותבים',     desc: 'כותבים אותיות ומילים באצבע', run: () => StageWrite() },
  { key: 'read',    icon: '📖', name: 'קוראים מילה', desc: 'מחברים צלילים וקוראים מילה שלמה', run: () => StageRead() },
  { key: 'talk',    icon: '💬', name: 'מדברים',     desc: 'ביטויים של כל יום, ומתי אומרים אותם', run: () => StageTalk() },
);

/* =========================================================
   Start
   ========================================================= */
Profiles.migrate();
{ const act = RAW.get('active', null); if (act && Profiles.get(act)) loadProfile(act); }
Activity.init();
renderStars();
Home();

// Install as an app + offline, only when served from the website (not from a WhatsApp file)
if (/^https?:$/.test(location.protocol)) {
  document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }), h('link', { rel: 'apple-touch-icon', href: 'icon-180.png' }));
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
