<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<title>אותיות באנגלית</title>
<style>
@font-face{font-family:'Andika';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,/*FONT_B64*/) format('woff2');}
:root{
  --bg:#FFF8EC;--card:#FFFFFF;--ink:#22304A;--muted:#5F6B84;
  --blue:#2F6FED;--blue-dark:#1F4FB8;--blue-soft:#E4ECFF;
  --orange:#FF8A3D;--orange-dark:#C9621F;--orange-soft:#FFE9DA;
  --green:#22A86A;--green-dark:#17794C;--green-soft:#DDF6E9;
  --red:#E5484D;--red-soft:#FDE2E3;--line:#E9DDC7;
  --radius:18px;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.en{font-family:'Andika',system-ui,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:2px solid var(--line)}
.top .title{flex:1;font-weight:800;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 2px 0 var(--line);min-height:40px}
.icon-btn[hidden]{display:inline-block;visibility:hidden}
.stars{font-weight:800;background:var(--card);padding:8px 10px;border-radius:12px;box-shadow:0 2px 0 var(--line);min-width:70px;text-align:center}

main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:16px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-dark)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.btn.small{font-size:16px;min-height:44px;padding:8px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 3px 0 var(--line)}
.prompt{font-size:21px;font-weight:800;text-align:center;margin:4px 0 12px;line-height:1.35}
.sub{color:var(--muted);text-align:center;font-size:15px;margin:0 0 12px;line-height:1.5}
.hint{background:var(--orange-soft);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:16px;line-height:1.5}
.hint.blue{background:var(--blue-soft)}
.hint.green{background:var(--green-soft)}

.progress{display:flex;gap:6px;justify-content:center;margin:2px 0 14px;direction:rtl}
.progress i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--green)}
.progress i.now{background:var(--orange);transform:scale(1.25)}

.pic{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 4px 0 var(--line);border:0;width:100%}
.pic .emoji{font-size:88px;line-height:1.1}
.pic .say{font-size:15px;color:var(--blue);font-weight:800}
.word-reveal{font-size:40px;letter-spacing:2px;min-height:52px;text-align:center}
.word-reveal b{color:var(--orange)}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;direction:ltr}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{font-size:58px;aspect-ratio:1;border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.choice.right{background:var(--green-soft);box-shadow:0 5px 0 var(--green)}
.choice.wrong{background:var(--red-soft);box-shadow:0 5px 0 var(--red);opacity:.55;pointer-events:none}

.home-hello{text-align:center;margin:4px 0 14px}
.home-hello h1{font-size:26px;margin:0 0 4px}
.case-toggle{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.case-toggle button{border:0;border-radius:14px;padding:8px 14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px}
.case-toggle button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.stage-list{display:grid;gap:12px}
.stage{display:flex;align-items:center;gap:12px;text-align:right;border:0;background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:0 4px 0 var(--line);width:100%}
.stage .num{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--blue-soft)}
.stage .txt{flex:1;min-width:0}
.stage .txt b{display:block;font-size:18px}
.stage .txt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.stage .got{flex:none;font-weight:800;font-size:14px;color:var(--muted)}
.parents{margin-top:18px;font-size:14px;color:var(--muted);line-height:1.6}
.parents summary{font-weight:800;cursor:pointer}

.end{text-align:center;padding-top:20px}
.end .big{font-size:84px}
.end h2{font-size:26px;margin:8px 0}

.toast{position:fixed;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));margin:0 auto;max-width:480px;z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx span{position:absolute;font-size:30px;will-change:transform,opacity}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hidden{display:none!important}

/* stage 2: memory + b/d */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.mcard{aspect-ratio:3/4;border:0;border-radius:14px;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);font-size:42px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.mcard .back{font-size:26px;opacity:.9}
.mcard.open{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.mcard.low.open{background:var(--orange-soft)}
.mcard.match{background:var(--green-soft)!important;box-shadow:0 4px 0 var(--green)!important;pointer-events:none}
.mcard small{font-size:18px;line-height:1}
.counter{display:flex;justify-content:center;gap:16px;font-weight:800;color:var(--muted);margin:0 0 12px}
.bd-hint{display:flex;align-items:center;gap:12px}
.bd-hint .bedword{font-size:46px;line-height:1;direction:ltr}
.bd-hint .bedword b{color:var(--blue)}
.bd-hint .bedword i{font-style:normal;color:var(--orange)}
.bd-hint p{margin:0;font-size:15px;line-height:1.55}

/* stage 3: build a word */
.pic-row{display:flex;gap:12px;align-items:stretch}
.pic-row .pic{flex:1}
.build-wrap{display:flex;justify-content:center;margin-top:16px}
.slotwrap{display:inline-flex;flex-direction:column;direction:ltr}
.slots{display:flex;gap:8px}
.slot{width:60px;height:70px;border-radius:14px;border:3px dashed #CDBB98;background:rgba(255,255,255,.6);font-size:44px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.slot.next{border-color:var(--orange);background:var(--orange-soft)}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--card)}
.slot.ok{border-color:var(--green);background:var(--green-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft)}
.dir-arrow{position:relative;height:4px;background:var(--orange);border-radius:2px;margin:10px 6px 0 6px}
.dir-arrow::after{content:"";position:absolute;right:-6px;top:-6px;border-left:12px solid var(--orange);border-top:8px solid transparent;border-bottom:8px solid transparent}
.dir-label{direction:rtl;text-align:left;font-size:14px;font-weight:800;color:var(--orange-dark);margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr;margin:20px 0 14px}
.slots.static .slot{cursor:default}
.slot.blank{border-color:var(--orange);background:var(--orange-soft)}
.slot.blank.bad{border-color:var(--red);background:var(--red-soft);border-style:solid}

/* stage 5: tracing */
.mode-list{display:grid;gap:12px;margin-top:8px}
.trace-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.trace-top .target{font-size:64px;line-height:1;color:var(--blue)}
.trace-top .kw{display:flex;flex-direction:column;align-items:center;font-size:15px;color:var(--muted)}
.trace-top .kw .e{font-size:40px;line-height:1.1}
.word-track{display:flex;gap:6px;justify-content:center;direction:ltr;margin-bottom:8px}
.word-track span{width:46px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--card);box-shadow:0 3px 0 var(--line);color:#B7BFCE}
.word-track span.now{background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 3px 0 var(--orange)}
.word-track span.done{background:var(--green-soft);color:var(--green-dark);box-shadow:0 3px 0 var(--green)}
.canvas-wrap{display:flex;justify-content:center}
canvas.trace{background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);touch-action:none;display:block}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tile{width:62px;height:62px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-size:40px;box-shadow:0 4px 0 var(--blue-dark);padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.tile.used{visibility:hidden}

/* levels + resume */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.levels button{border:0;border-radius:14px;padding:8px 6px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.levels button small{font-size:15px;color:var(--muted)}
.levels button em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.levels button.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-dark)}
.levels button.on small,.levels button.on em{color:#fff}
.resume{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);text-align:right}
.resume .ic{font-size:30px}
.resume b{display:block;font-size:18px}
.resume span{display:block;font-size:14px;opacity:.92}
.level-letters{text-align:center;font-size:24px;letter-spacing:4px;color:var(--blue);margin:-2px 0 14px}
.stage .got .ok{display:block;color:var(--green);font-size:18px;text-align:center}
.choices.four{grid-template-columns:repeat(2,1fr)}
.choices.four .choice{aspect-ratio:auto;height:104px}
.memory.many .mcard{aspect-ratio:4/5;font-size:36px}
.mirror-hint{display:block}
.mirror-hint .letters{font-size:40px;line-height:1;direction:ltr;text-align:center;margin-bottom:6px;letter-spacing:10px}
.mirror-hint .letters span:nth-child(1){color:var(--blue)}
.mirror-hint .letters span:nth-child(2){color:var(--orange)}
.mirror-hint .letters span:nth-child(3){color:var(--green)}
.mirror-hint .letters span:nth-child(4){color:#9B51E0}
.mirror-hint p{margin:0;font-size:15px;line-height:1.55}
.reset-btn{margin-top:8px;border:0;background:none;color:var(--red);font-weight:800;text-decoration:underline;padding:4px 0}
</style>
</head>
<body>
<header class="top">
  <button id="backBtn" class="icon-btn" hidden>→ תפריט</button>
  <div class="title" id="screenTitle">אותיות באנגלית</div>
  <div class="stars" id="stars">⭐ <span id="starCount">0</span></div>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<script>/*GSAP_INLINE*/</script>
<script>
'use strict';
/* =========================================================
   Data: letters (lvl = game level), levels, words
   ========================================================= */
const LETTERS = [
  { L:'A', lvl:1, snd:'אַ (פה פתוח)', kws:[{w:'apple',e:'🍎',he:'תפוח'},{w:'ant',e:'🐜',he:'נמלה'}] },
  { L:'B', lvl:1, snd:'בּ', kws:[{w:'ball',e:'⚽',he:'כדור'},{w:'bus',e:'🚌',he:'אוטובוס'}] },
  { L:'C', lvl:1, snd:'ק', kws:[{w:'cat',e:'🐱',he:'חתול'},{w:'car',e:'🚗',he:'מכונית'}] },
  { L:'D', lvl:1, snd:'ד', kws:[{w:'dog',e:'🐶',he:'כלב'},{w:'duck',e:'🦆',he:'ברווז'}] },
  { L:'E', lvl:1, snd:'אֶ', kws:[{w:'egg',e:'🥚',he:'ביצה'},{w:'elephant',e:'🐘',he:'פיל'}] },
  { L:'F', lvl:1, snd:'פ', kws:[{w:'fish',e:'🐟',he:'דג'},{w:'frog',e:'🐸',he:'צפרדע'}] },
  { L:'G', lvl:1, snd:'ג', kws:[{w:'goat',e:'🐐',he:'עז'},{w:'gift',e:'🎁',he:'מתנה'}] },
  { L:'H', lvl:1, snd:'ה', kws:[{w:'hat',e:'🎩',he:'כובע'},{w:'house',e:'🏠',he:'בית'}] },
  { L:'I', lvl:2, snd:'אִ (קצר)', kws:[{w:'insect',e:'🐛',he:'חרק'},{w:'ink',e:'🖋️',he:'דיו'}] },
  { L:'J', lvl:2, snd:'ג׳', kws:[{w:'juice',e:'🧃',he:'מיץ'},{w:'jeans',e:'👖',he:'ג׳ינס'}] },
  { L:'K', lvl:2, snd:'ק', kws:[{w:'kite',e:'🪁',he:'עפיפון'},{w:'key',e:'🔑',he:'מפתח'}] },
  { L:'L', lvl:2, snd:'ל', kws:[{w:'lion',e:'🦁',he:'אריה'},{w:'leaf',e:'🍃',he:'עלה'}] },
  { L:'M', lvl:2, snd:'מ', kws:[{w:'moon',e:'🌙',he:'ירח'},{w:'monkey',e:'🐒',he:'קוף'}] },
  { L:'N', lvl:2, snd:'נ', kws:[{w:'nose',e:'👃',he:'אף'},{w:'nut',e:'🥜',he:'אגוז'}] },
  { L:'O', lvl:2, snd:'אוֹ', kws:[{w:'octopus',e:'🐙',he:'תמנון'},{w:'orange',e:'🍊',he:'תפוז'}] },
  { L:'P', lvl:2, snd:'פּ', kws:[{w:'pig',e:'🐷',he:'חזיר'},{w:'pizza',e:'🍕',he:'פיצה'}] },
  { L:'Q', lvl:3, snd:'קוו', kws:[{w:'queen',e:'👸',he:'מלכה'},{w:'question',e:'❓',he:'שאלה'}] },
  { L:'R', lvl:3, snd:'ר', kws:[{w:'rabbit',e:'🐰',he:'ארנב'},{w:'rain',e:'🌧️',he:'גשם'}] },
  { L:'S', lvl:3, snd:'ס', kws:[{w:'sun',e:'☀️',he:'שמש'},{w:'snake',e:'🐍',he:'נחש'}] },
  { L:'T', lvl:3, snd:'ט', kws:[{w:'tiger',e:'🐯',he:'נמר'},{w:'tree',e:'🌳',he:'עץ'}] },
  { L:'U', lvl:3, snd:'אַ (קצר)', kws:[{w:'umbrella',e:'☂️',he:'מטרייה'},{w:'up',e:'⬆️',he:'למעלה'}] },
  { L:'V', lvl:3, snd:'ו', kws:[{w:'van',e:'🚐',he:'טנדר'},{w:'violin',e:'🎻',he:'כינור'}] },
  { L:'W', lvl:3, snd:'וּ (שפתיים עגולות)', kws:[{w:'watch',e:'⌚',he:'שעון'},{w:'whale',e:'🐋',he:'לווייתן'}] },
  { L:'X', lvl:3, snd:'קס', kws:[{w:'fox',e:'🦊',he:'שועל',end:true},{w:'box',e:'📦',he:'קופסה',end:true}] },
  { L:'Y', lvl:3, snd:'י', kws:[{w:'yoyo',e:'🪀',he:'יו־יו'},{w:'yellow',e:'💛',he:'צהוב'}] },
  { L:'Z', lvl:3, snd:'ז', kws:[{w:'zebra',e:'🦓',he:'זברה'},{w:'zero',e:'0️⃣',he:'אפס'}] },
];
const LEVELS = [
  { n: 1, letters: 'ABCDEFGH',   mirror: ['b', 'd'] },
  { n: 2, letters: 'IJKLMNOP',   mirror: ['b', 'd', 'p'] },
  { n: 3, letters: 'QRSTUVWXYZ', mirror: ['b', 'd', 'p', 'q'] },
];
const rangeOf = lv => `${lv.letters[0]}–${lv.letters[lv.letters.length - 1]}`;

// Words per game level (L), only from letters learned up to that level. d = difficulty inside the level.
// tip: alternating [hebrew, english, hebrew, ...]
const T_EE = ['שתי האותיות ', 'ee', ' ביחד נשמעות כמו אִי'];
const T_OO = ['שתי האותיות ', 'oo', ' ביחד נשמעות כמו אוּ'];
const T_CK = ['האותיות ', 'ck', ' ביחד נשמעות כמו ק'];
const T_SILENT_E = ['האות ', 'e', ' בסוף שקטה: כותבים אותה אבל לא שומעים אותה'];
const WORDS = [
  // level 1: A–H
  { L:1, d:1, w:'bed',   he:'מיטה',    e:'🛏️' },
  { L:1, d:1, w:'bag',   he:'תיק',     e:'🎒' },
  { L:1, d:1, w:'dad',   he:'אבא',     e:'👨' },
  { L:1, d:1, w:'cab',   he:'מונית',   e:'🚕' },
  { L:1, d:1, w:'bad',   he:'רע',      e:'👎' },
  { L:1, d:2, w:'bee',   he:'דבורה',   e:'🐝', tip: T_EE },
  { L:1, d:2, w:'egg',   he:'ביצה',    e:'🥚', tip: ['שתי אותיות ', 'g', ' אבל שומעים צליל אחד'] },
  { L:1, d:2, w:'head',  he:'ראש',     e:'🗣️', tip: ['במילה הזו ', 'ea', ' ביחד נשמעות כמו אֶ'] },
  { L:1, d:2, w:'feed',  he:'להאכיל',  e:'🍼', tip: T_EE },
  { L:1, d:3, w:'face',  he:'פנים',    e:'😀', tip: T_SILENT_E },
  { L:1, d:3, w:'cafe',  he:'בית קפה', e:'☕' },
  { L:1, d:3, w:'beach', he:'חוף ים',  e:'🏖️', tip: ['האותיות ', 'ea', ' נשמעות כמו אִי, והאותיות ', 'ch', ' נשמעות כמו צ׳'] },
  // level 2: A–P
  { L:2, d:1, w:'pig',   he:'חזיר',    e:'🐷' },
  { L:2, d:1, w:'pen',   he:'עט',      e:'🖊️' },
  { L:2, d:1, w:'map',   he:'מפה',     e:'🗺️' },
  { L:2, d:1, w:'leg',   he:'רגל',     e:'🦵' },
  { L:2, d:1, w:'hen',   he:'תרנגולת', e:'🐔' },
  { L:2, d:1, w:'jam',   he:'ריבה',    e:'🍯' },
  { L:2, d:2, w:'milk',  he:'חלב',     e:'🥛' },
  { L:2, d:2, w:'lamp',  he:'מנורה',   e:'💡' },
  { L:2, d:2, w:'king',  he:'מלך',     e:'🤴', tip: ['האותיות ', 'ng', ' ביחד נשמעות כמו נג (באף)'] },
  { L:2, d:2, w:'hand',  he:'יד',      e:'✋' },
  { L:2, d:2, w:'lion',  he:'אריה',    e:'🦁' },
  { L:2, d:2, w:'moon',  he:'ירח',     e:'🌙', tip: T_OO },
  { L:2, d:2, w:'book',  he:'ספר',     e:'📖', tip: T_OO },

    if (v == null || v === false) continue;

}

/* =========================================================
   Speech (Web Speech API)
   ========================================================= */
const Speech = {
  ok: 'speechSynthesis' in window,
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices() || []; };
    load();
    if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = load;
  },
  voiceFor(lang) {
    const want = lang.toLowerCase().replace('_', '-');
    const base = want.slice(0, 2);
    const alt = base === 'he' ? 'iw' : base;
    const norm = v => (v.lang || '').toLowerCase().replace('_', '-');
    const list = this.voices;
    return list.find(v => norm(v) === want && v.localService) || list.find(v => norm(v) === want)
        || list.find(v => norm(v).startsWith(base) || norm(v).startsWith(alt)) || null;
  },
  say(text, lang = 'en-US', rate = 0.8) {
    return new Promise(resolve => {
      if (!this.ok || !text) return resolve();
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang; u.rate = rate; u.pitch = 1.05;
        const v = this.voiceFor(lang); if (v) u.voice = v;
        let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 600 + text.length * 160);
        speechSynthesis.speak(u);
      } catch (e) { resolve(); }
    });
  },
  en(text, rate) { return this.say(text, 'en-US', rate); },
};
Speech.init();

const G = window.gsap || null;
function pop(el) { if (!el) return; if (G) G.fromTo(el, { scale: .8 }, { scale: 1, duration: .55, ease: 'back.out(3)', clearProps: 'transform' }); }

  if (!el) return;

  else { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function burst(fromEl, count = 14) {
  const fx = $('#fx'); if (!fx) return;
  const r = fromEl ? fromEl.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const icons = ['⭐', '🌟', '✨', '🎉', '💫'];
  for (let i = 0; i < count; i++) {
    const s = h('span', null, pick(icons));
    s.style.left = (cx - 15) + 'px'; s.style.top = (cy - 15) + 'px';
    fx.append(s);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    if (G) G.fromTo(s, { x: 0, y: 0, scale: .3, opacity: 1, rotation: 0 },
      { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist - 30, scale: 1 + Math.random() * .6, opacity: 0, rotation: (Math.random() - .5) * 180,
        duration: .9 + Math.random() * .4, ease: 'power2.out', onComplete: () => s.remove() });

/* =========================================================
   Stage 1: מה שמעת? (first/last sound -> letter)
   ========================================================= */
function StageListen(res) {
  const pool = newLetters();
  let order, round = 0, earned = 0;
  if (res && res.order) { order = res.order; round = res.round; earned = res.earned; }
  else order = [...shuffle(pool), ...shuffle(pool).slice(0, 2)].map(x => [x.L, Math.floor(Math.random() * x.kws.length)]);
  const ROUNDS = order.length;

  function play() {
    Resume.save('listen', { order, round, earned });
    const app = screen('מה שמעת?');
    const item = findLetter(order[round][0]);
    const kw = item.kws[order[round][1]] || item.kws[0];
    const atEnd = !!kw.end;
    const lower = round >= Math.floor(ROUNDS / 2);
    const show = L => lower ? L.toLowerCase() : L;
    const others = shuffle(pool.map(x => x.L).filter(x => x !== item.L)).slice(0, 2);
    const options = shuffle([item.L, ...others]);
    let solved = false;
    const sayWord = () => Speech.en(kw.w, .7);

    const reveal = h('div', { class: 'word-reveal en' });
    const info = h('div', { class: 'hint blue hidden' });
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('listen', earned, () => StageListen(), 1); else play();
    });
    const msg = h('p', { class: 'sub' }, 'לחץ על התמונה כדי לשמוע שוב');

    const choices = h('div', { class: 'choices' }, options.map(L => {
      const b = h('button', { class: 'choice en', type: 'button', 'aria-label': L }, show(L));
      b.addEventListener('click', () => {
        if (solved) return;
        if (L === item.L) {
          solved = true; b.classList.add('right'); pop(b); burst(b); addStar('listen'); earned++;
          const shown = lower ? kw.w : kw.w.toUpperCase();
          reveal.innerHTML = '';
          if (atEnd) reveal.append(shown.slice(0, -1), h('b', null, shown.slice(-1)));
          else reveal.append(h('b', null, shown[0]), shown.slice(1));
          info.innerHTML = '';
          info.append('האות ', en(show(item.L)), ' נשמעת כמו ', h('b', null, item.snd), ` · ${kw.he}`);
          info.classList.remove('hidden'); nextBtn.classList.remove('hidden');
          msg.textContent = 'נכון! 🎉';
          pop(reveal);
          Speech.en(kw.w, .7);
          Resume.save('listen', { order, round: round + 1 < ROUNDS ? round + 1 : round, earned });
        } else {
          b.classList.add('wrong'); shake(b);

/* =========================================================
   Stage 2: זוגות (upper <-> lower memory) + mirror letters
   ========================================================= */
function flipTo(el, fn) {
  if (!G) { fn(); return; }
  G.to(el, { scaleX: 0, duration: .12, ease: 'power1.in', onComplete() { fn(); G.to(el, { scaleX: 1, duration: .14, ease: 'power1.out', clearProps: 'transform' }); } });
}
function StagePairs(res) {
  const app = screen('זוגות');

  if (res && res.deck) { deck = res.deck; matched = new Set(res.matched); tries = res.tries; earned = res.earned; }
  else { deck = shuffle(pool.flatMap(l => [l.L, l.L.toLowerCase()])); matched = new Set(); }
  const save = () => Resume.save('pairs', { deck, matched: [...matched], tries, earned });
  save();
  let open = [], lock = false;
  const pairsEl = h('span', null, `זוגות: ${matched.size}/${N}`);
  const triesEl = h('span', null, 'ניסיונות: ' + tries);

  const showFront = (b, c) => { b.innerHTML = ''; b.classList.add('open'); b.append(en(c.face)); };
  const showBack = b => { b.innerHTML = ''; b.classList.remove('open'); b.append(h('span', { class: 'back' }, '⭐')); };
  const markMatch = (b, c) => { showFront(b, c); b.classList.add('match'); b.append(h('small', null, c.l.kws[0].e)); };

  const cards = deck.map(face => ({ face, l: findLetter(face), low: face !== face.toUpperCase() }));

    b.addEventListener('click', () => {

      tries++; triesEl.textContent = 'ניסיונות: ' + tries;
      const [x, y] = open; open = [];
      if (x.c.l === y.c.l) {

        const kw = x.c.l.kws[0];

          for (const it of [x, y]) { it.b.classList.add('match'); it.b.append(h('small', null, kw.e)); pop(it.b); }

        setTimeout(() => { flipTo(x.b, () => showBack(x.b)); flipTo(y.b, () => showBack(y.b)); lock = false; }, 1100);
      }

  }));

  const doneBox = h('div', { class: 'hidden' });

    doneBox.style.marginTop = '16px'; doneBox.style.textAlign = 'center';
    doneBox.append(h('div', { class: 'prompt' }, `מצאת את כל הזוגות ב־${tries} ניסיונות! 🎉`),
      h('p', { class: 'sub' }, 'עכשיו אתגר קטן: האותיות ', set.flatMap((L, i) => [i ? ' ' : '', en(L)]), ' נראות כמו מראה. בוא נלמד להבדיל ביניהן.'),
      h('button', { class: 'btn orange wide', onclick: () => MirrorChallenge(earned) }, 'לאתגר אותיות מראה ←'));
    enter(doneBox); burst(doneBox, 18); checkBreak();

  }

  app.append(h('div', { class: 'prompt' }, 'מצא זוג: אות גדולה ואות קטנה'),
    h('p', { class: 'sub' }, 'הפוך שני קלפים. אם זו אותה אות, מצאת זוג!'),
    h('div', { class: 'counter' }, pairsEl, triesEl), grid, doneBox);
  enter(grid);
  if (matched.size === N) setTimeout(done, 300);
}

function MirrorChallenge(earnedBefore = 0, res) {

    items = shuffle(Array.from({ length: ROUNDS }, (_, i) => { const L = set[i % set.length]; const p = pools[L]; return [L, p[Math.floor(i / set.length) % p.length]]; }));
  }

/* =========================================================
   Stage 3: בונים מילה (tap letters, slots fill left -> right)
   ========================================================= */
function tipEl(tip) {
  if (!tip) return null;
  return h('div', { class: 'hint' }, '💡 ', tip.map((p, i) => i % 2 ? en(fmt(p)) : p));
}
function StageBuild(res) {
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round; earned = res.earned; }
  else list = sessionWords();
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('build', { list: list.map(w => w.w), round: r, earned });

  function play() {
    saveAt(round);
    const app = screen('בונים מילה');
    const item = list[round];
    const letters = [...fmt(item.w)];
    const distract = shuffle(knownABC().map(fmt).filter(x => !letters.includes(x))).slice(0, 2);
    const tiles = shuffle([...letters, ...distract]).map(ch => ({ ch, used: false, el: null }));
    const slots = letters.map(() => null);
    let solved = false, busy = false;
    const sayWord = () => Speech.en(item.w, .7);
    const size = slotSizeFor(letters.length);

    const msg = h('p', { class: 'sub' }, 'לחץ על האותיות לפי הסדר. הן נכנסות משמאל לימין.');
    const extra = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('build', earned, () => StageBuild(), 3); else play();
    });

    const slotEls = letters.map((_, i) => {
      const b = h('button', { class: 'slot en', type: 'button', 'aria-label': 'משבצת ' + (i + 1) });
      sizeSlot(b, size);
      b.addEventListener('click', () => {
        if (solved || busy || !slots[i]) return;
        slots[i].used = false; slots[i] = null; refresh();
      });
      return b;
    });
    tiles.forEach(t => {
      t.el = h('button', { class: 'tile en', type: 'button' }, t.ch);
      t.el.addEventListener('click', () => {
        if (solved || busy || t.used) return;
        const i = slots.indexOf(null); if (i < 0) return;
        slots[i] = t; t.used = true; refresh(); pop(slotEls[i]);
        if (!slots.includes(null)) check();
      });
    });

    function refresh() {
      const nextIdx = slots.indexOf(null);
      slotEls.forEach((el, i) => {
        el.textContent = slots[i] ? slots[i].ch : '';
        el.classList.toggle('filled', !!slots[i]);
        el.classList.toggle('next', i === nextIdx);
        el.classList.remove('bad');
      });
      tiles.forEach(t => t.el.classList.toggle('used', t.used));
    }

    function check() {
      const wrong = slots.map((t, i) => t.ch !== letters[i] ? i : -1).filter(i => i >= 0);
      if (!wrong.length) {
        solved = true;
        slotEls.forEach(el => { el.classList.add('ok'); el.classList.remove('next'); });
        burst(slotEls[slotEls.length >> 1], 18); addStar('build'); earned++;
        msg.innerHTML = ''; msg.append('נכון! ', en(fmt(item.w)), ` = ${item.he} 🎉`);
        const t = tipEl(item.tip); if (t) { extra.append(t); enter(t); }
        nextBtn.classList.remove('hidden'); hintBtn.classList.add('hidden');
        sayWord();
        saveAt(round + 1 < ROUNDS ? round + 1 : round);
        return;
      }
      busy = true;
      wrong.forEach(i => { slotEls[i].classList.add('bad'); shake(slotEls[i]); });
      msg.textContent = 'כמעט! האותיות באדום לא במקום. נסה שוב 🙂';
      sayWord();
      setTimeout(() => { wrong.forEach(i => { slots[i].used = false; slots[i] = null; }); busy = false; refresh(); }, 1000);
    }

    const hintBtn = h('button', { class: 'btn secondary small', onclick: () => {
      if (solved || busy) return;
      const i = slots.findIndex((t, k) => !t || t.ch !== letters[k]);
      if (i < 0) return;
      if (slots[i]) { slots[i].used = false; slots[i] = null; }
      const t = tiles.find(x => !x.used && x.ch === letters[i]);
      if (!t) return;
      slots[i] = t; t.used = true; refresh(); pop(slotEls[i]);
      if (!slots.includes(null)) check();
    } }, '💡 רמז');

    const board = h('div', { class: 'build-wrap' },
      h('div', { class: 'slotwrap' },
        h('div', { class: 'slots' }, slotEls),
        h('div', { class: 'dir-arrow', 'aria-hidden': 'true' }),
        h('div', { class: 'dir-label' }, '👆 מתחילים כאן, משמאל')));

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, 'בנה באנגלית את המילה: ', h('span', { style: 'color:var(--blue)' }, item.he)),
      speakerPic(item.e, sayWord), board,
      h('div', { class: 'tiles' }, tiles.map(t => t.el)),
      msg, h('div', { class: 'row' }, hintBtn), extra, nextBtn);
    refresh(); enter(board);
    setTimeout(sayWord, 350);
  }
  play();
}

/* =========================================================
   Stage 4: מה חסר? (missing letter, mostly vowels)
   ========================================================= */
const VOWELS = 'aeiou';
function StageMissing(res) {
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round; earned = res.earned; }
  else list = sessionWords();
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('missing', { list: list.map(w => w.w), round: r, earned });
  const known = knownABC();
  const knownVowels = known.map(x => x.toLowerCase()).filter(x => VOWELS.includes(x));

  function play() {
    saveAt(round);
    const app = screen('מה חסר?');
    const item = list[round];
    const letters = [...fmt(item.w)];
    const vowelIdx = letters.map((c, i) => VOWELS.includes(c.toLowerCase()) ? i : -1).filter(i => i >= 0);
    const miss = vowelIdx.length && Math.random() < .7 ? pick(vowelIdx) : Math.floor(Math.random() * letters.length);
    const answer = letters[miss];
    const isVowel = VOWELS.includes(answer.toLowerCase());
    const consonants = known.map(fmt).filter(x => x !== answer && !VOWELS.includes(x.toLowerCase()));
    const otherVowels = knownVowels.map(fmt).filter(x => x !== answer);
    const distract = isVowel ? [pick(otherVowels), pick(consonants)] : shuffle(known.map(fmt).filter(x => x !== answer)).slice(0, 2);
    const options = shuffle([answer, ...distract]);
    let solved = false;
    const sayWord = () => Speech.en(item.w, .7);
    const size = slotSizeFor(letters.length);

    const slotEls = letters.map((c, i) => { const s = h('span', { class: 'slot en ' + (i === miss ? 'blank' : 'filled') }, i === miss ? '?' : c); sizeSlot(s, size); return s; });
    const blank = slotEls[miss];
    const msg = h('p', { class: 'sub' }, 'איזו אות חסרה? לחץ על התמונה כדי לשמוע');
    const extra = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('missing', earned, () => StageMissing(), 4); else play();
    });

    const choices = h('div', { class: 'choices' }, options.map(L => {
      const b = h('button', { class: 'choice en', type: 'button', 'aria-label': L }, L);
      b.addEventListener('click', () => {
        if (solved) return;
        if (L === answer) {
          solved = true; b.classList.add('right');
          blank.textContent = answer; blank.classList.remove('blank'); slotEls.forEach(s => s.classList.add('ok'));
          pop(blank); burst(blank, 16); addStar('missing'); earned++;
          msg.innerHTML = ''; msg.append('נכון! ', en(fmt(item.w)), ` = ${item.he} 🎉`);
          if (isVowel) { const v = h('div', { class: 'hint green' }, '👏 בלי האות ', en(answer), ' המילה לא שלמה. באנגלית התנועה היא אות!'); extra.append(v); enter(v); }
          const t = tipEl(item.tip); if (t) { extra.append(t); enter(t); }
          nextBtn.classList.remove('hidden');
          sayWord();
          saveAt(round + 1 < ROUNDS ? round + 1 : round);
        } else {
          b.classList.add('wrong'); shake(b);
          blank.textContent = L; blank.classList.add('bad'); shake(blank);
          msg.textContent = 'כמעט! הקשב למילה ונסה אות אחרת 🙂';
          sayWord();
          setTimeout(() => { if (!solved) { blank.textContent = '?'; blank.classList.remove('bad'); } }, 1000);
        }
      });
      return b;
    }));

    app.append(progressDots(ROUNDS, round),
      ...(round === 0 ? [h('div', { class: 'hint blue' }, '💡 באנגלית אין ניקוד. את התנועות כותבים עם האותיות ', en(knownVowels.map(fmt).join(' ')), '.')] : []),
      h('div', { class: 'prompt' }, 'השלם את המילה: ', h('span', { style: 'color:var(--blue)' }, item.he)),
      speakerPic(item.e, sayWord),
      h('div', { class: 'build-wrap' }, h('div', { class: 'slots static', style: 'direction:ltr' }, slotEls)),
      msg, choices, extra, nextBtn);
    enter(choices);
    setTimeout(sayWord, 350);
  }
  play();
}

  v: [[[25, XH], [50, BL], [75, XH]]],
  w: [[[14, XH], [32, BL], [50, 60], [68, BL], [86, XH]]],
  x: [[[28, XH], [72, BL]], [[72, XH], [28, BL]]],
  y: [[[26, XH], [50, BL]], [[74, XH], [50, BL], [36, DS]]],
  z: [[[28, XH], [72, XH], [28, BL], [72, BL]]],
};
function resample(pts, step = 2.5) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(d / step));
    for (let k = 1; k <= n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  return out;
}

function makeTracer(letter, { onSuccess, onMsg }) {
  const strokes = STROKES[letter].map(s => resample(s));
  const samples = strokes.flat();
  const ink = [];
  let drawing = false, done = false, missing = null, demo = null, rafId = 0;

  const maxByHeight = Math.max(200, (window.innerHeight - 340) / 1.2);
  const cssW = Math.round(Math.min(300, document.querySelector('main').clientWidth - 32, maxByHeight));
  const cssH = Math.round(cssW * 1.2);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const canvas = h('canvas', { class: 'trace', width: Math.round(cssW * dpr), height: Math.round(cssH * dpr), 'aria-label': 'משטח כתיבה' });
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  const k = cssW / 100 * dpr;

  function path(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = .7;
    for (const [y, dash, col] of [[T, [3, 3], '#E6DAC4'], [XH, [3, 3], '#E6DAC4'], [BL, [], '#CDBB98']]) {
      ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(4, y); ctx.lineTo(96, y); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = done ? '#C8F0DA' : '#E8ECF4'; ctx.lineWidth = 13;
    strokes.forEach(s => { path(s); ctx.stroke(); });
    ctx.strokeStyle = done ? '#7FD3A6' : '#B4BED0'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    strokes.forEach(s => { path(s); ctx.stroke(); });
    ctx.setLineDash([]);
    if (!done) {
      const placed = [];
      strokes.forEach((s, i) => {
        if (s.length >= 6) {
          const fi = Math.min(s.length - 2, Math.max(3, Math.floor(s.length * .45)));
          const [ax, ay] = s[fi], [bx, by] = s[fi + 1];
          const ang = Math.atan2(by - ay, bx - ax);
          ctx.strokeStyle = '#8A96AD'; ctx.lineWidth = 1.6; ctx.beginPath();
          ctx.moveTo(ax - Math.cos(ang - .6) * 4.5, ay - Math.sin(ang - .6) * 4.5); ctx.lineTo(ax, ay);
          ctx.lineTo(ax - Math.cos(ang + .6) * 4.5, ay - Math.sin(ang + .6) * 4.5); ctx.stroke();
        }
        let [mx, my] = s[0];
        if (placed.some(([px, py]) => Math.hypot(px - mx, py - my) < 8)) { const q = s[Math.min(s.length - 1, 4)]; [mx, my] = q; }
        placed.push([mx, my]);
        ctx.fillStyle = '#FF8A3D'; ctx.beginPath(); ctx.arc(mx, my, 4.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 6px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), mx, my + .3);
      });
    }
    if (missing && !done) { ctx.fillStyle = 'rgba(255,138,61,.75)'; missing.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }); }
    ctx.strokeStyle = done ? '#22A86A' : '#2F6FED'; ctx.lineWidth = 6;
    ink.forEach(s => { if (s.length === 1) { ctx.beginPath(); ctx.arc(s[0][0], s[0][1], 3, 0, Math.PI * 2); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); } else { path(s); ctx.stroke(); } });
    if (demo) {
      ctx.strokeStyle = 'rgba(255,138,61,.9)'; ctx.lineWidth = 5;
      for (let i = 0; i < demo.si; i++) { path(strokes[i]); ctx.stroke(); }
      const cur = strokes[demo.si]; if (cur) {
        const upto = cur.slice(0, Math.max(1, Math.floor(demo.pi) + 1)); path(upto); ctx.stroke();
        const [x, y] = upto[upto.length - 1]; ctx.fillStyle = '#FF8A3D'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  const toUnits = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 120]; };
  canvas.addEventListener('pointerdown', e => {
    if (done) return; e.preventDefault(); stopDemo();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    drawing = true; missing = null; ink.push([toUnits(e)]); render();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const s = ink[ink.length - 1], p = toUnits(e), last = s[s.length - 1];
    const d = Math.hypot(p[0] - last[0], p[1] - last[1]); if (d < 1) return;
    const n = Math.ceil(d / 2); for (let i = 1; i <= n; i++) s.push([last[0] + (p[0] - last[0]) * i / n, last[1] + (p[1] - last[1]) * i / n]);
    render();
  });
  const end = () => { if (!drawing) return; drawing = false; check(false); };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);

  // every stroke must be mostly covered (so a missing dot or bar is caught), and ink must stay near the letter
  function evaluate() {
    const pts = ink.flat();
    if (pts.length < 1) return { cov: 0, minStroke: 0, prec: 0, miss: samples };
    const T2 = 9 * 9, P2 = 12 * 12; let covered = 0, inside = 0, minStroke = 1; const miss = [];
    for (const s of strokes) {
      let c = 0;
      for (const [sx, sy] of s) { let ok = false; for (const [x, y] of pts) { const dx = sx - x, dy = sy - y; if (dx * dx + dy * dy <= T2) { ok = true; break; } } if (ok) c++; else miss.push([sx, sy]); }
      covered += c; minStroke = Math.min(minStroke, c / s.length);
    }
    for (const [x, y] of pts) { for (const [sx, sy] of samples) { const dx = sx - x, dy = sy - y; if (dx * dx + dy * dy <= P2) { inside++; break; } } }
    return { cov: covered / samples.length, minStroke, prec: inside / pts.length, miss };
  }
  function check(manual) {
    if (done) return;
    const r = evaluate();
    const coveredEnough = r.cov >= .85 && r.minStroke >= .75;
    if (coveredEnough && r.prec >= .8) { done = true; missing = null; render(); onSuccess && onSuccess(canvas); return; }
    if (coveredEnough) { onMsg && onMsg('יצאת קצת מהקו האפור. לחץ "נקה" ונסה שוב 🙂'); return; }
    if (manual) { missing = r.miss; render(); onMsg && onMsg(ink.length ? 'כמעט! עבור גם על הנקודות הכתומות 🙂' : 'התחל בנקודה 1 וכתוב באצבע לפי החץ'); }
  }
  function clear() { if (done) return; ink.length = 0; missing = null; render(); }
  function stopDemo() { if (rafId) cancelAnimationFrame(rafId); rafId = 0; demo = null; }
  function showDemo() {
    if (done) return; stopDemo(); ink.length = 0; missing = null;
    demo = { si: 0, pi: 0 }; let last = performance.now(), pause = 0;
    const SPEED = 26;
    const step = now => {
      const dt = (now - last) / 1000; last = now;
      if (pause > 0) pause -= dt; else {
        demo.pi += dt * SPEED;
        if (demo.pi >= strokes[demo.si].length - 1) { demo.si++; demo.pi = 0; pause = .35; }
      }
      render();
      if (demo.si < strokes.length) rafId = requestAnimationFrame(step);
      else { rafId = 0; setTimeout(() => { if (!rafId) { demo = null; render(); } }, 700); }
    };
    rafId = requestAnimationFrame(step);
  }
  render();
  return { el: canvas, clear, showDemo, check: () => check(true), destroy: stopDemo };
}

function traceTools(tr) {
  return h('div', { class: 'tools' },
    h('button', { class: 'btn secondary small', onclick: () => tr.showDemo() }, '👀 הראה לי'),
    h('button', { class: 'btn secondary small', onclick: () => tr.clear() }, '🧽 נקה'),
    h('button', { class: 'btn small', onclick: () => tr.check() }, '✔ בדוק'));
}

function StageWrite() {
  const app = screen('כותבים');
  const kind = state.caseMode === 'upper' ? 'גדולות' : 'קטנות';
  const lv = curLevel();
  app.append(
    h('div', { class: 'prompt' }, 'מה כותבים היום?'),
    h('p', { class: 'sub' }, `כותבים באותיות ${kind} (אפשר לשנות בתפריט הראשי).`),
    h('div', { class: 'mode-list' },
      h('button', { class: 'stage', onclick: () => WriteLetters() },
        h('span', { class: 'num' }, '✏️'),
        h('span', { class: 'txt' }, h('b', null, 'אות אחרי אות'), h('span', null, 'האותיות של הרמה: ', en(fmt(lv.letters[0])), ' עד ', en(fmt(lv.letters[lv.letters.length - 1]))))),
      h('button', { class: 'stage', onclick: () => WriteWords() },
        h('span', { class: 'num' }, '📝'),
        h('span', { class: 'txt' }, h('b', null, 'מילה שלמה'), h('span', null, 'כותבים מילה, אות אחרי אות, משמאל לימין')))),
    h('div', { class: 'hint blue' }, '💡 מתחילים תמיד בנקודה ', h('b', null, '1'), ' וממשיכים לפי החץ. לא בטוח? לחץ "הראה לי".'));
}

function WriteLetters(res) {
  const order = curLevel().letters.split('').map(fmt);
  let idx = 0, earned = 0;
  if (res && res.idx != null) { idx = res.idx; earned = res.earned; }
  function play() {
    Resume.save('write-letters', { idx, round: idx, earned });
    const app = screen('כותבים אותיות');
    const ch = order[idx];
    const kw = findLetter(ch).kws[0];
    const msg = h('p', { class: 'sub' }, 'התחל בנקודה 1 וכתוב באצבע לפי החץ');
    const nextBtn = nextButton(idx === order.length - 1, () => {
      idx++; if (idx >= order.length) EndScreen('write', earned, () => StageWrite()); else play();
    });
    nextBtn.style.marginTop = '12px';
    const tr = makeTracer(ch, {
      onMsg: t => { msg.textContent = t; },
      onSuccess: c => {
        addStar('write'); earned++; burst(c, 16); pop(c);
        msg.innerHTML = ''; msg.append('יפה מאוד! ', en(ch), ' כמו ', en(fmt(kw.w)), ' 🎉');
        nextBtn.classList.remove('hidden'); tools.classList.add('hidden');
        Speech.en(kw.w, .75);
        Resume.save('write-letters', { idx: idx + 1 < order.length ? idx + 1 : idx, round: idx + 1 < order.length ? idx + 1 : idx, earned });
      },
    });
    cleanup = tr.destroy;
    const tools = traceTools(tr);
    app.append(progressDots(order.length, idx),
      h('div', { class: 'trace-top' },
        h('span', { class: 'target en' }, ch),
        h('span', { class: 'kw' }, h('span', { class: 'e' }, kw.e), en(fmt(kw.w)))),
      h('div', { class: 'canvas-wrap' }, tr.el), msg, tools, nextBtn);
    enter(tr.el);
  }
  play();
}

function WriteWords(res) {
  let list, wi = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); wi = res.wi; earned = res.earned; }
  else list = [...shuffle(levelWords(1)).slice(0, 2), ...shuffle(levelWords(2)).slice(0, 1), ...shuffle(levelWords(3)).slice(0, 1)];
  const saveAt = w => Resume.save('write-words', { list: list.map(x => x.w), wi: w, round: w, earned });
  function playWord() {
    saveAt(wi);
    const item = list[wi];
    const letters = [...fmt(item.w)];
    let li = 0;
    function playLetter() {
      const app = screen('כותבים מילה');
      const ch = letters[li];
      const track = h('div', { class: 'word-track' }, letters.map((c, i) => h('span', { class: 'en ' + (i < li ? 'done' : i === li ? 'now' : '') }, c)));
      const msg = h('p', { class: 'sub' }, `אות ${li + 1} מתוך ${letters.length}. מתחילים משמאל →`);
      const nextBtn = nextButton(wi === list.length - 1, () => {
        wi++; if (wi >= list.length) EndScreen('write', earned, () => StageWrite()); else playWord();
      }, 'למילה הבאה ←');
      nextBtn.style.marginTop = '12px';
      const tr = makeTracer(ch, {
        onMsg: t => { msg.textContent = t; },
        onSuccess: c => {
          addStar('write'); earned++; pop(c);
          track.children[li].className = 'en done'; pop(track.children[li]);
          if (li < letters.length - 1) { burst(c, 8); li++; setTimeout(playLetter, 750); return; }
          burst(track, 22);
          msg.innerHTML = ''; msg.append('כתבת את המילה ', en(fmt(item.w)), ` = ${item.he}! 🎉`);
          tools.classList.add('hidden'); nextBtn.classList.remove('hidden');
          Speech.en(item.w, .7);
          saveAt(wi + 1 < list.length ? wi + 1 : wi);
        },
      });
      cleanup = tr.destroy;
      const tools = traceTools(tr);
      app.append(progressDots(list.length, wi),
        h('div', { class: 'prompt' }, `${item.e} כתוב באנגלית: `, h('span', { style: 'color:var(--blue)' }, item.he)),
        track, h('div', { class: 'canvas-wrap' }, tr.el), msg, tools, nextBtn);
      enter(tr.el);
      if (li === 0) setTimeout(() => Speech.en(item.w, .7), 300);
    }
    playLetter();
  }
  playWord();
}

/* =========================================================
   Stage registry
   ========================================================= */
STAGES.push(
  { key: 'listen',  icon: '👂', name: 'מה שמעת?',   desc: 'שומעים מילה ובוחרים את האות', run: () => StageListen() },
  { key: 'pairs',   icon: '🃏', name: 'זוגות',      desc: 'אות גדולה ואות קטנה, ואתגר אותיות מראה', run: () => StagePairs() },
  { key: 'build',   icon: '🧩', name: 'בונים מילה', desc: 'רואים תמונה ובונים את המילה משמאל לימין', run: () => StageBuild() },
  { key: 'missing', icon: '🔍', name: 'מה חסר?',    desc: 'משלימים את האות שחסרה במילה', run: () => StageMissing() },
  { key: 'write',   icon: '✏️', name: 'כותבים',     desc: 'כותבים אותיות ומילים באצבע', run: () => StageWrite() },
);

renderStars();
Home();
</script>
