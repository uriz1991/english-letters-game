<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABC">
<title>אותיות באנגלית</title>
<style>
@font-face{font-family:'Andika';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,/*FONT_B64*/) format('woff2');}
:root{
  --bg:#FFF8EC;--card:#FFFFFF;--ink:#22304A;--muted:#5F6B84;
  --blue:#2F6FED;--blue-dark:#1F4FB8;--blue-soft:#E4ECFF;
  --orange:#FF8A3D;--orange-dark:#C9621F;--orange-soft:#FFE9DA;
  --green:#22A86A;--green-dark:#17794C;--green-soft:#DDF6E9;
  --red:#E5484D;--red-soft:#FDE2E3;--line:#E9DDC7;
  --radius:18px;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.en{font-family:'Andika',system-ui,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:2px solid var(--line)}
.top .title{flex:1;font-weight:800;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 2px 0 var(--line);min-height:40px}
.icon-btn[hidden]{display:inline-block;visibility:hidden}
.stars{font-weight:800;background:var(--card);padding:8px 10px;border-radius:12px;box-shadow:0 2px 0 var(--line);min-width:70px;text-align:center}
.timer{font-weight:800;background:var(--card);padding:8px 8px;border-radius:12px;box-shadow:0 2px 0 var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.timer[hidden]{display:none}
#app.think .choice,#app.think .opt,#app.think .tile,#app.think .chip:not(.placed){pointer-events:none;opacity:.45;filter:grayscale(.5);transition:opacity .3s}
.think-badge{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.think-badge[hidden]{display:none}
.btn.google-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:2px solid #dadce0;box-shadow:0 3px 0 #dadce0}
.google-btn .g-logo{font-family:Arial,sans-serif;font-weight:900;font-size:19px;background:conic-gradient(from -45deg,#ea4335 0 25%,#4285f4 0 50%,#34a853 0 75%,#fbbc05 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.acct-err{color:var(--red);font-weight:700}
.acct-err:empty{display:none}
.map-go{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 4px;padding:14px 16px;border:0;border-radius:20px;background:linear-gradient(135deg,#2f80ed,#7b61ff);color:#fff;text-align:start;box-shadow:0 5px 0 #1d5bb8;font:inherit}
.map-go .ic{font-size:34px}.map-go b{display:block;font-size:21px}.map-go span span{font-size:14px;opacity:.95}
.map-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-size:17px}
.map-list{display:flex;flex-direction:column;gap:8px}
.map-phase{margin:14px 2px 2px;font-weight:800;color:var(--ink)}
.map-st{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:2px solid var(--line,#e6dccb);background:var(--card,#fff);text-align:start;font:inherit;color:inherit}
.map-st .ic{font-size:26px;width:34px;text-align:center}.map-st .txt{flex:1}.map-st small{display:block;opacity:.75}
.map-st .got{color:#f5a623;font-weight:800;white-space:nowrap}
.map-st.now{border-color:#2f80ed;box-shadow:0 0 0 3px rgba(47,128,237,.25)}.map-st.now .got{color:#2f80ed}
.map-st.locked{opacity:.5}.map-st.quiz:not(.locked){border-style:dashed}
.map-stars{font-size:40px;letter-spacing:6px;color:#d8d0c2}.map-stars .on{color:#f5a623}
.pts-track{position:relative;height:14px;border-radius:99px;background:#eee4d4;margin:6px auto 12px;max-width:320px;overflow:visible}
.pts-track i{position:absolute;inset:0 0 0 auto;border-radius:99px;background:linear-gradient(90deg,#3ac569,#2f80ed)}
.pts-track b{position:absolute;top:-5px;width:3px;height:24px;background:var(--ink);border-radius:2px}
.sticker-won{font-size:72px;margin:6px 0}
.free-note{margin:16px 2px 6px;font-size:14px;line-height:1.45}.free-note b{display:block;font-size:17px;margin-bottom:2px}
.board{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
.board-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card,#fff);border:2px solid var(--line,#eee4d4)}
.board-row.me{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.25)}
.board-row .rank{font-size:24px;width:30px;text-align:center;font-weight:800}.board-row .av{font-size:30px}
.board-row .nm{flex:1}.board-row .nm b{display:block}.board-row .nm small{opacity:.75}
.board-row .pts{font-weight:800;color:#e09412;white-space:nowrap}
.kids-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.kid-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line,#eee4d4)}
.kid-row:last-child{border-bottom:0}
.kid-row .av{font-size:28px}.kid-row .nm{flex:1;font-weight:700}.kid-row .nm small{font-weight:400;opacity:.7}
.who.editing .who-card{outline:2px dashed #2f80ed;outline-offset:-4px}
.login-card{margin-top:14px}
.login-card p{margin:8px 0 14px}
.login-card .google-btn{justify-content:center;font-size:19px}
.login-card .small-note{font-size:13px;margin:14px 0 0;color:var(--muted,#666)}
.timer.low{background:var(--orange-soft);box-shadow:0 2px 0 var(--orange)}
.timer.over{background:var(--red-soft);box-shadow:0 2px 0 var(--red)}

main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:16px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-dark)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.btn.small{font-size:16px;min-height:44px;padding:8px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 3px 0 var(--line)}
.prompt{font-size:21px;font-weight:800;text-align:center;margin:4px 0 12px;line-height:1.35}
.sub{color:var(--muted);text-align:center;font-size:15px;margin:0 0 12px;line-height:1.5}
.hint{background:var(--orange-soft);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:16px;line-height:1.5}
.hint.blue{background:var(--blue-soft)}
.hint.green{background:var(--green-soft)}

.progress{display:flex;gap:6px;justify-content:center;margin:2px 0 14px;direction:rtl}
.progress i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--green)}
.progress i.now{background:var(--orange);transform:scale(1.25)}

.pic{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 4px 0 var(--line);border:0;width:100%}
.pic .emoji{font-size:88px;line-height:1.1}
.pic .say{font-size:15px;color:var(--blue);font-weight:800}
.word-reveal{font-size:40px;letter-spacing:2px;min-height:52px;text-align:center}
.word-reveal b{color:var(--orange)}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;direction:ltr}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{font-size:58px;aspect-ratio:1;border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.choice.right{background:var(--green-soft);box-shadow:0 5px 0 var(--green)}
.choice.wrong{background:var(--red-soft);box-shadow:0 5px 0 var(--red);opacity:.55;pointer-events:none}

.home-hello{text-align:center;margin:4px 0 14px}
.home-hello h1{font-size:26px;margin:0 0 4px}
.case-toggle{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.case-toggle button{border:0;border-radius:14px;padding:8px 14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px}
.case-toggle button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.stage-list{display:grid;gap:12px}
.stage{display:flex;align-items:center;gap:12px;text-align:right;border:0;background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:0 4px 0 var(--line);width:100%}
.stage .num{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--blue-soft)}
.stage .txt{flex:1;min-width:0}
.stage .txt b{display:block;font-size:18px}
.stage .txt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.stage .got{flex:none;font-weight:800;font-size:14px;color:var(--muted)}
.parents{margin-top:18px;font-size:14px;color:var(--muted);line-height:1.6}
.parents summary{font-weight:800;cursor:pointer}

.end{text-align:center;padding-top:20px}
.end .big{font-size:84px}
.end h2{font-size:26px;margin:8px 0}

.toast{position:fixed;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));margin:0 auto;max-width:480px;z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx span{position:absolute;font-size:30px;will-change:transform,opacity}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hidden{display:none!important}

/* stage 2: memory + b/d */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.mcard{aspect-ratio:3/4;border:0;border-radius:14px;background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);font-size:42px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.mcard .back{font-size:26px;opacity:.9}
.mcard.open{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.mcard.low.open{background:var(--orange-soft)}
.mcard.match{background:var(--green-soft)!important;box-shadow:0 4px 0 var(--green)!important;pointer-events:none}
.mcard small{font-size:18px;line-height:1}
.counter{display:flex;justify-content:center;gap:16px;font-weight:800;color:var(--muted);margin:0 0 12px}
.bd-hint{display:flex;align-items:center;gap:12px}
.bd-hint .bedword{font-size:46px;line-height:1;direction:ltr}
.bd-hint .bedword b{color:var(--blue)}
.bd-hint .bedword i{font-style:normal;color:var(--orange)}
.bd-hint p{margin:0;font-size:15px;line-height:1.55}

/* stage 3: build a word */
.pic-row{display:flex;gap:12px;align-items:stretch}
.pic-row .pic{flex:1}
.build-wrap{display:flex;justify-content:center;margin-top:16px}
.slotwrap{display:inline-flex;flex-direction:column;direction:ltr}
.slots{display:flex;gap:8px}
.slot{width:60px;height:70px;border-radius:14px;border:3px dashed #CDBB98;background:rgba(255,255,255,.6);font-size:44px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.slot.next{border-color:var(--orange);background:var(--orange-soft)}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--card)}
.slot.ok{border-color:var(--green);background:var(--green-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft)}
.dir-arrow{position:relative;height:4px;background:var(--orange);border-radius:2px;margin:10px 6px 0 6px}
.dir-arrow::after{content:"";position:absolute;right:-6px;top:-6px;border-left:12px solid var(--orange);border-top:8px solid transparent;border-bottom:8px solid transparent}
.dir-label{direction:rtl;text-align:left;font-size:14px;font-weight:800;color:var(--orange-dark);margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr;margin:20px 0 14px}
.slots.static .slot{cursor:default}
.slot.blank{border-color:var(--orange);background:var(--orange-soft)}
.slot.blank.bad{border-color:var(--red);background:var(--red-soft);border-style:solid}

/* stage 5: tracing */
.mode-list{display:grid;gap:12px;margin-top:8px}
.trace-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.trace-top .target{font-size:64px;line-height:1;color:var(--blue)}
.trace-top .kw{display:flex;flex-direction:column;align-items:center;font-size:15px;color:var(--muted)}
.trace-top .kw .e{font-size:40px;line-height:1.1}
.word-track{display:flex;gap:6px;justify-content:center;direction:ltr;margin-bottom:8px}
.word-track span{width:46px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--card);box-shadow:0 3px 0 var(--line);color:#B7BFCE}
.word-track span.now{background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 3px 0 var(--orange)}
.word-track span.done{background:var(--green-soft);color:var(--green-dark);box-shadow:0 3px 0 var(--green)}
.canvas-wrap{display:flex;justify-content:center}
canvas.trace{background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);touch-action:none;display:block}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tile{width:62px;height:62px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-size:40px;box-shadow:0 4px 0 var(--blue-dark);padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.tile.used{visibility:hidden}

/* levels + resume */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.levels button{border:0;border-radius:14px;padding:8px 6px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.levels button small{font-size:15px;color:var(--muted)}
.levels button em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.levels button.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-dark)}
.levels button.on small,.levels button.on em{color:#fff}
.resume{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);text-align:right}
.resume .ic{font-size:30px}
.resume b{display:block;font-size:18px}
.resume span{display:block;font-size:14px;opacity:.92}
.level-letters{text-align:center;font-size:24px;letter-spacing:4px;color:var(--blue);margin:-2px 0 14px}
.stage .got .ok{display:block;color:var(--green);font-size:18px;text-align:center}
.choices.four{grid-template-columns:repeat(2,1fr)}
.choices.four .choice{aspect-ratio:auto;height:104px}
.memory.many .mcard{aspect-ratio:4/5;font-size:36px}
.mirror-hint{display:block}
.mirror-hint .letters{font-size:40px;line-height:1;direction:ltr;text-align:center;margin-bottom:6px;letter-spacing:10px}
.mirror-hint .letters span:nth-child(1){color:var(--blue)}
.mirror-hint .letters span:nth-child(2){color:var(--orange)}
.mirror-hint .letters span:nth-child(3){color:var(--green)}
.mirror-hint .letters span:nth-child(4){color:#9B51E0}
.mirror-hint p{margin:0;font-size:15px;line-height:1.55}
.reset-btn{margin-top:8px;border:0;background:none;color:var(--red);font-weight:800;text-decoration:underline;padding:4px 0}

/* profiles + personal area */
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.who-card{border:0;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 0 var(--line);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:18px;min-width:0}
.who-card .av{font-size:56px;line-height:1.1}
.who-card small{font-size:14px;color:var(--muted);font-weight:700}
.who-card.add{background:transparent;border:3px dashed #CDBB98;box-shadow:none;color:var(--muted)}
.who-card .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:block;margin:14px 0 6px;font-weight:800}
.text-in{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.text-in:focus{outline:none;border-color:var(--blue)}
.pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick-grid button{border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:30px;aspect-ratio:1;padding:0}
.pick-grid button.on{background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:0;border-radius:14px;padding:10px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:17px}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.me-bar{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:var(--radius);box-shadow:0 3px 0 var(--line);padding:10px 12px;margin:0 0 12px;text-align:right}
.me-bar .av{font-size:38px;line-height:1}
.me-bar .mid{flex:1;min-width:0}
.me-bar .mid b{display:block;font-size:19px}
.goal-track{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.goal-track i{display:block;height:100%;background:var(--green);border-radius:6px}
.me-bar .mid span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.me-bar .fire{flex:none;text-align:center;font-weight:800;font-size:13px;color:var(--orange-dark)}
.me-bar .fire em{display:block;font-style:normal;font-size:26px;line-height:1.1}
.me-head{text-align:center}
.me-head .av{font-size:80px;line-height:1.1}
.me-head h1{margin:4px 0 2px;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--line);padding:10px 4px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.album span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:32px}
.album span.locked{background:transparent;box-shadow:none;border:2px dashed var(--line);color:#CDBB98;font-size:20px;font-weight:800}
.sec-title{font-size:18px;font-weight:800;margin:20px 0 10px}
.modal{position:fixed;inset:0;z-index:45;background:rgba(34,48,74,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:380px;width:100%;text-align:center;padding:22px 18px}
.modal .sticker{font-size:96px;line-height:1.1;display:inline-block}

/* parent report */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 4px 0;direction:rtl}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);font-weight:700}
.bars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 0 0;background:var(--blue);min-height:2px}
.bars i.goal{background:var(--green)}
.bars em{font-style:normal;font-size:11px;margin-bottom:2px}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.lgrid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:22px;background:var(--card);box-shadow:0 2px 0 var(--line);color:#B7BFCE}
.lgrid span.known{background:var(--green-soft);color:var(--green-dark);box-shadow:0 2px 0 var(--green)}
.lgrid span.weak{background:var(--orange-soft);color:var(--orange-dark);box-shadow:0 2px 0 var(--orange)}
.lgrid span.seen{color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-left:4px}
.wlist{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:0 2px 0 var(--line);padding:8px 12px}
.wrow .e{font-size:28px}
.wrow .t{flex:1;min-width:0}
.wrow .t b{font-size:18px}
.wrow .t span{display:block;font-size:13px;color:var(--muted)}
.wrow .n{font-size:13px;font-weight:800;color:var(--orange-dark);text-align:center}
.review-card{background:var(--orange-soft)!important;box-shadow:0 4px 0 var(--orange)!important;margin-bottom:12px}
.review-card .num{background:#fff!important}

/* stage 6: reading */
.read-tiles{display:flex;justify-content:center;gap:8px;direction:ltr;margin:10px 0 4px}
.rtile{border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;min-width:58px}
.rtile .en{font-size:46px;line-height:1.05}
.rtile .hs{font-size:20px;font-weight:800;color:var(--orange-dark);min-height:26px;direction:rtl}
.rtile.next{background:var(--orange-soft);box-shadow:0 4px 0 var(--orange)}
.rtile.done{background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.blend{font-size:40px;font-weight:800;text-align:center;color:var(--blue);margin:8px 0 0;min-height:52px}
.choices.pics .choice{font-size:64px}

/* stage 7: phrases */
.pic.still{cursor:default}
.situation{font-size:20px;font-weight:800;text-align:center;line-height:1.4;margin:12px 0 4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt-row{display:flex;gap:8px;direction:ltr}
.opt{flex:1;border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:20px;font-weight:800;min-height:58px;padding:10px 14px;line-height:1.3}
.opt.en{font-size:22px}
.opt.right{background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.opt.wrong{background:var(--red-soft);box-shadow:0 4px 0 var(--red);opacity:.55;pointer-events:none}
.ear{flex:none;width:58px;border:0;border-radius:16px;background:var(--blue-soft);box-shadow:0 4px 0 var(--line);font-size:24px}
.phrase-line{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:ltr;min-height:64px;margin:12px 0;padding:8px;border:3px dashed #CDBB98;border-radius:16px;background:rgba(255,255,255,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:22px;padding:8px 14px;box-shadow:0 4px 0 var(--blue-dark);min-height:48px}
.chip.placed{background:var(--green-soft);color:var(--ink);box-shadow:0 3px 0 var(--green);pointer-events:none}
.chip.used{visibility:hidden}
.say-card{text-align:center}
.say-card .big-en{font-size:28px;display:block;margin-bottom:2px}
.say-card p{margin:6px 0}
.mini-ear{border:0;background:#fff;border-radius:10px;padding:2px 8px;margin-inline-start:6px;font-size:18px;box-shadow:0 2px 0 var(--line)}
</style>
</head>

// Pronunciation tip from spelling (first pattern that matches)
function autoTip(w) {
  if (w in MANUAL_TIPS) return MANUAL_TIPS[w];
  if (w.startsWith('kn')) return ['האות ', 'k', ' בהתחלה שקטה: לא שומעים אותה'];
  if (w.endsWith('mb')) return ['האות ', 'b', ' בסוף שקטה: לא שומעים אותה'];
  const digraphs = [
    ['sh', 'נשמעות כמו ש'], ['ch', 'נשמעות כמו צ׳'], ['th', 'נשמעות ביחד כשהלשון בין השיניים'],
    ['ph', 'נשמעות כמו פ'], ['ck', 'נשמעות כמו ק'], ['qu', 'נשמעות כמו קוו'], ['ng', 'נשמעות כמו נג (באף)'],
    ['ee', 'נשמעות כמו אִי'], ['oo', 'נשמעות כמו אוּ'], ['ai', 'נשמעות כמו אֵיי'], ['oa', 'נשמעות כמו אוֹ'],
    ['ou', 'נשמעות כמו אַאוּ'],
  ];
  for (const [g, t] of digraphs) if (w.includes(g)) return ['האותיות ', g, ' ביחד ' + t];
  const dbl = w.match(/([b-df-hj-np-tv-z])\1/);
  if (dbl) return ['שתי אותיות ', dbl[1], ' אבל שומעים צליל אחד'];
  if (w.length >= 4 && /[aeiou][^aeiou]e$/.test(w)) return T_SILENT_E;
  return null;
}

    WORDS.push(tip ? { L: +lvl, d, w, he, e, tip } : { L: +lvl, d, w, he, e });

}

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const en = (text, cls = '') => h('span', { class: ('en ' + cls).trim() }, text);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

   If localStorage is blocked (private mode), values live in memory for this visit only. */
const MEM = {};
const RAW = {
  get(k, d) { try { const v = localStorage.getItem('abcAH_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return k in MEM ? MEM[k] : d; } },
  set(k, v) { try { localStorage.setItem('abcAH_' + k, JSON.stringify(v)); } catch (e) { MEM[k] = v; } },
  del(k) { try { localStorage.removeItem('abcAH_' + k); } catch (e) { delete MEM[k]; } },
};

const AVATARS = ['🦁', '🐯', '🐼', '🦊', '🐸', '🐵', '🦄', '🐙', '🐬', '🦖', '🐧', '🐝'];
const Profiles = {
  list() { return RAW.get('profiles', []); },
  save(list) { RAW.set('profiles', list); },
  get(id) { return this.list().find(p => p.id === id) || null; },
  add(p) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5); this.save([...this.list(), { ...p, id }]); onKidChange(id); return id; },
  update(id, patch) { this.save(this.list().map(p => p.id === id ? { ...p, ...patch } : p)); onKidChange(id); },
  remove(id) {
    onKidRemoved(id);
    for (const k of PROFILE_KEYS) RAW.del(`p${id}_${k}`);
    this.save(this.list().filter(p => p.id !== id));
    if (RAW.get('active', null) === id) RAW.del('active');
  },
  // first run after the update: progress saved before profiles existed moves into one profile
  migrate() {
    if (RAW.get('profiles', null)) return;
    const legacy = ['stars', 'stageStars', 'done', 'case', 'level', 'resume'];
    if (!legacy.some(k => RAW.get(k, null) != null)) { this.save([]); return; }
    const id = this.add({ name: 'השחקן שלי', avatar: '🦁', g: 'm' });
    for (const k of legacy) { const v = RAW.get(k, null); if (v != null) RAW.set(`p${id}_${k}`, v); RAW.del(k); }
    RAW.set('active', id);
  },
};

const g = (m, f) => (me() && me().g === 'f') ? f : m;

function loadProfile(id) {

/* Version update. The build writes the version into the game and into version.json on the site.
   "Check" asks the site for version.json; "update" clears the offline copy and loads the new one.
   Progress lives in localStorage, so updating never touches it. */
const APP_VERSION = '/*APP_VERSION*/', APP_BUILT = '/*APP_BUILT*/';
const SITE = 'https://uriz1991.github.io/english-letters-game/';
function updateBox() {
  const fromFile = location.protocol === 'file:';
  const status = h('p', { style: 'margin:8px 0 0' });
  const act = h('div', { class: 'row', style: 'justify-content:flex-start;margin-top:8px' });
  const check = async () => {
    status.textContent = '⏳ בודקים מול האתר...';
    btn.disabled = true;
    let remote = null;
    try {
      const r = await fetch((fromFile ? SITE : './') + 'version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) remote = await r.json();
    } catch (e) {}
    btn.disabled = false;
    act.querySelectorAll('.upd-go').forEach(x => x.remove());
    if (!remote || !remote.version) { status.textContent = '📡 אין חיבור לאתר כרגע. בדקו שיש אינטרנט ונסו שוב.'; return; }
    if (remote.version === APP_VERSION) { status.textContent = '✅ זו הגרסה האחרונה.'; return; }
    status.textContent = `🆕 יש גרסה חדשה (מ־${remote.built}).`;
    act.append(fromFile
      ? h('a', { class: 'btn green small upd-go', href: SITE, target: '_blank', rel: 'noopener' }, 'פתיחת הגרסה החדשה באתר')
      : h('button', { class: 'btn green small upd-go', onclick: () => applyUpdate(remote.version) }, '⬇️ לעדכן עכשיו'));
  };
  const btn = h('button', { class: 'btn small', onclick: check }, '🔄 בדיקת עדכון');
  act.append(btn);
  return h('div', { class: 'card', id: 'updateBox', style: 'margin:12px 0' },
    h('b', null, '🔄 עדכון גרסה'),
    h('p', { style: 'margin:6px 0' }, 'הגרסה בטלפון: ', h('span', { dir: 'ltr' }, APP_BUILT), fromFile ? '. זה קובץ ששלחו, והוא לא מתעדכן לבד.' : ''),
    act, status,
    h('p', { style: 'margin:8px 0 0;font-size:13px' }, 'העדכון לא מוחק את ההתקדמות של הילדים.'));
}
async function applyUpdate(v) {
  toast('⏳ מורידים את הגרסה החדשה...');
  RAW.set('updTo', v);
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
  for (const u of ['./', './index.html']) { try { await fetch(u, { cache: 'reload' }); } catch (e) {} }
  location.reload();
}
// after the reload: tell the parent if it worked
function afterUpdate() {
  const want = RAW.get('updTo', null); if (!want) return;
  RAW.del('updTo');
  toast(want === APP_VERSION ? `✅ המשחק עודכן לגרסה החדשה (${APP_BUILT})` : '⏳ הגרסה החדשה עוד לא הגיעה לשרת. נסו שוב בעוד כמה דקות.');
}

/* =========================================================
   Parent account (Google sign-in through Firebase) + saving the children in the account
   On the site the parent signs in first. Each child's progress is kept on the phone (so the game works
   offline) and copied to the parent's account, so it can continue on another phone.
   A file sent in WhatsApp cannot sign in, so there everything stays on the phone like before.
   ========================================================= */
const FB_LIB = 'https://www.gstatic.com/firebasejs/13.1.0/';   // Google's own CDN, pinned version
const FB_CONFIG = {
  apiKey: 'AIzaSyCnauAFLGJR5vAVBFBIiCNzbiuTgEeAOfI', authDomain: 'english-letters-game.firebaseapp.com',
  projectId: 'english-letters-game', appId: '1:70760524380:web:d83fb5bd6a81130ccb1499',
};
const FS = 'https://firestore.googleapis.com/v1/projects/english-letters-game/databases/(default)/documents';
const Cloud = {
  user: null, auth: null, fa: null, loading: null, err: '',
  // Google sign-in works only from the site itself (an allowed domain), not from a file
  possible() { return location.protocol === 'https:' || location.hostname === 'localhost'; },
  known() { return RAW.get('acct', null); },
  load() {
    if (!this.possible()) return Promise.reject(new Error('file'));
    if (!this.loading) this.loading = (async () => {
      const [fapp, fa] = await Promise.all([import(FB_LIB + 'firebase-app.js'), import(FB_LIB + 'firebase-auth.js')]);
      const auth = fa.getAuth(fapp.initializeApp(FB_CONFIG));
      auth.languageCode = 'he';
      await auth.authStateReady();
      this.fa = fa; this.auth = auth; this.setUser(auth.currentUser);
      fa.onAuthStateChanged(auth, u => { this.setUser(u); this.redraw(); });
      return auth;
    })().catch(e => { this.loading = null; throw e; });
    return this.loading;
  },
  setUser(u) {
    this.user = u || null;
    if (u) RAW.set('acct', { name: u.displayName || '', email: u.email || '' }); else RAW.del('acct');
  },
  async uid() { await this.load(); if (!this.auth.currentUser) throw new Error('signed-out'); return this.auth.currentUser.uid; },
  async token() { await this.load(); if (!this.auth.currentUser) throw new Error('signed-out'); return this.auth.currentUser.getIdToken(); },
  // returns true when signed in; on failure leaves a Hebrew message in Cloud.err
  async signIn() {
    this.err = '';
    try {
      await this.load();
      const p = new this.fa.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      const r = await this.fa.signInWithPopup(this.auth, p);
      this.setUser(r.user);
      return true;
    } catch (e) {
      const c = (e && e.code) || '';
      this.err = c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? ''
        : c === 'auth/popup-blocked' ? 'הדפדפן חסם את חלון ההתחברות. מאשרים חלונות קופצים לאתר הזה ומנסים שוב.'
        : c === 'auth/network-request-failed' || !navigator.onLine || !c ? 'אין חיבור לאינטרנט. בפעם הראשונה צריך אינטרנט כדי להתחבר.'
        : c === 'auth/operation-not-supported-in-this-environment' || c === 'auth/web-storage-unsupported' ? 'הדפדפן הזה לא מאפשר התחברות. פותחים את האתר ב־Chrome או ב־Safari ומנסים שוב.'

    }

  async signOut() {
    if (Sync.pending()) await Sync.push();
    if (Sync.pending()) {

    } else if (!confirm('להתנתק? הילדים וההתקדמות שמורים בחשבון, ויחזרו כשמתחברים שוב.')) return;
    try { await this.load(); await this.fa.signOut(this.auth); } catch (e) {}
    this.setUser(null);

/* Children in the account: parents/{parent}/kids/{child} = name, avatar, boy/girl, progress (JSON text), updated.

const Sync = {

  on() { return Cloud.possible() && !!Cloud.known(); },
  dirty() { return RAW.get('dirty', {}); },
  pending() { return Object.keys(this.dirty()).length + RAW.get('delq', []).length; },
  setStatus(s) { this.status = s; Cloud.redraw(); },
  touch(id) {
    if (!id || !this.on()) return;
    RAW.set(`p${id}_upd`, Date.now());
    const d = this.dirty(); if (!d[id]) { d[id] = 1; RAW.set('dirty', d); }
    this.later();
  },
  removed(id) {
    RAW.del(`p${id}_upd`);
    const d = this.dirty(); delete d[id]; RAW.set('dirty', d);
    const s = RAW.get('synced', []);
    if (this.on() && s.includes(id)) { RAW.set('delq', [...new Set([...RAW.get('delq', []), id])]); RAW.set('synced', s.filter(x => x !== id)); }
    this.later(1000);
  },
  // one send at a time, a few seconds after the last change (play keeps writing, so the timer is not reset)
  later(ms = 8000) { if (!this.on() || this.timer) return; this.timer = setTimeout(() => { this.timer = null; this.push(); }, ms); },
  async api(method, path, body, keepalive) {
    const tok = await Cloud.token();
    const r = await fetch(FS + path, {
      method, keepalive: !!keepalive, cache: 'no-store',
      headers: body ? { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' } : { Authorization: 'Bearer ' + tok },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 404 && method !== 'PATCH') return null;
    if (!r.ok) throw new Error('save ' + r.status);
    return r.json().catch(() => null);
  },
  kidDoc(id) {
    const p = Profiles.get(id), progress = {};
    for (const k of PROFILE_KEYS) { const v = RAW.get(`p${id}_${k}`, null); if (v != null) progress[k] = v; }
    return { fields: {
      name: { stringValue: String(p.name).slice(0, 30) }, avatar: { stringValue: p.avatar }, g: { stringValue: p.g === 'f' ? 'f' : 'm' },
      progress: { stringValue: JSON.stringify(progress) }, updated: { integerValue: String(RAW.get(`p${id}_upd`, Date.now())) },
    } };
  },
  async push(keepalive) {
    if (!this.on() || this.busy || !this.pending()) return;
    if (!navigator.onLine) { this.setStatus('offline'); this.later(30000); return; }
    this.busy = true; this.setStatus('saving');
    try {
      const uid = await Cloud.uid();
      for (const id of RAW.get('delq', [])) {
        await this.api('DELETE', `/parents/${uid}/kids/${id}`, null, keepalive);
        RAW.set('delq', RAW.get('delq', []).filter(x => x !== id));
      }
      for (const id of Object.keys(this.dirty())) {
        if (!Profiles.get(id)) { const d = this.dirty(); delete d[id]; RAW.set('dirty', d); continue; }
        const at = RAW.get(`p${id}_upd`, 0);
        await this.api('PATCH', `/parents/${uid}/kids/${id}`, this.kidDoc(id), keepalive);
        const d = this.dirty(); if (RAW.get(`p${id}_upd`, 0) === at) delete d[id]; RAW.set('dirty', d);   // changed while sending: send again
        const s = RAW.get('synced', []); if (!s.includes(id)) RAW.set('synced', [...s, id]);
      }
      this.setStatus(this.pending() ? 'saving' : 'saved');
      if (this.pending()) this.later(2000);
    } catch (e) {
      this.setStatus(navigator.onLine ? 'error' : 'offline'); this.later(60000);
    }
    this.busy = false;
  },
  // bring the account's children to this phone. Returns true if something on the phone changed.
  async pull() {
    const uid = await Cloud.uid();
    const out = await this.api('GET', `/parents/${uid}/kids?pageSize=100`);
    const docs = (out && out.documents) || [];
    const inCloud = new Set(), d = this.dirty(), synced = new Set(RAW.get('synced', [])), gone = new Set(RAW.get('delq', []));
    let list = Profiles.list(), changed = false;
    for (const doc of docs) {
      const id = doc.name.split('/').pop(), f = doc.fields || {};
      if (gone.has(id)) continue;   // deleted here, the delete is still on its way
      inCloud.add(id); synced.add(id);
      const cu = Number((f.updated && f.updated.integerValue) || 0);
      const local = list.find(p => p.id === id);
      if (local && RAW.get(`p${id}_upd`, 0) >= cu) { if (RAW.get(`p${id}_upd`, 0) > cu) d[id] = 1; continue; }
      let prog = {}; try { prog = JSON.parse((f.progress && f.progress.stringValue) || '{}'); } catch (e) {}
      for (const k of PROFILE_KEYS) { if (k in prog) RAW.set(`p${id}_${k}`, prog[k]); else RAW.del(`p${id}_${k}`); }
      const meta = { id, name: (f.name && f.name.stringValue) || 'ילד', avatar: (f.avatar && f.avatar.stringValue) || '🦁', g: f.g && f.g.stringValue === 'f' ? 'f' : 'm' };
      list = local ? list.map(p => p.id === id ? { ...p, ...meta } : p) : [...list, meta];
      RAW.set(`p${id}_upd`, cu); delete d[id]; changed = true;
    }
    // a child that was in the account but is not there any more was deleted on another phone
    for (const p of [...list]) if (!inCloud.has(p.id)) {
      if (synced.has(p.id) && !d[p.id]) {
        for (const k of PROFILE_KEYS) RAW.del(`p${p.id}_${k}`);
        RAW.del(`p${p.id}_upd`); synced.delete(p.id); list = list.filter(x => x.id !== p.id); changed = true;
      } else d[p.id] = 1;   // made on this phone and not sent yet
    }
    Profiles.save(list); RAW.set('dirty', d); RAW.set('synced', [...synced]);
    if (PID && !Profiles.get(PID)) { PID = null; RAW.del('active'); }
    else if (PID && changed) loadProfile(PID);
    return changed;
  },
  // right after the parent signs in
  async start() {
    const uid = await Cloud.uid(), owner = RAW.get('owner', null);
    if (owner && owner !== uid) this.wipeLocal();   // children of another account were left on this phone
    if (!owner) {   // children made before there were accounts move into this account
      const d = this.dirty();
      for (const p of Profiles.list()) { if (!RAW.get(`p${p.id}_upd`, 0)) RAW.set(`p${p.id}_upd`, 1); d[p.id] = 1; }
      RAW.set('dirty', d);
    }
    RAW.set('owner', uid);
    await this.pull();
    await this.push();
  },
  // in the background when the game opens: new children / progress from other phones
  async refresh() {
    if (!this.on() || !navigator.onLine) return;
    try {
      await Cloud.load();
      if (!Cloud.user) return;
      const changed = await this.pull();
      await this.push();
      if (changed && document.querySelector('#app .stage-list, #app .who')) { renderStars(); Home(); }
    } catch (e) {}
  },
  wipeLocal() {
    for (const p of Profiles.list()) { for (const k of PROFILE_KEYS) RAW.del(`p${p.id}_${k}`); RAW.del(`p${p.id}_upd`); }
    Profiles.save([]);
    for (const k of ['active', 'dirty', 'synced', 'delq']) RAW.del(k);
    PID = null;
  },
};

// back: where to return after editing (from the parents area it goes back there, without switching child)
function ProfileForm(id, back) {
  const old = id ? Profiles.get(id) : null;
  const app = screen(old ? 'עריכת פרופיל' : 'ילד חדש', Profiles.list().length > 0);
  let avatar = old ? old.avatar : AVATARS[0], gender = old ? old.g : 'm';
  const name = h('input', { class: 'text-in', type: 'text', maxlength: '14', autocomplete: 'off', placeholder: 'למשל: נועם', value: old ? old.name : '' });
  const avGrid = h('div', { class: 'pick-grid' }, AVATARS.map(a => {
    const b = h('button', { type: 'button', class: a === avatar ? 'on' : '', 'aria-label': a }, a);
    b.addEventListener('click', () => { avatar = a; [...avGrid.children].forEach(x => x.classList.toggle('on', x === b)); pop(b); });
    return b;
  }));
  const seg = h('div', { class: 'seg' }, [['m', 'בן'], ['f', 'בת']].map(([v, t]) => {
    const b = h('button', { type: 'button', class: v === gender ? 'on' : '' }, t);
    b.addEventListener('click', () => { gender = v; [...seg.children].forEach(x => x.classList.toggle('on', x === b)); });
    return b;
  }));
  const err = h('p', { class: 'sub hidden', style: 'color:var(--red)' }, 'צריך לכתוב שם 🙂');
  const save = () => {
    const nm = name.value.trim().slice(0, 14);
    if (!nm) { err.classList.remove('hidden'); shake(name); name.focus(); return; }
    let pid = id;
    if (old) Profiles.update(id, { name: nm, avatar, g: gender });
    else pid = Profiles.add({ name: nm, avatar, g: gender });
    if (old) toast(`✅ נשמר: ${nm}`);
    if (old && back) return back();
    loadProfile(pid); renderStars(); Home();
  };
  name.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  app.append(...[
    old ? null : h('div', { class: 'home-hello' }, h('h1', null, 'שלום! 👋'), h('p', { class: 'sub' }, 'בואו ניצור פרופיל לילד שמשחק.')),
    h('label', { class: 'field' }, 'שם או כינוי'), name,
    h('p', { class: 'field' }, 'בחירת דמות'), avGrid,
    h('p', { class: 'field' }, 'איך לפנות?'), seg,
    err,
    h('div', { class: 'row' }, h('button', { class: 'btn green wide', onclick: save }, old ? 'שמירה' : 'יאללה, מתחילים! ←')),
    old ? h('div', { class: 'row' }, h('button', { class: 'reset-btn', onclick: () => {
      if (!confirm(`למחוק את ${old.name} וכל ההתקדמות שלו/שלה?`)) return;
      Profiles.remove(id);
      if (id === PID) PID = null;
      renderStars();
      if (back) return back();
      ProfilePicker();
    } }, `מחיקת הפרופיל של ${old.name}`)) : null].filter(Boolean));
}

    h('div', { class: 'sec-title' }, `האלבום שלי (${state.stickers.length}/${STICKERS.length})`),

  enter(album);

/* =========================================================

function lastDays(n) {

}
function ParentReport() {

  const days = lastDays(7);

  const hardList = hard.length ? h('div', { class: 'wlist' }, hard.map(([k, m]) => {
    const w = findWord(k.slice(2));
    return h('div', { class: 'wrow' },

      h('span', { class: 'n' }, `${m.w} טעויות`, h('br'), Mastery.isWeak(k) ? 'עוד מתאמנים' : '✅ כבר הצליח/ה'));
  })) : h('p', { class: 'sub' }, 'עוד אין מילים שהיו קשות. 👍');

  const mirror = ['b', 'd', 'p', 'q'].map(L => [L, Mastery.get('M:' + L)]).filter(([, m]) => m);
  const mirrorEl = mirror.length ? h('div', { class: 'wlist' }, mirror.map(([L, m]) => h('div', { class: 'wrow' },
    h('span', { class: 'e en' }, L),
    h('span', { class: 't' }, h('b', null, `${m.r} נכון · ${m.w} טעויות`)),
    h('span', { class: 'n' }, Mastery.isWeak('M:' + L) ? 'מתבלבל/ת' : '✅')))) : h('p', { class: 'sub' }, 'עוד לא שיחקו באתגר אותיות מראה.');

  const stagesEl = h('div', { class: 'wlist' }, LEVELS.map(l => {

    return h('div', { class: 'wrow' }, h('span', { class: 't' }, h('b', null, `רמה ${l.n} `), en(rangeOf(l))),
      h('span', { class: 'n', style: 'color:var(--green-dark)' }, `${done}/${STAGES.length} שלבים`));
  }));

  const weekGuess = days.reduce((a, d) => a + (state.guess[dayKey(d)] || 0), 0);
  const guessEl = h('div', { class: 'card' },
    h('p', { style: 'margin:0' }, h('b', null, weekGuess ? `🤔 ${weekGuess} סבבים השבוע היו עם הרבה ניחושים.` : '👍 השבוע כמעט לא היו ניחושים.')),
    h('p', { style: 'margin:6px 0 0;font-size:14px' }, 'סבב עם הרבה תשובות שגויות ברצף נחשב ניחוש: לא מקבלים עליו כוכב, וההתקדמות לא נספרת. אחרי כמה ניחושים ברצף המשחק עוצר, מסביר, ונותן כמה שניות לחשוב לפני כל תשובה.'));
  const known = LETTERS.filter(x => Mastery.isKnown('L:' + x.L)).map(x => x.L);
  const weakL = LETTERS.filter(x => Mastery.isWeak('L:' + x.L)).map(x => x.L);
  const summary = () => [

    h('div', { class: 'sec-title' }, 'זמן משחק (דקות) ב־7 הימים האחרונים'),

      h('span', null, h('i', { style: 'background:var(--green)' }), `הגיע/ה ליעד (${state.goal} דק׳)`),
      h('span', null, h('i', { style: 'background:var(--blue)' }), 'שיחק/ה פחות מהיעד'))),
    h('div', { class: 'sec-title' }, 'אותיות'),
    letterGrid(), legend(),
    h('div', { class: 'sec-title' }, 'מילים שהיו קשות'), hardList,
    h('div', { class: 'sec-title' }, 'ניחושים'), guessEl,
    h('div', { class: 'sec-title' }, 'אותיות מראה ', en('b d p q')), mirrorEl,
    h('div', { class: 'sec-title' }, 'שלבים שהושלמו'), stagesEl,
    h('p', { class: 'sub', style: 'margin-top:14px' }, 'מילה או אות נחשבות "ידועות" אחרי שתי תשובות נכונות ברצף בניסיון הראשון. מה שהיה קשה חוזר לבד בסבבים הבאים, ויש לו גם כפתור "חזרה" בתפריט.'),
    h('div', { class: 'row' }, h('button', { class: 'btn green', onclick: share }, '📤 שליחת סיכום')));
}

/* =========================================================
   Stage 1: מה שמעת? (first/last sound -> letter)
   ========================================================= */
function StageListen(res) {
  const rv = !!(res && res.review);       // review mode: hard letters from every level learned so far
  const SK = rv ? 'review' : 'listen';
  const pool = rv ? LETTERS.filter(x => x.lvl <= state.level) : newLetters();
  let order, round = 0, earned = 0;
  if (res && res.order) { order = res.order; round = res.round || 0; earned = res.earned || 0; }
  else if (Run) {
    // map station: most rounds on the station's letters, a few on letters met before (so they are not forgotten)
    const old = shuffle(LETTERS.filter(x => Run.known.includes(x.L) && !Run.letters.includes(x.L)));
    const oldN = old.length ? Math.min(old.length, Math.round(Run.rounds / 4)) : 0;
    const main = Array.from({ length: Run.rounds - oldN }, (_, i) => pool[i % pool.length]);
    order = shuffle([...main, ...old.slice(0, oldN)]).map(x => [x.L, Math.floor(Math.random() * x.kws.length)]);
  } else {
    // the 2 extra rounds go to letters that were hard before, if there are any
    const weak = shuffle(newLetters().filter(x => Mastery.isWeak('L:' + x.L)));
    const extra = [...weak, ...shuffle(pool)].slice(0, 2);
    order = [...shuffle(pool), ...extra].map(x => [x.L, Math.floor(Math.random() * x.kws.length)]);
  }
  const ROUNDS = order.length;
  const save = r => Resume.save('listen', { order, round: r, earned, review: rv || undefined, words: res && res.words });

  function play() {
    save(round);
    const app = screen(rv ? 'חזרה: מה שמעת?' : 'מה שמעת?');
    const item = findLetter(order[round][0]);
    const kw = item.kws[order[round][1]] || item.kws[0];
    const atEnd = !!kw.end;
    const lower = round >= Math.floor(ROUNDS / 2);
    const show = L => lower ? L.toLowerCase() : L;
    // on the map the number of answers grows with the child's knowledge
    const others = Run ? shuffle(Run.known.filter(x => x !== item.L)).slice(0, Run.opts - 1)
      : shuffle(pool.map(x => x.L).filter(x => x !== item.L)).slice(0, 2);
    const options = shuffle([item.L, ...others]);
    let solved = false, firstTry = true; Guard.start();
    const sayWord = () => Speech.en(kw.w, .7);

    const reveal = h('div', { class: 'word-reveal en' });
    const info = h('div', { class: 'hint blue hidden' });
    const nextBtn = nextButton(round === ROUNDS - 1 && !(rv && res.words && res.words.length), () => {
      round++;
      if (round < ROUNDS) return play();
      if (rv && res.words && res.words.length) return StageBuild({ review: true, list: res.words, round: 0, earned });
      if (rv) return EndScreen('review', earned, () => StageReview());
      EndScreen('listen', earned, () => StageListen(), 1);
    });
    const msg = h('p', { class: 'sub' }, g('לחץ על התמונה כדי לשמוע שוב', 'לחצי על התמונה כדי לשמוע שוב'));

    const choices = h('div', { class: 'choices' }, options.map(L => {
      const b = h('button', { class: 'choice en', type: 'button', 'aria-label': L }, show(L));
      b.addEventListener('click', () => {
        if (solved) return;
        if (L === item.L) {
          solved = true; b.classList.add('right'); pop(b); burst(b); earned += Guard.star(SK);
          Mastery.rec('L:' + item.L, firstTry);
          const shown = lower ? kw.w : kw.w.toUpperCase();
          reveal.innerHTML = '';
          if (atEnd) reveal.append(shown.slice(0, -1), h('b', null, shown.slice(-1)));
          else reveal.append(h('b', null, shown[0]), shown.slice(1));
          info.innerHTML = '';
          info.append('האות ', en(show(item.L)), ' נשמעת כמו ', h('b', null, item.snd), ` · ${kw.he}`);
          info.classList.remove('hidden'); nextBtn.classList.remove('hidden');
          msg.textContent = 'נכון! 🎉';
          pop(reveal);
          Speech.en(kw.w, .7);
          save(round + 1 < ROUNDS ? round + 1 : round);
        } else {
          b.classList.add('wrong'); shake(b); firstTry = false; Guard.miss();
          msg.textContent = 'כמעט! ' + g('הקשב', 'הקשיבי') + (atEnd ? ' לצליל האחרון ' : ' לצליל הראשון ') + g('ונסה', 'ונסי') + ' שוב 🙂';
          sayWord();
        }
      });
      return b;
    }));

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, atEnd ? 'באיזו אות נגמרת המילה?' : 'באיזו אות מתחילה המילה?'),
      speakerPic(kw.e, sayWord), reveal, msg, choices, info, nextBtn);
    enter(choices);
    setTimeout(sayWord, 350);
  }
  play();
}

/* =========================================================
   Stage 2: זוגות (upper <-> lower memory) + mirror letters
   ========================================================= */
function flipTo(el, fn) {
  if (!G) { fn(); return; }
  G.to(el, { scaleX: 0, duration: .12, ease: 'power1.in', onComplete() { fn(); G.to(el, { scaleX: 1, duration: .14, ease: 'power1.out', clearProps: 'transform' }); } });
}
function StagePairs(res) {
  const app = screen('זוגות');
  const pool = newLetters(), N = pool.length;
  let deck, matched, tries = 0, earned = 0;
  if (res && res.deck) { deck = res.deck; matched = new Set(res.matched); tries = res.tries; earned = res.earned; }
  else { deck = shuffle(pool.flatMap(l => [l.L, l.L.toLowerCase()])); matched = new Set(); }
  const save = () => Resume.save('pairs', { deck, matched: [...matched], tries, earned });
  save();
  let open = [], lock = false;
  const pairsEl = h('span', null, `זוגות: ${matched.size}/${N}`);
  const triesEl = h('span', null, 'ניסיונות: ' + tries);

  const showFront = (b, c) => { b.innerHTML = ''; b.classList.add('open'); b.append(en(c.face)); };
  const showBack = b => { b.innerHTML = ''; b.classList.remove('open'); b.append(h('span', { class: 'back' }, '⭐')); };
  const markMatch = (b, c) => { showFront(b, c); b.classList.add('match'); b.append(h('small', null, c.l.kws[0].e)); };

  const cards = deck.map(face => ({ face, l: findLetter(face), low: face !== face.toUpperCase() }));
  const grid = h('div', { class: 'memory' + (cards.length > 16 ? ' many' : '') }, cards.map(c => {
    const b = h('button', { class: 'mcard' + (c.low ? ' low' : ''), type: 'button', 'aria-label': 'קלף', 'data-k': c.l.L });
    if (matched.has(c.l.L)) markMatch(b, c); else showBack(b);
    b.addEventListener('click', () => {
      if (lock || b.classList.contains('open') || b.classList.contains('match')) return;
      flipTo(b, () => showFront(b, c));
      open.push({ b, c });
      if (open.length < 2) return;
      tries++; triesEl.textContent = 'ניסיונות: ' + tries;
      const [x, y] = open; open = [];
      if (x.c.l === y.c.l) {
        matched.add(x.c.l.L); pairsEl.textContent = `זוגות: ${matched.size}/${N}`;
        const kw = x.c.l.kws[0];
        setTimeout(() => {
          for (const it of [x, y]) { it.b.classList.add('match'); it.b.append(h('small', null, kw.e)); pop(it.b); }
          burst(y.b, 8); addStar('pairs'); earned++; runAdd(0); save();
          Speech.en(`${x.c.l.L.toLowerCase()}, ${kw.w}`, .75);
          if (matched.size === N) setTimeout(done, 900);
        }, 260);
      } else {
        lock = true; save();
        setTimeout(() => { shake(x.b); shake(y.b); }, 300);
        setTimeout(() => { flipTo(x.b, () => showBack(x.b)); flipTo(y.b, () => showBack(y.b)); lock = false; }, 1100);
      }
    });
    return b;
  }));

  const doneBox = h('div', { class: 'hidden' });
  function done() {
    if (Run) return EndScreen('pairs', earned);   // on the map, mirror letters are a station of their own
    const set = curLevel().mirror;
    Resume.save('mirror', { earned });
    doneBox.className = 'card';
    doneBox.style.marginTop = '16px'; doneBox.style.textAlign = 'center';
    doneBox.append(h('div', { class: 'prompt' }, `מצאת את כל הזוגות ב־${tries} ניסיונות! 🎉`),
      h('p', { class: 'sub' }, 'עכשיו אתגר קטן: האותיות ', set.flatMap((L, i) => [i ? ' ' : '', en(L)]), ' נראות כמו מראה. ' + g('בוא', 'בואי') + ' נלמד להבדיל ביניהן.'),
      h('button', { class: 'btn orange wide', onclick: () => MirrorChallenge(earned) }, 'לאתגר אותיות מראה ←'));
    enter(doneBox); burst(doneBox, 18); checkBreak();
    doneBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  app.append(h('div', { class: 'prompt' }, g('מצא', 'מצאי') + ' זוג: אות גדולה ואות קטנה'),
    h('p', { class: 'sub' }, g('הפוך', 'הפכי') + ' שני קלפים. אם זו אותה אות, מצאת זוג!'),
    h('div', { class: 'counter' }, pairsEl, triesEl), grid, doneBox);
  enter(grid);
  if (matched.size === N) setTimeout(done, 300);
}

function MirrorChallenge(earnedBefore = 0, res) {
  const ROUNDS = 8;
  const set = curLevel().mirror;
  let items, round = 0, earned = earnedBefore;
  if (res && res.items) { items = res.items; round = res.round; earned = res.earned; }
  else {
    const pools = Object.fromEntries(set.map(L => [L, shuffle(MIRROR_WORDS[L].map((_, i) => i))]));
    items = shuffle(Array.from({ length: ROUNDS }, (_, i) => { const L = set[i % set.length]; const p = pools[L]; return [L, p[Math.floor(i / set.length) % p.length]]; }));
  }

  function play() {
    Resume.save('mirror', { items, round, earned });
    const app = screen('אתגר אותיות מראה');
    const [L, wi] = items[round];
    const it = MIRROR_WORDS[L][wi];
    let solved = false, firstTry = true; Guard.start();
    const sayWord = () => Speech.en(it.w, .7);
    const hint = h('div', { class: 'hint mirror-hint' },
      h('div', { class: 'letters en' }, set.map(x => h('span', null, x))),
      set.includes('b') && set.includes('d') ? h('p', null, '🛏️ טריק: המילה ', en('bed'), ' נראית כמו מיטה.') : null,
      set.map(x => h('p', null, h('b', { class: 'en' }, x), ' – ', MIRROR_RULE[x])));
    const reveal = h('div', { class: 'word-reveal en' });
    const msg = h('p', { class: 'sub' }, g('לחץ על התמונה כדי לשמוע שוב', 'לחצי על התמונה כדי לשמוע שוב'));
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('pairs', earned, () => StagePairs(), 2); else play();
    });
    const cls = set.length === 2 ? 'choices two' : set.length === 4 ? 'choices four' : 'choices';
    const choices = h('div', { class: cls }, shuffle(set).map(x => {
      const b = h('button', { class: 'choice en', type: 'button', 'aria-label': x }, x);
      b.addEventListener('click', () => {
        if (solved) return;
        if (x === L) {
          solved = true; b.classList.add('right'); pop(b); burst(b); earned += Guard.star('pairs');
          Mastery.rec('M:' + L, firstTry);
          reveal.innerHTML = ''; reveal.append(h('b', null, it.w[0]), it.w.slice(1));
          pop(reveal); msg.textContent = `נכון! ${it.he} 🎉`;
          nextBtn.classList.remove('hidden'); sayWord();
          Resume.save('mirror', { items, round: round + 1 < ROUNDS ? round + 1 : round, earned });
        } else {
          b.classList.add('wrong'); shake(b); pop(hint); firstTry = false; Guard.miss();
          msg.textContent = 'כמעט! ' + g('הסתכל', 'הסתכלי') + ' על הכללים למעלה ' + g('ונסה', 'ונסי') + ' שוב 🙂';
          sayWord();
        }
      });
      return b;
    }));
    app.append(progressDots(ROUNDS, round), hint, h('div', { class: 'prompt' }, 'באיזו אות מתחילה המילה?'),
      speakerPic(it.e, sayWord), reveal, msg, choices, nextBtn);
    enter(choices);
    setTimeout(sayWord, 350);
  }
  play();
}

/* =========================================================
   Stage 3: בונים מילה (tap letters, slots fill left -> right)
   ========================================================= */
function tipEl(tip) {
  if (!tip) return null;
  return h('div', { class: 'hint' }, '💡 ', tip.map((p, i) => i % 2 ? en(fmt(p)) : p));
}
function StageBuild(res) {
  const rv = !!(res && res.review);
  const SK = rv ? 'review' : 'build';
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round || 0; earned = res.earned || 0; }
  else list = sessionWords();
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('build', { list: list.map(w => w.w), round: r, earned, review: rv || undefined });

  function play() {
    saveAt(round);
    const app = screen(rv ? 'חזרה: בונים מילה' : 'בונים מילה');
    const item = list[round];
    const letters = [...fmt(item.w)];
    const distract = shuffle(knownABC().map(fmt).filter(x => !letters.includes(x))).slice(0, 2);
    const tiles = shuffle([...letters, ...distract]).map(ch => ({ ch, used: false, el: null }));
    const slots = letters.map(() => null);
    let solved = false, busy = false, firstTry = true; Guard.start();
    const sayWord = () => Speech.en(item.w, .7);
    const size = slotSizeFor(letters.length);

    const msg = h('p', { class: 'sub' }, g('לחץ', 'לחצי') + ' על האותיות לפי הסדר. הן נכנסות משמאל לימין.');
    const extra = h('div');

      else { rafId = 0; setTimeout(() => { if (!rafId) { demo = null; render(); } }, 700); }
    };
    rafId = requestAnimationFrame(step);
  }
  render();
  return { el: canvas, clear, showDemo, check: () => check(true), destroy: stopDemo };
}

function WriteWords(res) {
  let list, wi = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); wi = res.wi; earned = res.earned; }
  else if (Run) list = runWords(Run.rounds);
  else list = [...shuffle(levelWords(1)).slice(0, 2), ...shuffle(levelWords(2)).slice(0, 1), ...shuffle(levelWords(3)).slice(0, 1)];
  const saveAt = w => Resume.save('write-words', { list: list.map(x => x.w), wi: w, round: w, earned });
  function playWord() {
    saveAt(wi);
    const item = list[wi];

      const app = screen('כותבים מילה');

      const nextBtn = nextButton(wi === list.length - 1, () => {
        wi++; if (wi >= list.length) EndScreen('write', earned, () => StageWrite(), 5); else playWord();
      }, 'למילה הבאה ←');
      nextBtn.style.marginTop = '12px';
      const tr = makeTracer(ch, {
        onMsg: t => { msg.textContent = t; },
        onSuccess: c => {
          addStar('write'); earned++; pop(c);
          if (li === letters.length - 1) runAdd(0);   // a whole word written = one round on the map
          track.children[li].className = 'en done'; pop(track.children[li]);
          if (li < letters.length - 1) { burst(c, 8); li++; setTimeout(playLetter, 750); return; }
          burst(track, 22);
          msg.innerHTML = ''; msg.append(g('כתבת', 'כתבת') + ' את המילה ', en(fmt(item.w)), ` = ${item.he}! 🎉`);
          tools.classList.add('hidden'); nextBtn.classList.remove('hidden');
          Speech.en(item.w, .7);
          saveAt(wi + 1 < list.length ? wi + 1 : wi);
        },
      });
      cleanup = tr.destroy;
      const tools = traceTools(tr);
      app.append(progressDots(list.length, wi),
        h('div', { class: 'prompt' }, `${item.e} ${g('כתוב', 'כתבי')} באנגלית: `, h('span', { style: 'color:var(--blue)' }, item.he)),
        track, h('div', { class: 'canvas-wrap' }, tr.el), msg, tools, nextBtn);
      enter(tr.el);
      if (li === 0) setTimeout(() => Speech.en(item.w, .7), 300);
    }
    playLetter();
  }
  playWord();
}

  if (!L.length && !W.length) { toast('אין כרגע מה לחזור עליו 👍'); return Home(); }

/* =========================================================
   Stage 6: קוראים מילה (sound out letter by letter, then pick the picture)
   Only words where every letter keeps its basic sound. The Hebrew line shows how it sounds.
   ========================================================= */
const RD_CONS = { b: 'בּ', c: 'ק', d: 'ד', f: 'פ', g: 'ג', h: 'ה', j: 'ג׳', k: 'ק', l: 'ל', m: 'מ', n: 'נ', p: 'פּ', r: 'ר', s: 'ס', t: 'ט', v: 'ו', w: 'ו', x: 'קס', y: 'י', z: 'ז', ck: 'ק', sh: 'ש', ch: 'צ׳' };
const RD_FINAL = { m: 'ם', n: 'ן', f: 'ף' };
const RD_MARK = { a: 'ַ', e: 'ֶ', i: 'ִ', u: 'ַ', ee: 'ִ' }; // patah, segol, hiriq
const RD_VOW = { a: 'אַ', e: 'אֶ', i: 'אִ', o: 'אוֹ', u: 'אַ', ee: 'אִי' };
const RD_SKIP = ['put', 'push', 'pull', 'full', 'bull', 'bush', 'son', 'ton', 'won', 'front', 'month', 'of', 'was', 'is', 'his', 'has', 'as', 'abc', 'wolf'];
function graphemes(w) {
  const out = [];
  for (let i = 0; i < w.length;) {
    const two = w.slice(i, i + 2);
    if (['ck', 'sh', 'ch', 'ee'].includes(two) || (two.length === 2 && two[0] === two[1] && !'aeiou'.includes(two[0]))) { out.push(two); i += 2; }
    else { out.push(w[i]); i++; }
  }
  return out;
}
const isVow = gr => gr in RD_VOW;
function decodable(w) {
  if (!/^[a-z]{2,6}$/.test(w) || w in MANUAL_TIPS || RD_SKIP.includes(w)) return false;
  if (/th|ph|q|wh|gh|kn|mb|wa|al|ind|ild|.y|ng/.test(w)) return false;
  const gs = graphemes(w);
  const vi = gs.map((x, i) => isVow(x) ? i : -1).filter(i => i >= 0);
  if (vi.length !== 1) return false;
  const v = vi[0];
  if (v === gs.length - 1 && gs[v] !== 'ee') return false;          // go, me: long vowel at the end
  if (['r', 'w', 'y'].includes(gs[v + 1])) return false;              // car, cow
  for (let i = 0; i < gs.length - 1; i++) if ((gs[i] === 'c' || gs[i] === 'g') && /^[ei]/.test(gs[i + 1])) return false; // soft c / g
  return gs.every(x => isVow(x) || RD_CONS[x] || RD_CONS[x[0]]);
}
// Hebrew spelling of how the first `upto` sounds are read
function hebReading(gs, upto = gs.length) {
  let out = '';
  const mark = m => { out = out.endsWith('׳') ? out.slice(0, -1) + m + '׳' : out + m; };
  gs.slice(0, upto).forEach((gr, i) => {
    if (isVow(gr)) {
      if (i === 0) out += 'א';
      if (gr === 'o') out += 'וֹ';
      else { mark(RD_MARK[gr]); if (gr === 'ee') out += 'י'; }
      return;
    }
    const base = RD_CONS[gr] ? gr : gr[0];
    out += (i === gs.length - 1 && RD_FINAL[base]) || RD_CONS[base];
  });
  return out;
}
const soundOf = gr => isVow(gr) ? RD_VOW[gr] : RD_CONS[RD_CONS[gr] ? gr : gr[0]];
function readingPool() {
  const seen = new Set();
  return WORDS.filter(w => w.L <= state.level && decodable(w.w) && !seen.has(w.w) && seen.add(w.w));
}
function StageRead(res) {
  const pool = readingPool();
  let list, round = 0, earned = 0;
  if (res && res.list) { list = res.list.map(findWord).filter(Boolean); round = res.round || 0; earned = res.earned || 0; }
  else if (Run) {
    const ok = new Set(fitWords(Run).map(w => w.w));
    list = runWords(99).filter(w => ok.has(w.w) && decodable(w.w)).slice(0, Run.rounds);
  } else {
    const weak = shuffle(pool.filter(w => Mastery.isWeak('W:' + w.w))).slice(0, 2);
    const cur = shuffle(pool.filter(w => w.L === state.level && !weak.includes(w)));
    const prev = shuffle(pool.filter(w => w.L < state.level && !weak.includes(w)));
    list = [...weak, ...cur, ...prev].slice(0, 6);
  }
  if (!list.length) { toast('אין עדיין מילים לקריאה ברמה הזו'); return Home(); }
  const ROUNDS = list.length;
  const saveAt = r => Resume.save('read', { list: list.map(w => w.w), round: r, earned });

  function play() {
    saveAt(round);
    const app = screen('קוראים מילה');
    const item = list[round];
    const gs = graphemes(item.w);
    let k = 0, solved = false, firstTry = true; Guard.start();
    const msg = h('p', { class: 'sub' }, g('לחץ', 'לחצי') + ' על האותיות לפי הסדר, משמאל לימין, ' + g('ותראה', 'ותראי') + ' איך כל אחת נשמעת.');
    const blend = h('div', { class: 'blend', dir: 'rtl' });
    const ask = h('div', { class: 'hidden' });
    const extra = h('div');
    const nextBtn = nextButton(round === ROUNDS - 1, () => {
      round++; if (round >= ROUNDS) EndScreen('read', earned, () => StageRead(), 6); else play();
    });

    const tiles = gs.map((gr, i) => {
      const b = h('button', { class: 'rtile' + (i === 0 ? ' next' : ''), type: 'button' }, en(fmt(gr)), h('span', { class: 'hs' }));
      b.addEventListener('click', () => {
        if (i !== k) { if (i > k) shake(tiles[k]); return; }
        $('.hs', b).textContent = soundOf(gr);
        b.classList.remove('next'); b.classList.add('done'); pop(b);
        k++;
        blend.textContent = hebReading(gs, k);
        if (k < gs.length) { tiles[k].classList.add('next'); return; }
        msg.textContent = 'ביחד זה נשמע ככה. עכשיו, מה המילה?';
        pop(blend); ask.classList.remove('hidden'); enter(ask);
        ask.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      return b;
    });
    const ts = Math.min(64, slotSizeFor(gs.length, 70));
    tiles.forEach(t => { t.style.minWidth = ts + 'px'; });

    const others = shuffle(WORDS.filter(w => w.w !== item.w && w.e !== item.e && w.L <= state.level));
    const opts = [item];
    for (const w of others) { if (opts.length === 3) break; if (!opts.some(o => o.e === w.e)) opts.push(w); }
    const choices = h('div', { class: 'choices pics' }, shuffle(opts).map(o => {
      const b = h('button', { class: 'choice', type: 'button', 'aria-label': o.he }, o.e);
      b.addEventListener('click', () => {
        if (solved) return;
        if (o === item) {
          solved = true; b.classList.add('right'); pop(b); burst(b); earned += Guard.star('read');
          Mastery.rec('W:' + item.w, firstTry);
          msg.innerHTML = ''; msg.append(g('קראת', 'קראת') + ': ', en(fmt(item.w)), ` = ${item.he} 🎉`);
          const t = tipEl(item.tip); if (t) { extra.append(t); enter(t); }
          nextBtn.classList.remove('hidden');
          Speech.en(item.w, .7);
          saveAt(round + 1 < ROUNDS ? round + 1 : round);
        } else {
          b.classList.add('wrong'); shake(b); firstTry = false; Guard.miss();
          msg.textContent = 'כמעט! ' + g('קרא', 'קראי') + ' שוב את הצלילים למעלה 🙂';
        }
      });
      return b;
    }));
    ask.append(h('div', { class: 'prompt', style: 'margin-top:14px' }, 'איזו תמונה מתאימה למילה?'), choices);

    app.append(progressDots(ROUNDS, round),
      h('div', { class: 'prompt' }, g('קרא', 'קראי') + ' את המילה באנגלית'),
      h('div', { class: 'read-tiles' }, tiles), blend, msg, ask, extra, nextBtn);
    enter($('.read-tiles', app));
  }
  play();
}

/* =========================================================
   The map: one path, station after station, with no end.
   Phase 1: letters two at a time (hear, pairs, write, then words as soon as there are enough).
   Phase 2: words and a spelling test. Phase 3: sentences. Phase 4: endless mixed practice.
   Points: 10 for a right answer on the first try, 3 after one mistake, 0 for a guessed round.
   A station opens the next one only with enough points, and the bar goes up as the child learns.
   Playing a station again never moves the map forward, so there is nothing to farm.

const MAP_GROUPS = ['AB', 'CD', 'EF', 'GH', 'IJ', 'KL', 'MN', 'OP', 'QR', 'ST', 'UV', 'WX', 'YZ'];

  pairs: { icon: '🃏', name: 'זוגות', run: () => StagePairs() },
  write: { icon: '✏️', name: 'כותבים אותיות', run: () => WriteLetters() },
  build: { icon: '🧩', name: 'בונים מילה', run: () => StageBuild() },
  missing: { icon: '🔍', name: 'מה חסר?', run: () => StageMissing() },
  read: { icon: '📖', name: 'קוראים מילה', run: () => StageRead() },
  wwrite: { icon: '📝', name: 'כותבים מילה', run: () => WriteWords() },
  mirror: { icon: '🪞', name: 'אותיות מראה', run: () => MirrorChallenge(0) },

    const letters = grp.split(''); known = [...known, ...letters];

    const base = { phase: 1, letters, known: K, level, opts: Math.min(z.opts, K.length), pct: z.pct, tag: grp };
    const words = fitWords({ known: K }).length;
    add({ ...base, kind: 'listen' });
    add({ ...base, kind: 'pairs', letters: [...letters, ...K.filter(x => !letters.includes(x)).slice(-4)] });
    add({ ...base, kind: 'write', rounds: 2 });
    if (words >= 5) add({ ...base, kind: 'build' });
    if (words >= 8) add({ ...base, kind: 'missing' });
    if (words >= 12 && gi % 2) add({ ...base, kind: 'read', rounds: 6 });
    if (gi % 2) add({ ...base, kind: 'listen', letters: K.slice(-4), tag: 'חזרה', pct: Math.min(.9, z.pct + .05) });

      if (LEVELS[level - 1].mirror) add({ ...base, kind: 'mirror', tag: LEVELS[level - 1].mirror.join(' ') });
      const lv = ALL_ABC.filter(L => findLetter(L).lvl === level);
      add({ ...base, kind: 'listen', letters: lv, rounds: 10, pct: .9, quiz: true, tag: `${lv[0]}–${lv[lv.length - 1]}` });
      add({ ...base, kind: 'chest' });

    const base = { phase: 2, letters: [], known: ALL_ABC, level: wl, wl, opts: 5, pct: .8, tag: `מילים ${wl}` };
    add({ ...base, kind: 'build' }); add({ ...base, kind: 'read', rounds: 6 }); add({ ...base, kind: 'missing' });
    add({ ...base, kind: 'wwrite', rounds: 3 }); add({ ...base, kind: 'build', pct: .9, quiz: true, title: 'מבחן כתיבה' });
    add({ ...base, kind: 'chest' });
  });

  const app = screen('המפה');
  app.append(h('div', { class: 'map-head' }, h('b', null, `⭐ ${mapStars(m)} כוכבים במפה`),
    h('button', { class: 'btn small', onclick: () => LeaderBoard() }, '🏆 טבלה'), h('span', null, `תחנה ${m.at + 1}`)));
  const list = h('div', { class: 'map-list' });
  let phase = 0;
  for (let i = 0; i <= m.at + 5; i++) {
    const s = stationAt(i);
    if (s.phase !== phase) { phase = s.phase; list.append(h('div', { class: 'map-phase' }, `שלב ${phase}: ${PHASES[phase]}`)); }
    const st = i < m.at ? 'done' : i === m.at ? 'now' : 'locked';
    const best = m.best[i] || 0;
    list.append(h('button', { class: `map-st ${st}${s.quiz ? ' quiz' : ''}`, disabled: st === 'locked', onclick: () => startStation(i) },
      h('span', { class: 'ic' }, st === 'locked' ? '🔒' : KIND[s.kind].icon),
      h('span', { class: 'txt' }, h('b', null, `${i + 1}. ${stationTitle(s)}`), s.tag ? h('small', { class: /^[A-Z ]+$/.test(s.tag) ? 'en' : '' }, s.tag) : null),
      h('span', { class: 'got' }, st === 'now' ? 'עכשיו ▶' : st === 'done' ? '★'.repeat(best) + '☆'.repeat(3 - best) : '')));
  }
  app.append(list);
  const now = $('.map-st.now', list); if (now) now.scrollIntoView({ block: 'center' });
}

/* =========================================================
   Start
   ========================================================= */
Profiles.migrate();
{ const act = RAW.get('active', null); if (act && Profiles.get(act)) loadProfile(act); }
Activity.init();
PlayTimer.init();
renderStars();
Home();
afterUpdate();
Sync.refresh();   // children and progress from the parent's other phones

// Install as an app + offline, only when served from the website (not from a WhatsApp file)
if (/^https?:$/.test(location.protocol)) {
  document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }), h('link', { rel: 'apple-touch-icon', href: 'icon-180.png' }));
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
